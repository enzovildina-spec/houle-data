name: Mise à jour des données Houle
on:
  schedule:
    - cron: "40 4,10,16,22 * * *"   # environ 4 h 40 après chaque cycle du modèle (00, 06, 12, 18 h UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/update.yml"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliothèques
        run: |
          sudo apt-get update -y && sudo apt-get install -y libeccodes-dev
          pip install numpy scipy contourpy requests eccodes
      - name: Télécharger et préparer les données
        run: python scripts/build_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
