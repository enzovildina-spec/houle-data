name: Exposition des spots (trait de côte)
# Calcule, pour chaque spot connu, vers où il est ouvert sur le large. Natural Earth est dans le domaine public.
# À lancer à la main (Actions > Exposition des spots > Run workflow) ; le résultat est enregistré dans app/src/data/exposure.json.
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: exposition
  cancel-in-progress: false
jobs:
  exposition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Télécharger le trait de côte (Natural Earth 10 m, terres)
        run: curl --fail --silent --show-error --location -o /tmp/land.geojson https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_land.geojson
      - name: Calculer l'exposition
        run: node app/tools/build-exposure.js /tmp/land.geojson
      - name: Vérifier puis enregistrer
        run: |
          node app/test/logic.test.js
          node app/build.js
          if git diff --quiet app/src/data/exposure.json; then echo "Rien de nouveau"; exit 0; fi
          git config user.name "houle-bot"
          git config user.email "houle-bot@users.noreply.github.com"
          git add app/src/data/exposure.json
          git commit -m "Exposition des spots recalculée d'après le trait de côte"
          git push origin HEAD:main
          gh workflow run update.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
