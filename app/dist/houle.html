      '<p>Autres façons de placer un spot :</p><ul class="howto"><li>Écris un lieu dans la barre de recherche de la carte.</li><li>Colle des coordonnées GPS, par exemple <code>43.48, -1.55</code>.</li><li>Appuie sur la cible <b>⌖</b> pour utiliser ta position.</li></ul>' +
      '<p>Les <b>pastilles</b> sont des <b>spots connus</b> déjà placés pour toi (France pour l\'instant) : <span class="sw sw--s"></span> rond bleu = surf, <span class="sw sw--b"></span> losange rose = bodyboard, <span class="sw sw--l"></span> triangle jaune = longboard. Touche-en une pour voir ses conditions conseillées et la houle prévue, puis « Ajouter à mes spots ». Les boutons en bas de la carte filtrent par discipline, et le bouton à 4 points masque tout. Leur position est à confirmer sur satellite.</p>' +
      '<p>Le bouton en forme de couches change la carte en <b>vue satellite</b> : pratique pour repérer les bancs de sable.</p>' },
    { t: '2. Remplir la fiche du spot', b: () =>
      '<p>Tu peux ajouter des <b>notes</b> (parking, marée, danger…), jusqu\'à 6 <b>photos</b> et ton lien préféré (Windguru, Windy, Ifremer…).</p>' +
      '<p>Surtout, règle tes <b>conditions idéales</b> : houle minimum et maximum, période, vent maximum, direction du vent, heures où tu peux surfer. Les valeurs proposées sont un bon point de départ.</p>' },
    { t: '3. Lire les prévisions', b: () =>
      '<p>Chaque spot affiche <b>8 jours</b> de prévisions sous forme de cases :</p>' +
      '<ul class="howto legend"><li>' + swatch('good', '<b>Vert</b> : une session est possible.') + '</li><li>' + swatch('maybe', '<b>Ambre</b> : un créneau court seulement.') + '</li><li>' + swatch('no', '<b>Gris</b> : pas pour toi (trop petit, trop grand, trop de vent…).') + '</li></ul>' +
      '<p>Touche un spot pour voir le détail heure par heure. Sur la carte, les repères <b>verts</b> sont les spots bons dans les 3 prochains jours.</p>' +
      '<p>Le petit <b>emoji</b> sur un spot donne la plus grosse houle attendue dans les 3 prochains jours : 💤 plat (moins de 0,5 m), 〰️ petite houle, 🌊 bonne houle (1 à 1,8 m), 🔥 grosse houle (1,8 à 2,8 m), ⚠️ houle énorme (plus de 2,8 m).</p>' },
    { t: 'La carte Conditions', b: () =>
      '<p>Sur la carte, le bouton <b>« Conditions »</b> remplace les spots par la météo de toute la zone visible, façon Windy :</p>' +
      '<ul class="howto"><li><b>Vent</b> : champ coloré avec des traits qui bougent dans le sens du vent (km/h).</li><li><b>Houle</b> : couleur seulement sur l\'eau, avec hauteur, période et direction.</li><li>Les deux sont des vues séparées : touche « Vent » ou « Houle ». « Pression » ajoute les isobares, avec H (anticyclone) et L (dépression).</li></ul>' +
      '<p>Déplace ou zoome : les données se mettent à jour. Le <b>curseur</b> montre les prochaines heures (environ 4 jours). Touche un point pour le détail heure par heure.</p>' +
      '<p class="muted">Touche la carte : un tableau heure par heure sur 7 jours s\'ouvre (vent, rafales, houle, période, puissance), avec un bouton par jour. Au-delà de 4 jours, la prévision est moins fiable.</p>' },
    { t: '4. Recevoir des alertes', b: () =>
      '<p>Dans la fiche d\'un spot, choisis <b>quand être prévenu</b> : 7 jours avant, 3 jours avant, la veille ou le matin même.</p>' +
      '<p>Va dans l\'onglet <b>Alertes</b> et autorise les notifications. Elles s\'affichent <b>quand Houle est ouverte</b> dans ton navigateur : garde l\'onglet ouvert, ou rouvre l\'appli régulièrement.</p>' },
    { t: '5. Garder tes données', b: () => {
      const social = S.store && S.store.social;
      return '<p>Tes spots sont enregistrés <b>sur cet appareil</b>. Dans l\'onglet <b>Spots</b>, utilise <b>« Exporter une sauvegarde »</b> de temps en temps.</p>' +
        (social
          ? '<p>Avec ton compte, tu peux aussi : ajouter des <b>amis</b> (onglet Amis), leur <b>partager un spot</b> en masquant ou non ta description, leur envoyer une <b>session</b> (« j\'y vais à 13 h »), et créer des <b>cartes communes</b> (onglet Cartes). Tes spots restent privés tant que tu ne les partages pas.</p>'
          : '<p class="muted">Les amis, les partages et les cartes communes ne sont pas activés dans cette version : ils demandent un petit serveur gratuit (voir le guide <b>LISEZ-MOI</b>). Tout le reste fonctionne déjà.</p>') +
        '<p>Tu peux relire ce tutoriel à tout moment avec le bouton <b>?</b> en haut.</p>';
    } },
  ];

  let step = 0;
  function show() {
    const s = STEPS[step], last = step === STEPS.length - 1;
    const dots = STEPS.map((_, i) => '<span class="dot' + (i === step ? ' on' : '') + '"></span>').join('');
    A.dialog.open(
      '<div class="dlg tour"><div class="tour-head"><span class="tour-count">' + (step + 1) + ' / ' + STEPS.length + '</span><button class="btn btn-small" data-act="tourSkip">Passer</button></div>' +
      '<h2>' + s.t + '</h2><div class="tour-body">' + s.b() + '</div>' +
      '<div class="dots" aria-hidden="true">' + dots + '</div>' +
      '<div class="dlg-actions">' + (step ? '<button class="btn" data-act="tourPrev">Précédent</button>' : '') +
      '<button class="btn btn-primary" data-act="' + (last ? 'tourSkip' : 'tourNext') + '" style="margin-left:auto">' + (last ? 'C\'est parti' : 'Suivant') + '</button></div></div>',
      null, { onclose: done }
    );
  }
  function done() { try { localStorage.setItem(KEY, '1'); } catch (e) { /* ignore */ } }

  A.openTour = () => { step = 0; show(); };
  A.maybeTour = () => {
    let seen = false;
    try { seen = !!localStorage.getItem(KEY); } catch (e) { /* ignore */ }
    if (!seen && !$dlgOpen()) A.openTour();
  };
  const $dlgOpen = () => { const d = document.getElementById('dlg'); return d && d.open; };

  Object.assign(A.actions, {
    tour() { A.openTour(); },
    tourNext() { step = Math.min(step + 1, STEPS.length - 1); show(); },
    tourPrev() { step = Math.max(step - 1, 0); show(); },
    tourSkip() { done(); A.dialog.close(); },
  });
})();

/* ===== app-a11y ===== */
/* Houle - accessibilité : écran d'accueil « Es-tu en situation de handicap ? », confort de lecture, voix */
(function () {
  const H = globalThis.Houle, A = H.app, S = A.S, U = H.util, AX = H.a11y;
  const KEY = 'houle.a11y.v1', ASKED = 'houle.a11y.asked';
  const $dlgOpen = () => { const d = document.getElementById('dlg'); return d && d.open; };

  const load = () => { try { return AX.normalize(JSON.parse(localStorage.getItem(KEY) || 'null')); } catch (e) { return AX.normalize(null); } };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(AX.settings)); } catch (e) { /* ignoré */ } };
  AX.settings = load();

  /* applique les réglages à toute l'appli */
  function apply() {
    const s = AX.settings, c = document.documentElement.classList;
    c.toggle('a11y-t1', s.text === 1); c.toggle('a11y-t2', s.text === 2);
    c.toggle('a11y-hc', s.contrast); c.toggle('a11y-rm', s.motion); c.toggle('a11y-big', s.big);
    if (s.accessOnly) S.accessOnly = true;
  }
  A.applyA11y = apply;
  apply();

  /* ---------- voix ---------- */
  const canSpeak = () => !!(globalThis.speechSynthesis && globalThis.SpeechSynthesisUtterance);
  AX.speak = (text) => {
    if (!canSpeak()) { A.toast('Ce téléphone ne propose pas la lecture à voix haute.', 'error'); return false; }
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text); u.lang = 'fr-FR'; u.rate = 0.95;
      speechSynthesis.speak(u);
    } catch (e) { return false; }
    return true;
  };
  AX.stop = () => { try { if (canSpeak()) speechSynthesis.cancel(); } catch (e) { /* ignoré */ } };
  A.voiceButtons = (kind, id) => (AX.settings.voice && canSpeak()
    ? '<button class="btn btn-small" data-act="' + (kind === 'alerts' ? 'speakAlerts' : 'speakSpot') + '"' + (id ? ' data-id="' + U.esc(id) + '"' : '') + '>🔊 Écouter</button><button class="btn btn-small" data-act="speakStop">Arrêter la voix</button>' : '');

  /* ---------- l'écran de réglages ---------- */
  const opt = (id, label, hint, checked) => '<label class="chk a11y-opt"><input type="checkbox" id="' + id + '"' + (checked ? ' checked' : '') + '><span><b>' + label + '</b>' + (hint ? '<small>' + hint + '</small>' : '') + '</span></label>';
  function dialog(first) {
    const s = AX.settings;
    A.dialog.open(
      '<div class="dlg a11y"><h2>' + (first ? 'Es-tu en situation de handicap ?' : 'Accessibilité et confort') + '</h2>' +
      '<p>Coche ce qui t\'aide. Tu peux tout changer plus tard avec le bouton ♿ en haut. Rien n\'est obligatoire : tu peux aussi continuer sans rien cocher.</p>' +
      '<fieldset class="grp"><legend>Vue</legend>' +
      opt('a_t1', 'Texte plus gros', 'Les listes, fiches et menus sont agrandis.', s.text === 1) +
      opt('a_t2', 'Texte très gros', 'Encore plus grand (remplace « plus gros »).', s.text === 2) +
      opt('a_hc', 'Contraste fort', 'Noir sur blanc, bordures marquées : plus lisible en plein soleil ou avec une vue fragile.', s.contrast) +
      opt('a_voice', 'Lecture à voix haute (aveugle ou malvoyant)', 'Un bouton « Écouter » lit un spot ou les alertes : discipline, prochaine session, houle, vent, accessibilité. Quand tu ouvres un spot, la lecture démarre toute seule. Pour tout l\'écran, active aussi VoiceOver (iPhone) ou TalkBack (Android) : l\'appli est faite pour les accompagner.', s.voice) +
      '</fieldset>' +
      '<fieldset class="grp"><legend>Mobilité</legend>' +
      opt('a_acc', 'Montrer d\'abord les spots accessibles', 'Fauteuil, béquilles, marche difficile : Mes spots ne garde que les spots où parking, accès au sable et chemin sont notés « oui » (tu peux enlever le filtre à tout moment).', s.accessOnly) +
      opt('a_big', 'Grands boutons', 'Zones à toucher plus larges, utile si les petits boutons sont difficiles à viser (tremblements, doigts engourdis, gants).', s.big) +
      '</fieldset>' +
      '<fieldset class="grp"><legend>Audition</legend><p class="fine">Sourd ou malentendant : Houle n\'utilise <b>aucun son</b>. Tout est écrit (alertes, prévisions) et les notifications s\'affichent à l\'écran.</p></fieldset>' +
      '<fieldset class="grp"><legend>Mouvement</legend>' +
      opt('a_rm', 'Moins d\'animations', 'Arrête les filets de vent et de houle qui bougent (vertiges, migraines, épilepsie). Des flèches fixes les remplacent.', s.motion) +
      '</fieldset>' +
      '<fieldset class="grp"><legend>Comprendre plus simplement</legend><p class="fine">Pas encore disponible : un affichage simplifié (moins de chiffres, une phrase par spot). C\'est prévu.</p></fieldset>' +
      '<div class="dlg-actions"><span class="sp"></span><button class="btn btn-primary" data-act="a11ySave">' + (first ? 'Continuer' : 'Enregistrer') + '</button></div></div>',
      (d) => {
        // « texte plus gros » et « très gros » s'excluent
        const t1 = d.querySelector('#a_t1'), t2 = d.querySelector('#a_t2');
        t1.addEventListener('change', () => { if (t1.checked) t2.checked = false; });
        t2.addEventListener('change', () => { if (t2.checked) t1.checked = false; });
      }
    );
  }
  A.openA11y = (first) => dialog(!!first);

  const afterFirst = A.maybeTour;
  A.maybeTour = () => {
    let asked = false;
    try { asked = !!localStorage.getItem(ASKED); } catch (e) { /* ignoré */ }
    if (!asked && !$dlgOpen()) dialog(true); else afterFirst();
  };

  const speakSpot = (id) => {
    const sp = S.spots.find((x) => x.id === id);
    if (!sp) return;
    const f = S.fc[id];
    AX.speak(AX.spotSpeech(sp, f && f.days));
  };

  Object.assign(A.actions, {
    a11y() { dialog(false); },
    a11ySave() {
      const g = (id) => document.getElementById(id).checked;
      const wasVoice = AX.settings.voice;
      AX.settings = AX.normalize({ text: g('a_t2') ? 2 : g('a_t1') ? 1 : 0, contrast: g('a_hc'), motion: g('a_rm'), big: g('a_big'), voice: g('a_voice'), accessOnly: g('a_acc') });
      if (!AX.settings.accessOnly) S.accessOnly = false;
      save(); apply();
      try { localStorage.setItem(ASKED, '1'); } catch (e) { /* ignoré */ }
      A.dialog.close();
      A.render();
      if (AX.settings.voice && !wasVoice) AX.speak('Lecture à voix haute activée. Ouvre un spot pour l\'entendre.');
      if (!document.getElementById('dlg').open) setTimeout(() => { let seen = false; try { seen = !!localStorage.getItem('houle.tour.v1'); } catch (e) { /* ignoré */ } if (!seen) afterFirst(); }, 80);
    },
    speakSpot(el) { speakSpot(el.dataset.id); },
    speakAlerts() { AX.speak(AX.alertsSpeech(S.alerts.filter((a) => { const sp = S.spots.find((s) => s.id === a.spotId); return !sp || A.inNear(sp); }))); },
    speakStop() { AX.stop(); },
  });

  // en mode voix, ouvrir un spot le lit
  const sel = A.selectSpot;
  A.selectSpot = (id, fly) => {
    sel(id, fly);
    if (AX.settings.voice && canSpeak()) setTimeout(() => speakSpot(id), 400);
  };
})();

/* ===== app-known ===== */
/* Houle - spots connus (base de départ, à confirmer sur satellite) */
(function () {
  const H = globalThis.Houle, A = H.app, S = A.S, U = H.util, F = H.forecast;
  const esc = U.esc;
  const TYPES = { beach: 'beach break', reef: 'reef', point: 'point break', rivermouth: 'embouchure', other: 'spot' };
  const DISC = { s: { n: 'Surf', c: 'surf' }, b: { n: 'Bodyboard', c: 'body' }, l: { n: 'Longboard', c: 'long' } };
  const TIDE = { low: 'marée basse', mid: 'mi-marée', high: 'marée haute', all: 'toutes marées' };
  const LEVEL = { beginner: 'débutant', intermediate: 'intermédiaire', advanced: 'confirmé', all: 'tous niveaux' };
  const norm = (s) => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();

  const KNOWN = (H.knownSpots || []).map((r, i) => {
    const x = r[6] || {};
    return { i, name: r[0], lat: r[1], lon: r[2], type: r[3], region: r[4], sure: r[5] === 1, p: x.p || 's', d: x.d || [-1, -1, -1], sw: x.sw || null, wd: x.wd || null, ti: x.ti || null, sz: x.sz || null, lv: x.lv || null, alt: x.alt || null, est: !!x.est, read: !!x.ok, ex: (H.exposure && H.exposure.lookup(r[1], r[2])) || null, n: norm(r[0] + ' ' + r[4] + ' ' + (x.alt || '')) };
  });
  A.known = KNOWN;
  A.knownRules = (k) => rulesFor(k);
  const kfc = {}; // prévisions chargées pour les spots connus
  const kacc = {}; // accessibilité cherchée dans OpenStreetMap (spots connus)

  A.searchKnown = (q) => {
    const t = norm(q);
    if (t.length < 2) return [];
    const words = t.split(' ');
    return KNOWN.filter((k) => words.every((w) => k.n.indexOf(w) !== -1)).slice(0, 6);
  };

  const arc = (a) => (a ? U.compass(a[0]) + ' → ' + U.compass(a[1]) + ' (' + a[0] + '° à ' + a[1] + '°)' : null);
  const sayDisc = (k) => {
    const lab = ['Surf', 'Bodyboard', 'Longboard'];
    const best = [], ok = [];
    k.d.forEach((v, j) => { if (v === 2) best.push(lab[j]); else if (v === 1) ok.push(lab[j]); });
    return (best.length ? '<b>' + best.join(', ') + '</b>' : '') + (ok.length ? (best.length ? ' · possible : ' : 'possible : ') + ok.join(', ') : '');
  };

  /* le spot est-il déjà dans mes spots (moins de 150 m) ? */
  function mine(k) {
    const R = 6371000, p = Math.PI / 180;
    return S.spots.find((s) => {
      const x = (s.lon - k.lon) * p * Math.cos(((s.lat + k.lat) / 2) * p), y = (s.lat - k.lat) * p;
      return R * Math.hypot(x, y) < 150;
    });
  }

  function rulesFor(k) {
    const r = { disc: k.p };
    if (k.ti) r.tide = k.ti;
    const sw = k.sw || (k.ex && k.ex.o), wd = k.wd || (k.ex && k.ex.w);
    if (sw && !(sw[0] === 0 && sw[1] === 360)) { r.swellOn = true; r.swellFrom = sw[0]; r.swellTo = sw[1]; }
    if (wd) { r.dirOn = true; r.dirFrom = wd[0]; r.dirTo = wd[1]; }
    if (k.sz) { r.waveMin = k.sz[0]; r.waveMax = k.sz[1]; }
    return r;
  }

  function accBlock(i) {
    const a = kacc[i];
    if (!a) return '<button class="btn btn-small" data-act="knownAcc" data-i="' + i + '">♿ Accessibilité (OpenStreetMap)</button>';
    if (a === 'loading') return '<p class="fine">Recherche dans OpenStreetMap…</p>';
    if (a.error) return '<p class="fine">' + esc(a.error) + ' <button class="btn btn-small" data-act="knownAcc" data-i="' + i + '">Réessayer</button></p>';
    return A.accessBlock(a.data, true);
  }

  function fcBlock(i) {
    const f = kfc[i];
    if (!f) return '<button class="btn btn-small" data-act="knownFc" data-i="' + i + '">🌊 Voir la houle prévue</button>';
    if (f.status === 'loading') return '<p class="fine">Chargement de la prévision…</p>';
    if (f.status === 'error') return '<p class="fine">' + esc(f.error) + ' <button class="btn btn-small" data-act="knownFc" data-i="' + i + '">Réessayer</button></p>';
    const e = F.swellEmoji(f.days), kex = KNOWN[i].ex;
    const cells = f.days.map((d, j) => '<div class="cell cell--' + d.status + '" title="' + esc(U.fmtDay(d.date)) + '"><span class="cd">' + (j === 0 ? 'auj.' : esc(U.weekdayShort(d.date))) + '</span><span class="cb"><i style="height:' + Math.max(10, Math.min(100, Math.round(((d.waveMax || 0) / 4) * 100))) + '%"></i></span><span class="cv">' + U.num(d.stats.wave) + '</span></div>').join('');
    return '<p class="kfc-head"><span class="swe big">' + e.emoji + '</span> <b>' + e.label + '</b> dans les 3 prochains jours (jusqu\'à ' + U.num(e.wave) + ' m)</p><div class="strip">' + cells + '</div>' +
      '<p class="fine">Vert : conditions réunies d\'après les réglages conseillés pour ce spot. Houle du modèle Open-Meteo, au large' + (kex ? ', réduite quand elle vient d\'une direction masquée par la côte (estimation simple)' : '') + '.</p>';
  }

  A.showKnown = (i, fly) => {
    const k = KNOWN[i];
    if (!k) return;
    if (fly) S.mapObj.flyTo(k.lat, k.lon, 15);
    const have = mine(k);
    const cond = [];
    const EST = ' <span class="fine">(estimation d\'après la côte)</span>';
    if (k.sw) cond.push('<li>Houle : <b>' + arc(k.sw) + '</b></li>');
    else if (k.ex) cond.push('<li>Houle : <b>' + arc(k.ex.o) + '</b>' + EST + '</li>');
    if (k.wd) cond.push('<li>Vent favorable : <b>' + arc(k.wd) + '</b></li>');
    else if (k.ex && k.ex.w) cond.push('<li>Vent offshore : <b>' + arc(k.ex.w) + '</b>' + EST + '</li>');
    if (k.ti) cond.push('<li>Marée : <b>' + TIDE[k.ti] + '</b></li>');
    if (k.sz) cond.push('<li>Taille : <b>' + k.sz[0] + ' à ' + k.sz[1] + ' m</b></li>');
    if (k.lv) cond.push('<li>Niveau : <b>' + LEVEL[k.lv] + '</b></li>');
    A.dialog.open(
      '<div class="dlg"><h2><i class="dchip dchip--' + DISC[k.p].c + '"></i>' + esc(k.name) + '</h2>' +
      '<p class="muted">' + esc(k.region) + ' · ' + (TYPES[k.type] || 'spot') + (k.alt ? ' · aussi : ' + esc(k.alt) : '') + '</p>' +
      '<p class="fine">' + U.fmtCoords(k.lat, k.lon) + '</p>' +
      '<p>' + sayDisc(k) + (k.est ? ' <span class="fine">(estimé d\'après le type de spot)</span>' : ' <span class="fine">(indicatif)</span>') + '</p>' +
      (cond.length ? '<h4>Conditions conseillées</h4><ul class="howto">' + cond.join('') + '</ul>' : '<p class="fine">Pas de conditions publiées trouvées pour ce spot : règle les tiennes après l\'ajout.</p>') +
      '<div id="kfc">' + fcBlock(i) + '</div>' +
      '<div id="kacc">' + accBlock(i) + '</div>' +
      '<p class="knote">Position <b>' + (k.sure ? 'recoupée sur plusieurs sources' : 'issue d\'une seule source') + '</b>, précise à environ 300 à 500 m : c\'est souvent le parking ou la plage, pas le pic exact. Après l\'ajout, passe en <b>vue satellite</b> et déplace le repère sur le pic.</p>' +
      '<div class="dlg-actions"><button class="btn" data-act="closeDlg">Fermer</button><span class="sp"></span>' +
      (have ? '<button class="btn btn-primary" data-act="selectMine" data-id="' + esc(have.id) + '">Déjà dans mes spots</button>'
        : '<button class="btn btn-primary" data-act="addKnown" data-i="' + i + '">Ajouter à mes spots</button>') + '</div></div>'
    );
  };

  async function loadKnownFc(i) {
    const k = KNOWN[i];
    kfc[i] = { status: 'loading' };
    const box = () => document.getElementById('kfc');
    if (box()) box().innerHTML = fcBlock(i);
    try {
      const data = await F.getForecast(k.lat, k.lon);
      kfc[i] = { status: 'ok', days: F.evaluateSpot(k.ex ? Object.assign({}, data, { hours: H.exposure.attenuate(data.hours, k.ex) }) : data, rulesFor(k)) };
      S.mapObj.setKnownEmoji(i, F.swellEmoji(kfc[i].days).emoji);
    } catch (e) { kfc[i] = { status: 'error', error: e.message }; }
    if (box()) box().innerHTML = fcBlock(i);
  }

  Object.assign(A.actions, {
    goKnown(el) { document.getElementById('searchResults').hidden = true; A.showKnown(parseInt(el.dataset.i, 10), true); },
    async knownAcc(el) {
      const i = parseInt(el.dataset.i, 10), k = KNOWN[i], box = () => document.getElementById('kacc');
      kacc[i] = 'loading'; if (box()) box().innerHTML = accBlock(i);
      try { kacc[i] = { data: await H.access.lookupOsm(k.lat, k.lon) }; } catch (e) { kacc[i] = { error: e.message || 'OpenStreetMap indisponible' }; }
      if (box()) box().innerHTML = accBlock(i);
    },
    knownFc(el) { return loadKnownFc(parseInt(el.dataset.i, 10)); },
    addKnown(el) {
      const k = KNOWN[parseInt(el.dataset.i, 10)];
      A.dialog.close();
      S.mapObj.flyTo(k.lat, k.lon, 16);
      A.openSpotDialog(null, { lat: k.lat, lon: k.lon, name: k.name, rules: Object.assign(rulesFor(k), kacc[k.i] && kacc[k.i].data && !H.access.isEmpty(kacc[k.i].data) ? { access: kacc[k.i].data } : {}), notes: 'Position de départ issue de la base de spots connus (à confirmer sur satellite).' + (k.read ? ' Conditions conseillées lues sur des sites de spots.' : '') });
    },
    selectMine(el) { A.dialog.close(); A.selectSpot(el.dataset.id, true); },
    kfilter(el) {
      const key = el.dataset.k;
      document.querySelectorAll('#kFilter [data-act="kfilter"]').forEach((b) => b.setAttribute('aria-pressed', String(b === el)));
      const idx = { s: 0, b: 1, l: 2 }[key];
      S.mapObj.setKnownFilter(key === 'all' ? null : (k) => k.d[idx] >= 1 || (k.d.every((v) => v < 0) && k.p === key));
      const n = KNOWN.filter((k) => key === 'all' || k.d[idx] >= 1).length;
      A.toast(key === 'all' ? KNOWN.length + ' spots connus' : n + ' spots : ' + DISC[key].n.toLowerCase());
    },
  });

  A.initKnown = () => {
    if (!S.mapObj || !S.mapObj.ready) return;
    S.mapObj.setKnown(KNOWN);
    const b = document.getElementById('btnKnown');
    b.addEventListener('click', () => {
      const on = b.getAttribute('aria-pressed') !== 'true';
      b.setAttribute('aria-pressed', String(on));
      S.mapObj.setKnownVisible(on);
      document.getElementById('kFilter').hidden = !on;
      A.toast(on ? KNOWN.length + ' spots connus affichés' : 'Spots connus masqués');
    });
  };
})();

/* ===== app-weekend ===== */
/* Houle - onglet « Week-end » : classement des spots autour de moi selon mes critères */
(function () {
  const H = globalThis.Houle, A = H.app, S = A.S, U = H.util, F = H.forecast;
  const esc = U.esc;
  const W = { status: 'idle', radius: 100, disc: 's', center: null, centerLabel: '', results: [], done: 0, total: 0, error: '', token: 0 };
  const DISC = { s: ['Surf', 0], b: ['Bodyboard', 1], l: ['Longboard', 2] };
  const MAX_SPOTS = 24;

  const km = (a, b) => {
    const r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
    const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
    return 12742 * Math.asin(Math.sqrt(x));
  };
  const isWeekend = (date) => { const d = U.dayDate(date).getDay(); return d === 0 || d === 6; };

  // spots candidats : mes spots (leurs propres critères) + spots connus de la discipline choisie
  function candidates() {
    const idx = DISC[W.disc][1], out = [];
    (S.spots || []).forEach((s) => out.push({ kind: 'mine', id: s.id, name: s.name, region: 'Mon spot', lat: s.lat, lon: s.lon, rules: s.rules }));
    (A.known || []).forEach((k) => {
      if (k.d[idx] >= 1 || (k.d.every((v) => v < 0) && k.p === W.disc)) out.push({ kind: 'known', i: k.i, name: k.name, region: k.region, lat: k.lat, lon: k.lon, rules: Object.assign(A.knownRules(k), { disc: W.disc }) });
    });
    out.forEach((c) => { c.km = km(W.center, c); });
    return out.filter((c) => c.km <= W.radius).sort((a, b) => a.km - b.km).slice(0, MAX_SPOTS);
  }

  // note d'un spot sur les jours de week-end (bon créneau = 2 points, créneau limite = 1)
  function score(days) {
    const we = days.filter((d) => isWeekend(d.date));
    const use = we.length ? we : days.slice(0, 2);
    let pts = 0, best = null;
    use.forEach((d) => {
      const p = d.status === 'good' ? 2 : d.status === 'maybe' ? 1 : 0;
      pts += p;
      if (!best || p > best.p || (p === best.p && d.window && best.d.window && d.window.len > best.d.window.len)) best = { p, d };
    });
    return { pts, best };
  }

  async function run() {
    if (!W.center) return;
    const token = ++W.token, list = candidates();
    W.status = 'loading'; W.results = []; W.done = 0; W.total = list.length; W.error = '';
    A.render();
    if (!list.length) { W.status = 'ok'; A.render(); return; }
    let next = 0;
    const worker = async () => {
      while (next < list.length) {
        const c = list[next++];
        try {
          const data = await F.getForecast(c.lat, c.lon);
          if (token !== W.token) return;
          const days = F.evaluateSpot(data, c.rules), sc = score(days);
          W.results.push(Object.assign({ days }, c, sc));
        } catch (e) {
          if (/429|Trop de requêtes/.test(e.message || '')) W.error = 'Open-Meteo est saturé : réessaie dans quelques minutes.';
        }
        W.done++;
        if (token === W.token) A.render();
      }
    };
    await Promise.all([worker(), worker(), worker(), worker()]);
    if (token !== W.token) return;
    W.results.sort((a, b) => b.pts - a.pts || a.km - b.km);
    W.status = 'ok';
    A.render();
  }

  const stat = (d) => U.num(d.stats.wave) + ' m à ' + U.num(d.stats.period, 0) + ' s · vent ' + U.num(d.stats.wind, 0) + ' km/h ' + U.compass(d.stats.windDir);
  function card(r, n) {
    const d = r.best.d, good = r.best.p === 2;
    const when = U.fmtDay(d.date) + (d.window ? ' · ' + F.windowText(d.window) : '');
    return '<article class="wk wk--' + (good ? 'good' : r.best.p ? 'maybe' : 'no') + '"><div class="wk-rank">' + n + '</div><div class="wk-main">' +
      '<div class="wk-name">' + esc(r.name) + ' <span class="fine">' + esc(r.region) + ' · ' + Math.round(r.km) + ' km</span></div>' +
      (r.best.p ? '<div class="wk-when"><b>' + (good ? 'Bon créneau' : 'Créneau limite') + '</b> ' + esc(when) + '</div><div class="fine">' + esc(stat(d)) + '</div>' : '<div class="fine">Pas de créneau correct ce week-end' + (d.fail ? ' : ' + esc(F.failText(d)) : '') + '</div>') +
      '</div><button class="btn btn-small" data-act="wkOpen" data-kind="' + r.kind + '" data-id="' + esc(String(r.kind === 'mine' ? r.id : r.i)) + '">Voir</button></article>';
  }

  A.renderers.weekend = () => {
    const chip = (k) => '<button type="button" class="kf" data-act="wkDisc" data-k="' + k + '" aria-pressed="' + (W.disc === k) + '">' + DISC[k][0] + '</button>';
    const rad = [50, 100, 200].map((r) => '<button type="button" class="kf" data-act="wkRadius" data-k="' + r + '" aria-pressed="' + (W.radius === r) + '">' + r + ' km</button>').join('');
    let out = '<div class="wk-head"><h2>Où surfer ce week-end ?</h2><p class="fine">Je classe les spots autour de toi selon tes critères (houle, période, vent) pour samedi et dimanche. Pour tes propres spots, ce sont les critères que tu as réglés ; pour les spots connus, ceux conseillés.</p>' +
      '<div class="row">' + chip('s') + chip('b') + chip('l') + '</div><div class="row"><span class="fine">Rayon</span>' + rad + '</div>' +
      '<div class="row"><button class="btn btn-primary" data-act="wkLocate">' + A.icon('locate') + 'Autour de ma position</button><button class="btn" data-act="wkMap">Autour du centre de la carte</button></div>' +
      (W.center ? '<p class="fine">Centre : ' + esc(W.centerLabel) + '</p>' : '') + '</div>';
    if (W.status === 'loading') out += '<p class="fine" aria-live="polite">Analyse des prévisions… ' + W.done + ' / ' + W.total + ' spots</p>';
    if (W.error) out += '<p class="cp-warn" role="note">' + esc(W.error) + '</p>';
    if (W.status === 'ok') {
      const top = W.results.slice(0, 10);
      out += top.length ? '<div class="wk-list">' + top.map((r, i) => card(r, i + 1)).join('') + '</div>' + (W.results.some((r) => r.pts > 0) ? '' : '<p class="fine">Aucun bon créneau ce week-end dans ce rayon : essaie un rayon plus large.</p>')
        : '<p class="fine">Aucun spot dans ce rayon. Agrandis le rayon.</p>';
      out += '<p class="fine">Prévisions Open-Meteo, houle au large : à confirmer avant de partir. Seuls les ' + MAX_SPOTS + ' spots les plus proches sont analysés.</p>';
    }
    return out;
  };

  Object.assign(A.actions, {
    wkDisc(el) { W.disc = el.dataset.k; if (W.center) run(); else A.render(); },
    wkRadius(el) { W.radius = parseInt(el.dataset.k, 10); if (W.center) run(); else A.render(); },
    async wkLocate() {
      try { const p = await S.mapObj.locate(); W.center = { lat: p.lat, lon: p.lon }; W.centerLabel = 'ta position'; run(); } catch (e) { A.fail(e); }
    },
    wkMap() {
      const raw = S.mapObj.raw;
      const c = raw && raw.getCenter ? raw.getCenter() : null;
      if (!c) { A.toast('Carte indisponible : utilise ta position.', 'error'); return; }
      W.center = { lat: c.lat, lon: c.lng }; W.centerLabel = U.fmtCoords(c.lat, c.lng); run();
    },
    wkOpen(el) {
      if (el.dataset.kind === 'mine') { S.tab = 'spots'; A.selectSpot(el.dataset.id, true); } else A.showKnown(parseInt(el.dataset.id, 10), true);
    },
  });
  A.weekend = W;
})();

/* ===== app-tide ===== */
/* Houle - onglet « Marées » : heures et hauteurs de pleine et basse mer d'un port ou d'un spot, sur 7 jours.
   Source : modèle de marée d'Open-Meteo (gratuit), ordre de grandeur. Pour l'horaire officiel : annuaire du SHOM (lien). */
(function () {
  const H = globalThis.Houle, A = H.app, S = A.S, U = H.util, K = H.cond;
  const esc = U.esc;
  const T = { place: null, status: 'idle', data: null, error: '', token: 0 };
  /* ports : nom, latitude, longitude (point proche de l'eau) */
  const PORTS = [
    ['Dunkerque', 51.05, 2.37], ['Calais', 50.97, 1.85], ['Dieppe', 49.93, 1.08], ['Le Havre', 49.48, 0.1], ['Cherbourg', 49.65, -1.62],
    ['Saint-Malo', 48.65, -2.03], ['Roscoff', 48.73, -3.98], ['Brest', 48.38, -4.49], ['Camaret-sur-Mer', 48.28, -4.59], ['Audierne', 48.02, -4.55],
    ['Saint-Guénolé (Penmarc\'h)', 47.80, -4.38], ['Concarneau', 47.87, -3.92], ['Lorient', 47.73, -3.36], ['Quiberon', 47.48, -3.12], ['La Trinité-sur-Mer', 47.58, -3.0],
    ['Le Croisic', 47.29, -2.52], ['Saint-Nazaire', 47.27, -2.2], ['Les Sables-d\'Olonne', 46.49, -1.8], ['La Rochelle', 46.15, -1.17], ['Royan', 45.62, -1.03],
    ['Cap Ferret (Arcachon)', 44.64, -1.25], ['Mimizan', 44.21, -1.29], ['Capbreton', 43.65, -1.45], ['Biarritz', 43.48, -1.56], ['Saint-Jean-de-Luz', 43.4, -1.67],
  ];
  const pad = (n) => String(n).padStart(2, '0');
  const hm = (ms, off) => { const d = new Date((ms + off) * 1000); return d.getUTCHours() + ' h ' + pad(d.getUTCMinutes()); };
  const dayKey = (ms, off) => { const d = new Date((ms + off) * 1000); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); };
  const sgn = (v) => (v < 0 ? '−' : '+') + Math.abs(v).toFixed(1).replace('.', ',') + ' m';

  async function load(place, fetchFn) {
    const tok = ++T.token;
    T.place = place; T.status = 'loading'; T.error = ''; T.data = null;
    A.render();
    try {
      const f = fetchFn || globalThis.fetch.bind(globalThis);
      const url = 'https://marine-api.open-meteo.com/v1/marine?latitude=' + place.lat.toFixed(4) + '&longitude=' + place.lon.toFixed(4) + '&hourly=sea_level_height_msl&cell_selection=sea&timeformat=unixtime&timezone=auto&forecast_days=8';
      const r = await f(url);
      if (!r.ok) throw new Error('Marée indisponible pour le moment (' + r.status + ')');
      const j = await r.json();
      const t = (j.hourly && j.hourly.time) || [], tide = ((j.hourly && j.hourly.sea_level_height_msl) || []).map((v) => (v == null ? null : +v));
      if (!t.length || !tide.some((v) => v != null)) throw new Error('Pas de données de marée à cet endroit (trop loin de la mer ou hors du modèle).');
      if (tok !== T.token) return;
      T.data = { t, tide, off: j.utc_offset_seconds || 0, ext: K.tideExtremes(t, tide) };
      T.status = 'ok';
    } catch (e) {
      if (tok !== T.token) return;
      T.status = 'error'; T.error = e.message || 'Marée indisponible';
    }
    A.render();
  }

  function curve(d) {
    const W = 720, Ht = 120, pl = 4, pr = 4, pt = 8, pb = 20, iw = W - pl - pr, ih = Ht - pt - pb;
    const n = Math.min(d.t.length, 24 * 4), vs = d.tide.slice(0, n).filter((v) => v != null), lo = Math.min(...vs), hi = Math.max(...vs), rg = Math.max(0.3, hi - lo);
    const X = (i) => pl + (i / (n - 1)) * iw, Y = (v) => pt + ih - ((v - lo) / rg) * ih;
    const pts = []; for (let i = 0; i < n; i++) if (d.tide[i] != null) pts.push(X(i).toFixed(1) + ',' + Y(d.tide[i]).toFixed(1));
    let g = '';
    for (let i = 0; i < n; i++) {
      const h = new Date((d.t[i] + d.off) * 1000).getUTCHours();
      if (h === 0) { g += '<line x1="' + X(i).toFixed(1) + '" x2="' + X(i).toFixed(1) + '" y1="' + pt + '" y2="' + (pt + ih) + '" class="sep"/><text x="' + (X(i) + 3).toFixed(1) + '" y="' + (Ht - 5) + '" class="dl">' + esc(U.weekdayShort(dayKey(d.t[i], d.off)) + ' ' + new Date((d.t[i] + d.off) * 1000).getUTCDate()) + '</text>'; }
    }
    const nowI = d.t.findIndex((s) => s >= Date.now() / 1000), nowX = nowI > 0 && nowI < n ? '<line x1="' + X(nowI).toFixed(1) + '" x2="' + X(nowI).toFixed(1) + '" y1="' + pt + '" y2="' + (pt + ih) + '" class="now"/>' : '';
    const ex = d.ext.filter((e) => e.t >= d.t[0] && e.t <= d.t[n - 1]).map((e) => {
      const x = pl + ((e.t - d.t[0]) / (d.t[n - 1] - d.t[0])) * iw;
      return '<circle cx="' + x.toFixed(1) + '" cy="' + Y(e.h).toFixed(1) + '" r="3" class="tide-pt"/>';
    }).join('');
    return '<svg class="wg-sum tide-svg" viewBox="0 0 ' + W + ' ' + Ht + '" role="img" aria-label="Courbe de marée sur 4 jours">' + g + '<polyline class="tide-l" points="' + pts.join(' ') + '"/>' + ex + nowX +
      '<text x="' + (W - pr - 2) + '" y="' + (pt + 9) + '" text-anchor="end" class="ax">de ' + sgn(lo) + ' à ' + sgn(hi) + '</text></svg>';
  }

  function days(d) {
    const by = new Map();
    d.ext.forEach((e) => { const k = dayKey(e.t, d.off); if (!by.has(k)) by.set(k, []); by.get(k).push(e); });
    const list = [...by.entries()].filter(([k]) => k >= dayKey(Date.now() / 1000, d.off)).slice(0, 7);
    // marnage du jour (écart entre pleine et basse mer voisines) comparé aux autres jours : repère « grande » ou « petite » marée
    const rng = list.map(([, es]) => { const hs = es.map((e) => e.h); return Math.max(...hs) - Math.min(...hs); });
    const mx = Math.max(...rng, 0.01);
    return list.map(([k, es], i) => {
      const r = rng[i] / mx;
      const tag = r >= 0.92 ? 'marée forte' : r <= 0.65 ? 'marée faible' : 'marée moyenne';
      return '<li class="tide-day"><div class="tide-d"><b>' + esc(U.fmtDay(k)) + '</b> <span class="fine">' + tag + ' · marnage ≈ ' + rng[i].toFixed(1).replace('.', ',') + ' m</span></div><div class="tide-ex">' +
        es.map((e) => '<span class="tide-e ' + e.type + '"><b>' + (e.type === 'high' ? 'Pleine mer' : 'Basse mer') + '</b> ' + hm(e.t, d.off) + ' <small>' + sgn(e.h) + '</small></span>').join('') + '</div></li>';
    }).join('');
  }

  A.renderers = A.renderers || {};
  A.renderers.tides = () => {
    const mine = (S.spots || []).map((s, i) => '<option value="s' + i + '"' + (T.place && T.place.key === 's' + i ? ' selected' : '') + '>' + esc(s.name) + '</option>').join('');
    const ports = PORTS.map((p, i) => '<option value="p' + i + '"' + (T.place && T.place.key === 'p' + i ? ' selected' : '') + '>' + esc(p[0]) + '</option>').join('');
    let out = '<div class="wk-head"><h3>Marées</h3>' +
      '<label class="fine" for="tidePlace">Lieu</label> <select id="tidePlace"><option value="">Choisir un port ou un spot…</option><optgroup label="Ports">' + ports + '</optgroup>' + (mine ? '<optgroup label="Mes spots">' + mine + '</optgroup>' : '') + '</select> ' +
      '<button class="btn btn-small" data-act="tideMap">Centre de la carte</button></div>';
    if (T.status === 'idle') out += '<p class="fine">Choisis un port ou un de tes spots pour voir les pleines et basses mers des 7 prochains jours.</p>';
    if (T.status === 'loading') out += '<p class="fine" aria-live="polite">Chargement de la marée…</p>';
    if (T.status === 'error') out += '<p class="cp-warn" role="note">' + esc(T.error) + '</p>';
    if (T.status === 'ok' && T.data) {
      out += '<p class="fine"><b>' + esc(T.place.name) + '</b> · heures locales du lieu</p>' + curve(T.data) + '<ul class="tide-list">' + days(T.data) + '</ul>' +
        '<p class="fine">Hauteurs par rapport au niveau moyen de la mer (pas au zéro des cartes marines). Modèle mondial d\'Open-Meteo : c\'est un ordre de grandeur, les heures peuvent varier de 15 à 30 minutes et les hauteurs davantage près des côtes (estuaires, baies). Pour l\'horaire officiel : <a href="https://maree.shom.fr/" target="_blank" rel="noopener">annuaire des marées du SHOM</a>.</p>';
    }
    return out;
  };

  Object.assign(A.actions, {
    tidePick(el) {
      const v = el.value || '';
      if (!v) return;
      const i = parseInt(v.slice(1), 10);
      if (v[0] === 'p' && PORTS[i]) load({ key: v, name: PORTS[i][0], lat: PORTS[i][1], lon: PORTS[i][2] });
      if (v[0] === 's' && S.spots[i]) load({ key: v, name: S.spots[i].name, lat: S.spots[i].lat, lon: S.spots[i].lon });
    },
    tideMap() {
      const c = S.mapObj && S.mapObj.raw && S.mapObj.raw.getCenter ? S.mapObj.raw.getCenter() : null;
      if (!c) { A.toast('Carte indisponible', 'error'); return; }
      load({ key: 'c', name: 'Centre de la carte (' + U.fmtCoords(c.lat, c.lng) + ')', lat: c.lat, lon: c.lng });
    },
  });
  document.addEventListener('change', (ev) => { const el = ev.target; if (el && el.id === 'tidePlace') A.actions.tidePick(el); });
  A.tide = { load, PORTS, state: T };
})();

/* ===== app-link ===== */
/* Houle - lien de partage d'un spot ou d'une session, lisible sans compte (tout est dans l'adresse) */
(function () {
  const H = globalThis.Houle, A = H.app, S = A.S, U = H.util, F = H.forecast;
  const esc = U.esc;
  const $ = (s) => document.querySelector(s);
  const PUBLIC_URL = 'https://enzovildina-spec.github.io/houle-data/houle.html';
  const DISC = { s: 'Surf', b: 'Bodyboard', l: 'Longboard' };
  const TIDE = { low: 'marée basse', mid: 'mi-marée', high: 'marée haute', all: 'toutes marées' };
  const NUM_KEYS = ['waveMin', 'waveMax', 'periodMin', 'periodMax', 'windMax', 'dirFrom', 'dirTo', 'swellFrom', 'swellTo', 'hourFrom', 'hourTo'];
  const BOOL_KEYS = ['dirOn', 'swellOn'];

  const b64enc = (obj) => {
    const bytes = new TextEncoder().encode(JSON.stringify(obj));
    let bin = ''; bytes.forEach((b) => { bin += String.fromCharCode(b); });
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  };
  const b64dec = (s) => {
    const bin = atob(s.replace(/-/g, '+').replace(/_/g, '/'));
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0))));
  };
  const baseUrl = () => (location.protocol === 'file:' || !location.host ? PUBLIC_URL : location.origin + location.pathname);

  /* ---- fabrication du lien ---- */
  function payload(spot, opts) {
    const R = spot.rules || {}, r = {};
    NUM_KEYS.forEach((k) => { if (typeof R[k] === 'number' && Number.isFinite(R[k])) r[k] = R[k]; });
    BOOL_KEYS.forEach((k) => { if (R[k]) r[k] = true; });
    if (DISC[R.disc]) r.disc = R.disc;
    if (TIDE[R.tide]) r.tide = R.tide;
    const p = { v: 1, n: String(spot.name).slice(0, 80), la: +spot.lat.toFixed(5), lo: +spot.lon.toFixed(5), r };
    if (opts.notes && spot.notes) p.no = String(spot.notes).slice(0, 600);
    if (opts.session && opts.session.date) p.s = { d: opts.session.date, f: opts.session.from, t: opts.session.to };
    return p;
  }
  const nextGood = (spot) => {
    const f = S.fc[spot.id];
    const d = f && f.days && f.days.find((x) => x.status === 'good' && x.window);
    return d ? { date: d.date, from: d.window.from, to: d.window.to } : null;
  };
  const makeLink = (spot, opts) => baseUrl() + '#spot=' + b64enc(payload(spot, opts));

  A.actions.linkSpot = (el) => {
    const spot = S.spots.find((s) => s.id === el.dataset.id);
    if (!spot) return;
    const ses = nextGood(spot);
    A.dialog.open(
      '<div class="dlg"><h2>Lien de partage</h2>' +
      '<p class="fine">Envoie ce lien à n\'importe qui : il s\'ouvre sans compte et propose d\'ajouter le spot. Rien n\'est stocké sur un serveur, tout est dans l\'adresse.</p>' +
      '<label class="fld">Lien<input id="lk_url" type="text" readonly></label>' +
      '<label class="chk"><input id="lk_notes" type="checkbox"> Inclure mes notes (elles restent privées sinon)</label>' +
      (ses ? '<label class="chk"><input id="lk_ses" type="checkbox"> Proposer la prochaine bonne session : ' + esc(U.fmtDay(ses.date)) + ' ' + esc(F.windowText(ses)) + '</label>' : '') +
      '<p class="fine">Les photos ne sont pas envoyées.</p>' +
      '<div class="dlg-actions"><button class="btn" data-act="closeDlg">Fermer</button><span class="sp"></span>' +
      (navigator.share ? '<button class="btn" data-act="lkShare">Partager…</button>' : '') + '<button class="btn btn-primary" data-act="lkCopy">Copier le lien</button></div></div>',
      () => {
        const upd = () => { $('#lk_url').value = makeLink(spot, { notes: $('#lk_notes').checked, session: $('#lk_ses') && $('#lk_ses').checked ? ses : null }); };
        ['#lk_notes', '#lk_ses'].forEach((q) => { const e = $(q); if (e) e.addEventListener('change', upd); });
        $('#lk_url').addEventListener('focus', (e) => e.target.select());
        upd();
      }
    );
  };
  A.actions.lkCopy = async () => {
    const inp = $('#lk_url');
    try { await navigator.clipboard.writeText(inp.value); A.toast('Lien copié'); } catch (e) { inp.focus(); inp.select(); A.toast('Sélectionne le lien et copie-le (Ctrl+C)'); }
  };
  A.actions.lkShare = async () => { try { await navigator.share({ title: 'Spot de surf', url: $('#lk_url').value }); } catch (e) { /* annulé */ } };

  /* ---- lecture d'un lien reçu ---- */
  const clampNum = (v, a, b) => (typeof v === 'number' && Number.isFinite(v) ? Math.max(a, Math.min(b, v)) : null);
  function parse(hash) {
    const m = /^#spot=([A-Za-z0-9_-]+)$/.exec(hash || '');
    if (!m) return null;
    let p;
    try { p = b64dec(m[1]); } catch (e) { return null; }
    if (!p || p.v !== 1 || typeof p.n !== 'string') return null;
    const la = clampNum(p.la, -90, 90), lo = clampNum(p.lo, -180, 180);
    if (la == null || lo == null) return null;
    const rules = {};
    NUM_KEYS.forEach((k) => { const v = clampNum(p.r && p.r[k], -1000, 1000); if (v != null) rules[k] = v; });
    BOOL_KEYS.forEach((k) => { if (p.r && p.r[k] === true) rules[k] = true; });
    if (p.r && DISC[p.r.disc]) rules.disc = p.r.disc;
    if (p.r && TIDE[p.r.tide]) rules.tide = p.r.tide;
    const out = { name: p.n.slice(0, 80), lat: la, lon: lo, rules, notes: typeof p.no === 'string' ? p.no.slice(0, 600) : '', session: null };
    if (p.s && /^\d{4}-\d{2}-\d{2}$/.test(p.s.d) && Number.isInteger(p.s.f) && Number.isInteger(p.s.t)) out.session = { date: p.s.d, from: clampNum(p.s.f, 0, 24), to: clampNum(p.s.t, 0, 24) };
    return out;
  }
  A.parseShareLink = parse;
  A.hasLink = () => !!parse(location.hash);

  A.handleLink = () => {
    const p = parse(location.hash);
    if (!p) return false;
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* ignore */ }
    const R = p.rules, cond = [];
    if (R.waveMin != null && R.waveMax != null) cond.push('Houle ' + U.num(R.waveMin) + '–' + U.num(R.waveMax) + ' m');
    if (R.periodMin && R.periodMax > 0) cond.push('période ' + U.num(R.periodMin, 0) + '–' + U.num(R.periodMax, 0) + ' s');
    else if (R.periodMin) cond.push('période ≥ ' + U.num(R.periodMin, 0) + ' s');
    else if (R.periodMax > 0) cond.push('période ≤ ' + U.num(R.periodMax, 0) + ' s');
    if (R.windMax != null && R.windMax < 99) cond.push('vent ≤ ' + U.num(R.windMax, 0) + ' km/h');
    if (R.swellOn) cond.push('houle de ' + U.compass(R.swellFrom) + ' à ' + U.compass(R.swellTo));
    if (R.dirOn) cond.push('vent de ' + U.compass(R.dirFrom) + ' à ' + U.compass(R.dirTo));
    if (R.tide) cond.push(TIDE[R.tide]);
    S.sharedLink = p;
    A.dialog.open(
      '<div class="dlg"><h2>Spot partagé : ' + esc(p.name) + '</h2>' +
      '<p class="fine">' + esc(U.fmtCoords(p.lat, p.lon)) + (R.disc ? ' · ' + esc(DISC[R.disc]) : '') + '</p>' +
      (p.session ? '<p><b>Session proposée :</b> ' + esc(U.fmtDay(p.session.date)) + ' ' + esc(F.windowText(p.session)) + '</p>' : '') +
      (cond.length ? '<p>Conditions conseillées : ' + esc(cond.join(' · ')) + '</p>' : '') +
      (p.notes ? '<p class="knote">' + esc(p.notes) + '</p>' : '') +
      '<p class="fine">Position envoyée par quelqu\'un : vérifie-la sur satellite avant de t\'y rendre.</p>' +
      '<div class="dlg-actions"><button class="btn" data-act="closeDlg">Fermer</button><span class="sp"></span><button class="btn" data-act="lkMap">Voir sur la carte</button><button class="btn btn-primary" data-act="lkAdd">Ajouter à mes spots</button></div></div>'
    );
    if (S.mapObj && S.mapObj.ready) S.mapObj.flyTo(p.lat, p.lon, 13);
    return true;
  };
  Object.assign(A.actions, {
    lkMap() { const p = S.sharedLink; A.dialog.close(); if (p && S.mapObj) S.mapObj.flyTo(p.lat, p.lon, 14); },
    lkAdd() { const p = S.sharedLink; A.dialog.close(); if (p) A.openSpotDialog(null, { lat: p.lat, lon: p.lon, name: p.name, rules: p.rules, notes: p.notes }); },
  });
})();

/* ===== app-import ===== */
/* Houle - importer des lieux depuis Google Maps (ou tout fichier KML / KMZ / GeoJSON / CSV) comme spots PRIVÉS.
   L'appli LIT le fichier : rien n'est modifié ni supprimé chez Google, et l'import ne touche à aucun spot existant. */
(function () {
  const H = globalThis.Houle, A = H.app, S = A.S, U = H.util, I = H.importer;
  const esc = U.esc;
  const $ = (q) => document.querySelector(q);
  const LAST_KEY = 'houle.lastImport';
  const ST = { res: null, file: '' };

  const lastBatch = () => { try { return JSON.parse(localStorage.getItem(LAST_KEY) || 'null'); } catch (e) { return null; } };
  const mineOf = (batch) => S.spots.filter((s) => s.batch === batch);

  function step1() {
    const last = lastBatch(), n = last ? mineOf(last.id).length : 0;
    A.dialog.open(
      '<div class="dlg"><h2>Importer mes spots</h2><p class="muted" style="margin:-6px 0 8px;font-size:12px">Version de l\'appli : ' + (H.version || '?') + '</p>' +
      '<p class="knote"><b>Tes données Google ne sont jamais touchées.</b> Tu fais une copie dans un fichier, l\'appli lit ce fichier et ajoute les lieux à tes spots, <b>privés</b> sur cet appareil. Elle ne supprime ni ne modifie aucun de tes spots existants, et tu peux annuler l\'import.</p>' +
      '<details open><summary><b>Comment récupérer mes lieux</b></summary>' +
      '<p><b>Si tes spots sont dans une carte « Mes cartes »</b> (le plus simple, avec les coordonnées) : ouvre google.com/mymaps, ouvre ta carte, touche les trois points ⋮ à côté du titre, puis « Exporter au format KML/KMZ » et télécharge.</p>' +
      '<p><b>Si ce sont des lieux enregistrés ou des listes</b> : va sur takeout.google.com, clique « Tout désélectionner », coche « Maps (mes adresses) » et/ou « Lieux enregistrés », puis crée l\'export. Dézippe-le et choisis le fichier <i>.json</i> ou <i>.csv</i>. Les listes en .csv n\'ont parfois pas de coordonnées : l\'appli te dira combien de lieux sont ignorés.</p></details>' +
      '<div class="row"><button class="btn btn-small" data-act="export">Sauvegarder d\'abord mes spots actuels</button></div>' +
      '<label class="fld">Fichier à importer<input id="ip_file" type="file" accept=".kml,.kmz,.json,.geojson,.csv,.txt"></label>' +
      '<div id="ipMsg" class="fine" aria-live="polite"></div>' +
      (last && n ? '<hr><p class="fine">Dernier import : ' + n + ' spot(s) ajouté(s) le ' + esc(new Date(last.at).toLocaleDateString('fr-FR')) + '. <button class="btn btn-small" data-act="ipUndo" data-batch="' + esc(last.id) + '">Annuler cet import</button></p>' : '') +
      '<div class="dlg-actions"><button class="btn" data-act="closeDlg">Fermer</button></div></div>',
      () => { $('#ip_file').addEventListener('change', onFile); }
    );
  }

  async function onFile(e) {
    const f = e.target.files && e.target.files[0], msg = $('#ipMsg');
    if (!f) return;
    if (f.size > 25 * 1024 * 1024) { msg.textContent = 'Fichier trop gros (25 Mo maximum).'; return; }
    msg.textContent = 'Lecture du fichier…';
    try {
      const res = await I.parseFile(await f.arrayBuffer(), f.name);
      I.markDuplicates(res.items, S.spots);
      ST.res = res; ST.file = f.name;
      if (!res.items.length) { msg.textContent = 'Aucun lieu avec coordonnées trouvé dans ce fichier (' + res.total + ' lieu(x) lu(s)' + (res.noCoords ? ', ' + res.noCoords + ' sans coordonnées' : '') + '). Pour des listes Google, essaie le fichier .json de Takeout ou une carte « Mes cartes » en KML.'; return; }
      step2();
    } catch (err) { msg.textContent = err.message || 'Fichier illisible.'; }
  }

  function step2() {
    const r = ST.res, total = r.items.length, dups = r.items.filter((x) => x.dup).length;
    const cap = S.mode === 'local' ? 5000 : 100;
    const rows = r.items.slice(0, 400).map((it, i) => '<label class="ip-row"><input type="checkbox" data-i="' + i + '"' + (it.dup ? '' : ' checked') + '> <span class="ip-n">' + esc(it.name) + '</span> <span class="fine">' + esc(it.lat.toFixed(4) + ', ' + it.lon.toFixed(4)) + (it.dup ? ' · ' + esc(it.dup) : '') + '</span></label>').join('');
    A.dialog.open(
      '<div class="dlg"><h2>Aperçu de l\'import</h2>' +
      '<p><b>' + total + ' lieu(x)</b> avec coordonnées (' + esc(r.format) + ', ' + esc(ST.file) + ')' + (dups ? ', dont ' + dups + ' déjà présent(s), décoché(s)' : '') + '.' +
      (r.noCoords ? ' ' + r.noCoords + ' sans coordonnées ignoré(s).' : '') + (r.notPoint ? ' ' + r.notPoint + ' tracé(s) ou zone(s) ignoré(s).' : '') + '</p>' +
      (total > 400 ? '<p class="fine">Seuls les 400 premiers sont listés ci-dessous ; les autres sont importés avec la sélection « tout ».</p>' : '') +
      '<div class="row"><button class="btn btn-small" data-act="ipAll" data-v="1">Tout cocher</button><button class="btn btn-small" data-act="ipAll" data-v="0">Tout décocher</button></div>' +
      '<div class="ip-list">' + rows + '</div>' +
      '<label class="fld">Discipline pour ces spots<small>Le plus simple : « à classer plus tard », puis tu classes spot par spot (plusieurs disciplines possibles).</small><select id="ip_disc"><option value="">À classer plus tard (je ne sais pas encore)</option><option value="s">Surf</option><option value="b">Bodyboard</option><option value="l">Longboard</option></select></label>' +
      '<label class="chk"><input id="ip_follow" type="checkbox"> Suivre la houle et envoyer des alertes pour tous ces spots maintenant</label>' +
      '<p class="fine">Laisse décoché si tu en importes beaucoup : la prévision se charge quand tu ouvres un spot, et tu peux activer « Suivre » spot par spot.</p>' +
      (S.mode !== 'local' ? '<p class="fine">Maximum ' + cap + ' spots à la fois avec un compte.</p>' : '') +
      '<div id="ipCount" class="fine"></div>' +
      '<div class="dlg-actions"><button class="btn" data-act="ipBack">Retour</button><span class="sp"></span><button class="btn btn-primary" data-act="ipGo" id="ipGo">Importer</button></div></div>',
      (d) => { d.addEventListener('change', count); count(); }
    );
  }
  const picked = () => Array.from(document.querySelectorAll('.ip-row input:checked')).map((c) => +c.dataset.i);
  function count() {
    const r = ST.res, shown = Math.min(400, r.items.length), sel = picked().length + (r.items.length > 400 ? r.items.slice(400).filter((x) => !x.dup).length : 0);
    const el = $('#ipCount'), b = $('#ipGo');
    if (el) el.textContent = sel + ' spot(s) seront ajoutés.';
    if (b) b.disabled = sel === 0;
    return shown;
  }

  async function go() {
    const r = ST.res, cap = S.mode === 'local' ? 5000 : 100;
    const idx = new Set(picked());
    let items = r.items.filter((it, i) => (i < 400 ? idx.has(i) : !it.dup));
    if (items.length > cap) items = items.slice(0, cap);
    const disc = $('#ip_disc').value, follow = $('#ip_follow').checked, batch = 'imp-' + Date.now().toString(36);
    const btn = $('#ipGo'); btn.disabled = true;
    let done = 0;
    try {
      for (const it of items) {
        await S.store.saveSpot({ id: U.uid(), name: it.name, lat: it.lat, lon: it.lon, notes: it.notes, linkUrl: '', rules: disc ? H.spotclass.classify({}, [disc]) : { unclassified: true }, batch, ...(follow ? {} : { quiet: true }) });
        done++;
        if (done % 25 === 0) btn.textContent = 'Import… ' + done + ' / ' + items.length;
      }
    } catch (e) { A.fail(e); }
    try { localStorage.setItem(LAST_KEY, JSON.stringify({ id: batch, at: Date.now(), n: done })); } catch (e) { /* ignore */ }
    S.spots = await S.store.listSpots();
    A.render(); A.syncMap();
    if (S.mapObj && S.mapObj.ready) S.mapObj.fitAll(S.spots);
    if (follow) A.refreshForecasts(false);
    A.dialog.open(
      '<div class="dlg"><h2>Import terminé</h2><p><b>' + done + ' spot(s) ajouté(s)</b>, privés sur cet appareil. Rien n\'a été modifié chez Google ni dans tes spots existants.</p>' +
      (follow ? '' : '<p class="fine">Ouvre un spot pour voir sa prévision, ou touche « Suivre » pour activer ses alertes.</p>') +
      '<div class="dlg-actions"><button class="btn" data-act="ipUndo" data-batch="' + esc(batch) + '">Annuler cet import</button><span class="sp"></span><button class="btn btn-primary" data-act="closeDlg">OK</button></div></div>'
    );
  }

  async function undo(batch) {
    const mine = mineOf(batch);
    const untouched = mine.filter((s) => (s.updatedAt || 0) - (s.createdAt || 0) < 3000 && !(s.notes && s.notes.startsWith('​')));
    for (const s of untouched) await S.store.deleteSpot(s.id);
    S.spots = await S.store.listSpots();
    try { localStorage.removeItem(LAST_KEY); } catch (e) { /* ignore */ }
    A.render(); A.syncMap();
    const kept = mine.length - untouched.length;
    A.dialog.open('<div class="dlg"><h2>Import annulé</h2><p>' + untouched.length + ' spot(s) retiré(s).' + (kept ? ' ' + kept + ' spot(s) modifié(s) depuis l\'import ont été conservés.' : '') + '</p><div class="dlg-actions"><button class="btn btn-primary" data-act="closeDlg">OK</button></div></div>');
  }

  Object.assign(A.actions, {
    importPlaces() { step1(); },
    ipBack() { step1(); },
    ipAll(el) { document.querySelectorAll('.ip-row input').forEach((c) => { c.checked = el.dataset.v === '1'; }); count(); },
    ipGo() { go(); },
    ipUndo(el) { undo(el.dataset.batch); },
    async followSpot(el) {
      const s = S.spots.find((x) => x.id === el.dataset.id);
      if (!s) return;
      await S.store.saveSpot(Object.assign({}, s, { quiet: false }));
      S.spots = await S.store.listSpots();
      A.render();
      const s2 = S.spots.find((x) => x.id === el.dataset.id);
      if (s2) A.refreshForecasts(true, s2);
    },
  });

  // un spot importé « au repos » charge sa prévision quand on l'ouvre
  const sel = A.selectSpot;
  A.selectSpot = (id, fly) => {
    sel(id, fly);
    const s = S.spots.find((x) => x.id === id);
    if (s && s.quiet && !S.fc[id]) A.refreshForecasts(false, s);
  };
})();

/* ===== app-cond ===== */
/* Houle - mode « Conditions » : vent animé (façon Windy) ou houle (façon Windguru), un seul à la fois ; clic = tableau heure par heure */
(function () {
  const H = globalThis.Houle, A = H.app, S = A.S, U = H.util, K = H.cond;
  const esc = U.esc;
  const $ = (s) => document.querySelector(s);

  const C = (A.cond = {
    active: false, view: 'wind', pressure: true, source: '', res: '5', offset: 0, maxOffset: 48,
    grid: null, cacheW: new Map(), cacheM: new Map(), token: 0, status: '', loading: false, timer: 0,
    canvas: null, ctx: null, pcv: null, pctx: null, work: null, land: null, landState: '', vec: null, raf: 0, parts: [], det: null, dtoken: 0,
  });
  const TTL = 30 * 60 * 1000;
  /* unité des hauteurs dans le tableau : mètres ou pieds (choix gardé sur l'appareil) */
  const FT = 3.28084;
  let unit = 'm';
  try { if (localStorage.getItem('houle.unit') === 'ft') unit = 'ft'; } catch (e) { /* pas de stockage : mètres */ }
  const hv = (m) => (m == null ? '–' : unit === 'ft' ? String(Math.round(m * FT)) : m.toFixed(1));
  const hUnit = () => (unit === 'ft' ? 'pieds' : 'mètres');
  /* définitions courtes, affichées en touchant le nom d'une ligne */
  const DEFS = {
    tide: ['Marée (niveau)', 'Hauteur de la mer par rapport au niveau moyen, en mètres, d\'après un modèle mondial (cases d\'environ 8 km). C\'est un ordre de grandeur : près des côtes, l\'amplitude réelle et les heures de pleine et basse mer peuvent différer de la marée officielle (SHOM). Pour te décider, croise avec ton annuaire des marées habituel.'],
    power: ['Puissance (kW/m)', 'Puissance de la houle principale par mètre de front de vague : 0,49 × hauteur² × période (hauteur en mètres, période en secondes). Elle double quand la hauteur monte de 40 %, et grimpe vite avec la période : une houle longue pousse plus qu\'une houle courte de même taille.'],
    energy: ['Énergie (kJ)', 'Énergie par mètre de front de vague, additionnée sur toutes les houles : 0,98 × hauteur² × période² pour chacune (mètres, secondes). C\'est une estimation proche de l\'échelle de Surf-Forecast (≈ 100 : petit mais surfable ; 200 à 1 000 : de plus en plus puissant ; au-delà de 1 000 : très lourd), mais leur formule exacte n\'est pas publiée : les chiffres peuvent différer.'],
    wind: ['Mer de vent', 'Vagues fabriquées par le vent local, courtes et désordonnées (période souvent 3 à 7 secondes). Elles abîment la houle de fond : surface clapoteuse, vagues moins propres.'],
    s2: ['2e houle', 'Un deuxième train de houle, qui arrive d\'une autre direction ou avec une autre période. Même direction : les deux s\'ajoutent, les séries sont plus grosses. Directions croisées : mer croisée, vagues chaotiques et moins propres. Une 2e houle courte sur une longue houle principale crée du fouillis.'],
  };
  // finesse de la maille : pas minimal en degrés (1° ≈ 111 km) et nombre maximal de points par vue (quota Open-Meteo)
  const RES = { '15': { min: 0.125, max: 150, km: 15, label: '15 km' }, '5': { min: 0.05, max: 400, km: 5, label: '5 km' }, '1.3': { min: 0.0125, max: 600, km: 1.3, label: '1,3 km' } };
  const keyOf = (p) => p.lat.toFixed(3) + ',' + K.normLon(p.lon).toFixed(3);
  const hourNow = () => Math.floor(Date.now() / 3600000) * 3600000;
  const atMs = () => hourNow() + C.offset * 3600000;
  const fmtWhen = (ms) => (C.offset === 0 ? 'Maintenant' : new Date(ms).toLocaleString('fr-FR', { weekday: 'short', day: 'numeric', hour: 'numeric' }).replace(':00', ''));
  const reduced = () => !!(globalThis.matchMedia && globalThis.matchMedia('(prefers-reduced-motion: reduce)').matches) || document.documentElement.classList.contains('a11y-rm');
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /* ---------- trait de côte (pour que la houle reste dans l'eau) ---------- */
  async function loadLand() {
    if (C.landState) return;
    C.landState = 'loading';
    try {
      await U.loadScript('https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js');
      const res = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-50m.json');
      if (!res.ok) throw new Error('land ' + res.status);
      const topo = await res.json();
      const f = globalThis.topojson.feature(topo, topo.objects.land);
      const geoms = f.type === 'FeatureCollection' ? f.features.map((x) => x.geometry) : [f.geometry];
      const polys = [];
      geoms.forEach((g) => {
        const list = g.type === 'MultiPolygon' ? g.coordinates : g.type === 'Polygon' ? [g.coordinates] : [];
        list.forEach((rings) => {
          let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
          rings[0].forEach(([lo, la]) => { if (lo < x0) x0 = lo; if (lo > x1) x1 = lo; if (la < y0) y0 = la; if (la > y1) y1 = la; });
          polys.push({ rings, x0, x1, y0, y1 });
        });
      });
      C.land = polys; C.landState = 'ok';
      draw();
    } catch (e) {
      C.landState = 'fail';
      renderPanel();
    }
  }
  /* ---------- côte précise (~30 m, OpenStreetMap) : tuiles de 1° chargées là où on regarde, quand on zoome ---------- */
  const FINE = { idx: null, state: '', tiles: {}, pending: {} };
  C.fine = FINE;
  const fineBase = () => { try { return new URL('coast/', globalThis.location.href).href; } catch (e) { return ''; } };
  async function loadFine() {
    const map = S.mapObj && S.mapObj.raw;
    if (!map || map.getZoom() < 8 || FINE.state === 'off') return;
    const base = fineBase();
    if (!/^https?:/.test(base)) { FINE.state = 'off'; return; }
    if (!FINE.idx) {
      if (FINE.state === 'loading') return;
      FINE.state = 'loading';
      try { const r = await fetch(base + 'index.json'); if (!r.ok) throw new Error(r.status); FINE.idx = await r.json(); FINE.state = 'ok'; }
      catch (e) { FINE.state = 'off'; return; }
    }
    const b = map.getBounds();
    const la0 = Math.floor(b.getSouth()), la1 = Math.floor(b.getNorth()), lo0 = Math.floor(b.getWest()), lo1 = Math.floor(b.getEast());
    let started = 0;
    for (let la = la0; la <= la1 && started < 6; la++) for (let lo = lo0; lo <= lo1 && started < 6; lo++) {
      const k = la + ',' + lo;
      if (FINE.idx.cells[k] !== 1 || FINE.tiles[k] || FINE.pending[k]) continue;
      FINE.pending[k] = 1; started++;
      fetch(base + 'c_' + la + '_' + lo + '.json').then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then((t) => {
        const sc = FINE.idx.scale || 100000;
        FINE.tiles[k] = t.p.map((rings) => rings.map((flat) => { const out = new Array(flat.length); for (let i = 0; i < flat.length; i += 2) { out[i] = lo + flat[i] / sc; out[i + 1] = la + flat[i + 1] / sc; } return out; }));
        delete FINE.pending[k]; draw();
      }).catch(() => { FINE.tiles[k] = []; delete FINE.pending[k]; });
    }
  }
  // cases fines disponibles dans la vue (terre ou eau seule) : là, on remplace la côte grossière
  function fineCells(map) {
    if (!FINE.idx || map.getZoom() < 8) return [];
    const b = map.getBounds(), out = [];
    for (let la = Math.floor(b.getSouth()); la <= Math.floor(b.getNorth()); la++) for (let lo = Math.floor(b.getWest()); lo <= Math.floor(b.getEast()); lo++) {
      const k = la + ',' + lo, v = FINE.idx.cells[k];
      if (v === 0 || (v === 1 && FINE.tiles[k] && FINE.tiles[k].length)) out.push({ la, lo, k, land: v === 1 });
    }
    return out;
  }
  // efface la terre sur le canvas de travail (destination-out)
  function maskLand(ctx, w, h) {
    const map = S.mapObj.raw;

  /* ---------- données de la zone ---------- */

  async function refresh() {

  // carte mondiale : tout vient des fichiers préparés par GitHub, aucun appel Open-Meteo

  let rafDraw = 0;
  const requestDraw = () => { if (rafDraw) return; rafDraw = requestAnimationFrame(() => { rafDraw = 0; draw(); }); };

  function draw() {

    const t = atMs();

      const vv = vals.map((row) => row.map((v) => (v && v.wind != null && v.windDir != null ? -v.wind * Math.cos((v.windDir * Math.PI) / 180) : null)));

  function stopParticles() {

  function startParticles() {

    const n = Math.round(clamp((w * h) / (swell ? 1100 : 1400), 200, swell ? 2400 : 1800));
    const seed = (p) => { p.x = Math.random() * w; p.y = Math.random() * h; p.age = Math.floor(Math.random() * 70); p.life = 90; return p; };
    C.parts = Array.from({ length: n }, () => seed({}));
    const ctx = C.pctx;
    ctx.clearRect(0, 0, w, h);
    // couleurs de filets par classe de hauteur (houle), pour ne faire qu'un tracé par couleur
    const bins = {};

  /* ---------- détail d'un point : tableau heure par heure (façon Windguru) ---------- */
  const dirTxt = (d) => (d == null ? '–' : U.compass(d) + ' ' + Math.round(d) + '°');
  const rot = (d) => (d == null ? '' : '<i class="ar" style="transform:rotate(' + Math.round(d + 180) + 'deg)">↑</i>');
  const lerp = (c) => 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
  const localKey = (ms) => { const d = new Date(ms); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

  function buildDays(d) {
    const days = [], map = new Map();
    d.t.forEach((s, i) => {
      const k = localKey(s * 1000);
      if (!map.has(k)) { const o = { key: k, idx: [], ms: s * 1000 }; map.set(k, o); days.push(o); }
      map.get(k).idx.push(i);

    const todayKey = localKey(Date.now());
    return days.slice(0, 8).map((o) => {
      const dt = new Date(o.ms);
      o.label = o.key === todayKey ? 'Auj.' : dt.toLocaleDateString('fr-FR', { weekday: 'short' }).replace('.', '') + ' ' + dt.getDate();
      return o;
    });
  }
  function isNight(d, s) {
    if (d.rise.length && d.set.length) { for (let k = 0; k < d.rise.length; k++) if (s >= d.rise[k] && s <= d.set[k]) return false; return true; }
    const hr = new Date(s * 1000).getHours();
    return hr < 7 || hr >= 21;
  }
  const FAR_MS = 4 * 86400000;

  function summarySvg(D) {
    const { d, days, sel } = D, n = d.n, Wd = 720, Ht = 112, pl = 4, pr = 4, pt = 8, pb = 22;
    const iw = Wd - pl - pr, ih = Ht - pt - pb;
    const wmax = Math.max(40, ...d.gust.filter((v) => v != null), ...d.wind.filter((v) => v != null)), hmax = Math.max(2.5, ...d.main.map((x) => x.h || 0));
    const X = (i) => pl + (i / Math.max(1, n - 1)) * iw;
    const Yw = (v) => pt + ih - (v / wmax) * ih, Yh = (v) => pt + ih - (v / hmax) * ih;
    const poly = (arr, Y) => { const pts = []; arr.forEach((v, i) => { if (v != null) pts.push(X(i).toFixed(1) + ',' + Y(v).toFixed(1)); }); return pts; };
    const wavePts = poly(d.main.map((x) => x.h), Yh), windPts = poly(d.wind, Yw), gustPts = poly(d.gust, Yw);
    const nowI = Math.max(0, d.t.findIndex((s) => s * 1000 >= hourNow()));
    const farI = d.t.findIndex((s) => s * 1000 - hourNow() > FAR_MS);
    let g = '';
    if (farI > 0) g += '<rect x="' + X(farI).toFixed(1) + '" y="' + pt + '" width="' + (pl + iw - X(farI)).toFixed(1) + '" height="' + ih + '" class="far-bg"/>';
    days.forEach((o, k) => {
      const x0 = X(o.idx[0]), x1 = X(o.idx[o.idx.length - 1]);
      if (k === sel) g += '<rect x="' + x0.toFixed(1) + '" y="' + pt + '" width="' + Math.max(2, x1 - x0).toFixed(1) + '" height="' + ih + '" class="sel-bg"/>';
      g += '<line x1="' + x0.toFixed(1) + '" x2="' + x0.toFixed(1) + '" y1="' + pt + '" y2="' + (pt + ih) + '" class="sep"/>';
      g += '<text x="' + ((k === days.length - 1 && (x1 - x0) < 60 ? x1 : (x0 + x1) / 2)).toFixed(1) + '" y="' + (Ht - 7) + '" text-anchor="' + (k === days.length - 1 && (x1 - x0) < 60 ? 'end' : 'middle') + '" class="dl">' + esc(o.label) + '</text>';
      g += '<rect x="' + x0.toFixed(1) + '" y="0" width="' + Math.max(8, x1 - x0).toFixed(1) + '" height="' + Ht + '" fill="transparent" data-act="wgDay" data-i="' + k + '" style="cursor:pointer"><title>' + esc(o.label) + '</title></rect>';
    });
    const area = wavePts.length ? '<polygon class="wave-a" points="' + X(d.main.findIndex((x) => x.h != null)).toFixed(1) + ',' + (pt + ih) + ' ' + wavePts.join(' ') + ' ' + wavePts[wavePts.length - 1].split(',')[0] + ',' + (pt + ih) + '"/><polyline class="wave-l" points="' + wavePts.join(' ') + '"/>' : '';
    const nowX = X(nowI).toFixed(1);

      (windPts.length ? '<polyline class="wind-l" points="' + windPts.join(' ') + '"/>' : '') +
      '<line x1="' + nowX + '" x2="' + nowX + '" y1="' + pt + '" y2="' + (pt + ih) + '" class="now"/>' +
      '<text x="' + (pl + 2) + '" y="' + (pt + 9) + '" class="ax">vent max ' + Math.round(wmax) + ' km/h</text><text x="' + (Wd - pr - 2) + '" y="' + (pt + 9) + '" text-anchor="end" class="ax ax-w">houle max ' + hv(hmax) + (unit === 'ft' ? ' pieds' : ' m') + '</text></svg>';
  }

  function dayTable(D) {
    const { d } = D, day = D.days[D.sel], sea = d.sea, sel = atMs();
    const cols = day.idx;
    const cell = (cls, inner, style, i) => '<td class="' + cls + (isNight(d, d.t[i]) ? ' night' : '') + (d.t[i] * 1000 - hourNow() > FAR_MS ? ' far' : '') + (d.t[i] * 1000 === sel ? ' cur' : '') + '"' + (style ? ' style="' + style + '"' : '') + '>' + inner + '</td>';

    html += '<tr class="sec"><th class="rowh" colspan="' + (cols.length + 1) + '">Vent</th></tr>';
    html += row('Vent', 'km/h', (i) => { const v = d.wind[i]; if (v == null) return cell('nd', '–', '', i); const c = K.windColor(v); return cell('v', Math.round(v), bg(c) + ';' + txtOn(c), i); });
    html += row('Rafales', 'km/h', (i) => { const v = d.gust[i]; if (v == null) return cell('nd', '–', '', i); const c = K.windColor(v); return cell('v', Math.round(v), bg(c) + ';' + txtOn(c), i); });
    html += row('Direction', '', (i) => cell('dr', d.wdir[i] == null ? '–' : rot(d.wdir[i]) + '<small>' + U.compass(d.wdir[i]) + '</small>', '', i));
    if (sea) {
      html += '<tr class="sec"><th class="rowh" colspan="' + (cols.length + 1) + '">Houle</th></tr>';
      html += row('Hauteur', '(' + hUnit() + ')', (i) => { const v = d.main[i].h; if (v == null) return cell('nd', '–', '', i); const c = K.waveColor(v); return cell('v', hv(v), bg(c) + ';' + txtOn(c), i); });
      html += row('Période', '(secondes)', (i) => { const v = d.main[i].t; return cell('v2', v == null ? '–' : Math.round(v), '', i); });
      html += row('Direction', '', (i) => cell('dr', d.main[i].d == null ? '–' : rot(d.main[i].d) + '<small>' + U.compass(d.main[i].d) + '</small>', '', i));
      html += row('Puissance', 'kW/m', (i) => { const v = d.power[i]; return cell('v2', v == null ? '–' : Math.round(v), '', i); }, 'power');
      if (d.energy && d.energy.some((v) => v != null)) html += row('Énergie', 'kJ', (i) => { const v = d.energy[i]; return cell('v2', v == null ? '–' : Math.round(v), '', i); }, 'energy');
      if (d.sh.some((v) => v != null)) {

        if (d.s2h.some((v) => v != null)) {

          if (d.s2d && d.s2d.some((v) => v != null)) html += row('2e houle, direction', '', (i) => cell('dr', d.s2d[i] == null ? '–' : rot(d.s2d[i]) + '<small>' + U.compass(d.s2d[i]) + '</small>', '', i));

  function renderDetail() {

  A.cond.click = (lat, lon) => { if (!C.active || C.view === 'depth') return false; showDetail(lat, lon); return true; };

  /* ---------- panneau ---------- */
  function legendHtml() {
    const wind = C.view === 'wind', stops = wind ? K.WIND_STOPS : K.WAVE_STOPS, max = stops[stops.length - 1][0];
    const ticks = (wind ? [0, 10, 20, 30, 40, 55, 70, 90] : [0, 1, 2, 3, 4, 5.5, 8]).map((v) => '<span style="left:' + (v / max) * 100 + '%">' + v + '</span>').join('');

      '<span class="scale"><i class="bar" style="background:linear-gradient(90deg,' + stops.map((s) => lerp(s[1]) + ' ' + (s[0] / max) * 100 + '%').join(',') + ')"></i><span class="ticks">' + ticks + '</span></span></div>';

  function renderPanel() {

        '<div class="cp-row cp-legend"><span class="lg"><b>Profondeur</b></span><span class="scale"><i class="bar" style="background:linear-gradient(90deg,#0b1f5c,#1f4e9c,#3f86c9,#7fc0e8,#cfeaf6)"></i><span class="ticks"><span style="left:0">profond</span><span style="left:100%">peu profond</span></span></span></div>' +
        '<p class="cp-warn" role="note">Carte des fonds marins GEBCO (précision d\'environ 450 m, moins près des côtes). Plus c\'est foncé, plus c\'est profond. À titre d\'information : ne sert pas à naviguer ni pour la sécurité en mer.</p>' + depthOpt();
      return;
    }
