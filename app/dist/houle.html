  });

  /* ---------- spots à classer ---------- */
  const C = { ids: [], i: 0, sel: [], done: 0, alerted: 0 };
  A.classBanner = () => {
    const n = SC.toClassify(S.spots).length;
    if (!n) return '';
    return '<div class="notice notice--class"><span><b>' + n + ' spot' + (n > 1 ? 's' : '') + ' à classer</b> : surf, bodyboard, longboard ou autre (plusieurs possibles).</span><button class="btn btn-small btn-primary" data-act="classStart">Classer</button></div>';
  };

  A.validBanner = () => {
    const n = S.spots.filter((s) => !H.spotclass.needsClass(s) && !H.spotclass.isValidated(s)).length;
    const ok = S.spots.filter((s) => H.spotclass.isValidated(s)).length;
    if (!S.spots.length) return '';
    return '<p class="fine valid-sum">' + ok + ' spot' + (ok > 1 ? 's' : '') + ' validé' + (ok > 1 ? 's' : '') + ' (surveillé' + (ok > 1 ? 's' : '') + ' tout seul)' + (n ? ' · ' + n + ' à compléter (ouvre un spot, puis « Compléter »)' : '') + '.</p>';
  };

  /* ---------- classer + régler les alertes, en regardant le spot sur la carte ----------
     Une fiche en bas d'écran (la carte reste visible) : la carte zoome sur le spot, on choisit la discipline
     et, d'un coup, les conditions pour être prévenu. Les réglages sont repris d'un spot au suivant. */
  const DIRS = [['auto', 'D\'après la côte (proposé)'], ['', 'Toutes'], ['0', 'Nord'], ['45', 'Nord-est'], ['90', 'Est'], ['135', 'Sud-est'], ['180', 'Sud'], ['225', 'Sud-ouest'], ['270', 'Ouest'], ['315', 'Nord-ouest']];
  const TIDES = [['all', 'Toutes les marées'], ['low', 'Basse mer'], ['mid', 'Mi-marée'], ['high', 'Haute mer']];
  const CFG = { alerts: true, waveMin: 1, waveMax: 3, periodMin: 8, periodMax: 0, windMax: 25, swell: 'auto', wind: 'auto', tide: 'all' };
  const arc = (c) => (c === '' ? [0, 360] : [(parseInt(c, 10) + 315) % 360, (parseInt(c, 10) + 45) % 360]);
  const $s = () => document.getElementById('clsSheet');
  const optHtml = (list, cur) => list.map((o) => '<option value="' + o[0] + '"' + (String(cur) === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('');

  function closeSheet() { if (A.sec) A.sec.detach(); const el = $s(); if (el) el.remove(); if (S.mapObj && S.mapObj.setCurrent) S.mapObj.setCurrent(null); }

  // le spot en cours de validation : sélectionné, repère vert, et la carte se centre exactement sur son point GPS
  // (dans la partie de la carte que la fiche ne cache pas), avec un zoom moyen pour garder le contexte autour
  const FOCUS_ZOOM = 14;
  function showOnMap(s) {
    if (!S.mapObj) return;
    S.selectedId = s.id;
    if (S.mapObj.setCurrent) S.mapObj.setCurrent(s.id);
    let shift = null;
    try {
      const el = $s(), mapEl = S.mapObj.raw && S.mapObj.raw.getContainer && S.mapObj.raw.getContainer();
      if (el && mapEl) shift = U.visibleShift(mapEl.getBoundingClientRect(), el.getBoundingClientRect());
    } catch (e) { shift = null; }
    if (S.mapObj.focusOn) S.mapObj.focusOn(s.lat, s.lon, FOCUS_ZOOM, shift);
    else S.mapObj.flyTo(s.lat, s.lon, FOCUS_ZOOM);
  }

  function step() {
    // saute les spots déjà classés ou supprimés entre-temps
    while (C.i < C.ids.length && !S.spots.find((s) => s.id === C.ids[C.i] && SC.needsClass(s))) C.i++;
    if (C.i >= C.ids.length) {
      closeSheet();
      const left = SC.toClassify(S.spots).length;
      A.dialog.open('<div class="dlg"><h2>' + (left ? 'Pause' : 'Tout est classé') + '</h2><p>' + C.done + ' spot(s) classé(s)' + (C.alerted ? ', dont ' + C.alerted + ' surveillé(s) : Houle te prévient quand leurs conditions arrivent' : '') + (left ? ' ; ' + left + ' restent à classer (tu peux reprendre quand tu veux).' : '. Merci !') + '</p><div class="dlg-actions"><span class="sp"></span><button class="btn btn-primary" data-act="classEnd">OK</button></div></div>');
      return;
    }
    const s = S.spots.find((x) => x.id === C.ids[C.i]);
    C.sel = [];
    const chips = SC.DISCS.map((d) => '<button type="button" class="kf kf--big" data-act="clsToggle" data-k="' + d.k + '" aria-pressed="false"><i class="dchip dchip--' + d.cls + '"></i>' + d.label + '</button>').join('');
    const nm = String(s.name || '').trim() && !/^Spot importé$/.test(s.name) ? esc(s.name) : '<i>Spot sans nom</i>';
    const num = (id, label, v, st, mn) => '<label class="fld">' + label + '<input id="' + id + '" type="number" step="' + st + '" min="' + mn + '" value="' + v + '" inputmode="decimal"></label>';
    let el = $s();
    if (!el) { el = document.createElement('div'); el.id = 'clsSheet'; el.className = 'cls-sheet'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Classer ce spot'); document.body.appendChild(el); }
    el.innerHTML = '<div class="cls-top"><div><span class="fine">Spot ' + (C.i + 1) + ' sur ' + C.ids.length + '</span><div class="cls-name">' + nm + '</div></div>' +
      '<button type="button" class="btn btn-small" data-act="clsSat" title="Vue satellite">Satellite</button><button type="button" class="btn btn-small" data-act="classEnd" aria-label="Arrêter">✕</button></div>' +
      (s.notes ? '<p class="cls-notes"><b>Tes notes :</b> ' + esc(String(s.notes).slice(0, 260)) + '</p>' : '') +
      '<div class="cls-chips" role="group" aria-label="Disciplines">' + chips + '</div>' +
      '<div id="clsSecWrap"><p class="fine">Le camembert sur la carte : <b>vert = houle (ou vent) parfait</b>, orange = limite, rouge = rien. Je le propose d\'après la côte, c\'est toi qui le règles.</p><div id="clsSec" class="cls-sec"></div>' +
      '<div id="clsSelFallback" hidden><div class="grid2"><label class="fld">Houle venant de<select id="cl_sw">' + optHtml(DIRS, CFG.swell) + '</select></label><label class="fld">Vent venant de<select id="cl_wd">' + optHtml(DIRS, CFG.wind) + '</select></label></div></div></div>' +
      '<label class="chk cls-al"><input id="cl_alerts" type="checkbox"' + (CFG.alerts ? ' checked' : '') + '> Me prévenir quand les conditions de ce spot arrivent</label>' +
      '<div id="clsCond" class="cls-cond"' + (CFG.alerts ? '' : ' hidden') + '><div class="grid2">' + num('cl_wmin', 'Houle min (m)', CFG.waveMin, 0.1, 0) + num('cl_wmax', 'Houle max (m)', CFG.waveMax, 0.1, 0) + '</div>' +
      '<div class="grid2">' + num('cl_per', 'Période min (s)', CFG.periodMin, 1, 0) + num('cl_perMax', 'Période max (s), 0 = sans limite', CFG.periodMax, 1, 0) + '</div><div class="grid2">' + num('cl_wind', 'Vent max (km/h)', CFG.windMax, 1, 0) + '<span></span></div>' +
      '<label class="fld">Marée<select id="cl_tide">' + optHtml(TIDES, CFG.tide) + '</select></label></div>' +
      '<div class="dlg-actions"><button class="btn" data-act="clsSkip">Passer</button><span class="sp"></span><button class="btn btn-primary" id="clsOk" data-act="clsSave" disabled>Valider et suivant</button></div>';
    showOnMap(s);
    if (A.sec) A.sec.detach();
    const on = A.sec && A.sec.attach(s.lat, s.lon);
    const fb = document.getElementById('clsSelFallback'), hint = document.querySelector('#clsSecWrap > .fine');
    if (!on) { if (fb) fb.hidden = false; if (hint) hint.hidden = true; }
  }
  const next = () => { C.i++; step(); };
  const val = (id, d) => { const v = parseFloat(String((document.getElementById(id) || {}).value || '').replace(',', '.')); return isFinite(v) ? v : d; };

  // case à cocher : un clic « data-act » est bloqué par le gestionnaire commun, on écoute le changement
  document.addEventListener('change', (ev) => { if (ev.target && ev.target.id === 'cl_alerts') { CFG.alerts = !!ev.target.checked; const c = document.getElementById('clsCond'); if (c) c.hidden = !CFG.alerts; } });

  Object.assign(A.actions, {
    classStart() { C.ids = SC.toClassify(S.spots).map((s) => s.id); C.i = 0; C.done = 0; C.alerted = 0; closeSheet(); step(); },

    clsSkip() { next(); },

      CFG.alerts = !!document.getElementById('cl_alerts').checked;

        CFG.waveMin = val('cl_wmin', CFG.waveMin); CFG.waveMax = Math.max(CFG.waveMin, val('cl_wmax', CFG.waveMax));
        CFG.periodMin = val('cl_per', CFG.periodMin); CFG.periodMax = Math.max(0, val('cl_perMax', 0)); CFG.windMax = val('cl_wind', CFG.windMax);
        if (CFG.periodMax > 0 && CFG.periodMax < CFG.periodMin) CFG.periodMax = 0;
        CFG.swell = document.getElementById('cl_sw').value; CFG.wind = document.getElementById('cl_wd').value; CFG.tide = document.getElementById('cl_tide').value;
        const drawn = A.sec && A.sec.models();
        // secteurs : « d'après la côte » = vert + orange proposés par la forme de la côte ; sinon quatre points cardinaux (±45°)
        const mdl = (choice, k) => (choice === 'auto' ? (coast && coast[k]) || SE.fix({ from: 0, to: 0, orL: 0, orR: 0 }) : SE.fix({ from: arc(choice)[0], to: arc(choice)[1], orL: 0, orR: 0 }));
        let coast = null;
        if (!drawn && (CFG.swell === 'auto' || CFG.wind === 'auto')) { try { coast = await A.coastStarter(s.lat, s.lon); } catch (e) { coast = null; } }
        const sw = drawn ? SE.fix(drawn.swell) : mdl(CFG.swell, 'swell'), wd = drawn ? SE.fix(drawn.wind) : mdl(CFG.wind, 'wind');
        Object.assign(rules, { waveMin: CFG.waveMin, waveMax: CFG.waveMax, periodMin: CFG.periodMin, periodMax: CFG.periodMax, windMax: CFG.windMax, swellOn: true, swellFrom: sw.from, swellTo: sw.to, swellOrL: sw.orL, swellOrR: sw.orR, dirOn: true, dirFrom: wd.from, dirTo: wd.to, dirOrL: wd.orL, dirOrR: wd.orR, tide: CFG.tide, tideMin: -9, tideMax: 9 });
        extra = { quiet: false };
      }
      const saved = await S.store.saveSpot(Object.assign({}, s, extra, { rules: SC.classify(rules, C.sel) }));
      const j = S.spots.findIndex((x) => x.id === saved.id);
      if (j >= 0) S.spots[j] = Object.assign({}, S.spots[j], saved);
      C.done++;
      if (CFG.alerts) C.alerted++;
      if (A.refreshForecasts && CFG.alerts) A.refreshForecasts(false, S.spots[j]);
      next();
    },
    classEnd() { closeSheet(); A.dialog.close(); A.render(); A.syncMap(); },
  });
})();

/* ===== app-spots ===== */
/* Houle - onglets Spots et Alertes, fiche d'un spot, recherche, sauvegarde */
(function () {
  const H = (globalThis.Houle = globalThis.Houle || {});
  const A = H.app, U = H.util, F = H.forecast, S = A.S, $ = A.$;
  const esc = U.esc;

  const photoCache = {}; // id -> tableau de photos (chargées à la demande)
  const photoLoading = {};

  const windyUrl = (s) => {
    const la = s.lat.toFixed(3), lo = s.lon.toFixed(3);
    return 'https://www.windy.com/' + la + '/' + lo + '?waves,' + la + ',' + lo + ',10';
  };

  /* ---------- bandeau de 8 jours ---------- */
  function dayLabel(d, days) {
    const n = A.daysAhead(days, d);
    return U.fmtDay(d.date) + (n === 0 ? " (aujourd'hui)" : n === 1 ? ' (demain)' : '');
  }
  function dayHead(d, days) {
    const n = A.daysAhead(days, d);
    return esc(U.fmtDay(d.date)) + (n === 0 ? '<small>aujourd\'hui</small>' : n === 1 ? '<small>demain</small>' : '');
  }
  function cell(d, days, i) {
    const h = Math.max(10, Math.min(100, Math.round(((d.waveMax || 0) / 4) * 100)));
    const status = d.status === 'good' ? 'session possible' : d.status === 'maybe' ? 'créneau court' : 'pas de session';
    return '<div class="cell cell--' + d.status + '" role="img" aria-label="' + esc(dayLabel(d, days) + ' : ' + status + ', houle ' + U.num(d.stats.wave) + ' m') + '" title="' + esc(dayLabel(d, days) + ' : ' + status) + '">' +
      '<span class="cd">' + (i === 0 ? 'auj.' : esc(U.weekdayShort(d.date))) + '</span><span class="cb"><i style="height:' + h + '%"></i></span><span class="cv">' + U.num(d.stats.wave) + '</span></div>';
  }
  function strip(s) {
    const f = S.fc[s.id];
    if (!f || f.status === 'loading' && !f.days) return '<div class="strip is-loading" aria-label="Chargement de la prévision">' + '<div class="cell"></div>'.repeat(8) + '</div>';
    if (f.status === 'error') return '<div class="fc-error"><span>' + esc(f.error) + '</span><button class="btn btn-small" data-act="retry" data-id="' + esc(s.id) + '">Réessayer</button></div>';
    return '<div class="strip' + (f.status === 'loading' ? ' is-stale' : '') + '">' + f.days.map((d, i) => cell(d, f.days, i)).join('') + '</div>';
  }

  const DISC = { s: ['Surf', 'surf'], b: ['Bodyboard', 'body'], l: ['Longboard', 'long'] };
  const TIDE = { low: 'marée basse', mid: 'mi-marée', high: 'marée haute', all: 'toutes marées' };
  const tideTxt = (s) => (s.rules && TIDE[s.rules.tide] ? ' · ' + TIDE[s.rules.tide] : '');
  const discChip = (s) => {
    const ds = H.spotclass.discsOf(s.rules);
    if (!ds.length) return '<i class="dchip dchip--none" title="À classer"></i>';
    return ds.map((k) => { const d = H.spotclass.DISCS.find((x) => x.k === k); return '<i class="dchip dchip--' + d.cls + '" title="' + d.label + '"></i>'; }).join('');
  };
  const emojiOf = (s) => { const f = S.fc[s.id]; if (!f || !f.days) return ''; const e = F.swellEmoji(f.days); return ' <span class="swe" title="' + esc(e.label + ' (' + U.num(e.wave) + ' m)') + '">' + e.emoji + '</span>'; };
  A.emojiForSpot = (id) => { const f = S.fc[id]; return f && f.days ? F.swellEmoji(f.days).emoji : ''; };

  const AC = H.access;
  const N_ON = () => !!(A.near && A.near.on);
  const ACC_CLS = { ok: 'ok', part: 'part', no: 'no', unknown: 'unk' };
  /* bloc d'accessibilité en lecture seule (fiche d'un spot, fiche d'un spot connu) */
  A.accessBlock = (a, osmNote) => {
    const lv = AC.level(a);
    let out = '<div class="acc acc--' + ACC_CLS[lv] + '"><h4><span aria-hidden="true">♿</span> ' + AC.LEVEL_TXT[lv] + '</h4>';
    if (lv !== 'unknown') {
      out += '<ul class="acc-list">' + AC.lines(a).map((l) => '<li><span>' + esc(l.label) + '</span><b>' + esc(l.value) + '</b></li>').join('') + '</ul>';
      out += '<p class="fine">' + (AC.normalize(a).osm || osmNote ? 'Piste tirée d\'OpenStreetMap (contributeurs bénévoles) : à vérifier sur place. ' : '') + '« Non précisé » veut dire qu\'on ne sait pas, pas que c\'est inaccessible.</p>';
    } else out += '<p class="fine">Rien n\'est renseigné pour ce spot. Tu peux le compléter avec « Modifier ».</p>';
    return out + '</div>';
  };

  /* état du spot : validé (surveillé tout seul) ou liste de ce qui manque */
  const validBlock = (s) => {
    const m = H.spotclass.missing(s);
    if (!m.length) return '<div class="valid valid--ok"><b>✔ Spot validé</b><p class="fine">Houle surveille ce spot toute seule et te prévient quand tes conditions arrivent. Rien à activer.</p></div>';
    return '<div class="valid valid--todo"><b>À compléter pour être surveillé</b><p class="fine">Il manque : ' + esc(m.join(', ')) + '.</p><button class="btn btn-small btn-primary" data-act="edit" data-id="' + esc(s.id) + '">Compléter</button></div>';
  };

  function detail(s) {
    const f = S.fc[s.id];
    let out = '<div class="detail">';
    if (f && f.days) {
      out += '<table class="days"><tbody>' + f.days.map((d) => {
        const lab = dayHead(d, f.days);
        if (d.status === 'no') return '<tr class="d--no"><th scope="row">' + lab + '</th><td colspan="3" class="why">' + esc(F.failText(d) || 'Conditions non réunies') + '</td></tr>';
        return '<tr class="d--' + d.status + '"><th scope="row">' + lab + '</th><td class="win">' + esc(F.windowText(d.window)) + '</td><td>' + U.num(d.stats.wave) + ' m · ' + U.num(d.stats.period, 0) + ' s</td><td class="wnd">' + A.windArrow(d.stats.windDir) + U.num(d.stats.wind, 0) + ' km/h ' + esc(U.compass(d.stats.windDir)) + '</td></tr>';
      }).join('') + '</tbody></table>';
      out += '<p class="fine">Houle du modèle Open-Meteo (large, pas sur le pic). Les vagues réelles dépendent aussi de la marée et de l\'exposition du spot.</p>';
    }
    out += validBlock(s);
    out += A.accessBlock(s.rules && s.rules.access);
    if (s.notes) out += '<p class="notes">' + esc(s.notes).replace(/\n/g, '<br>') + '</p>';
    const ph = photoCache[s.id];
    if (s.photoCount && !ph) out += '<p class="fine">Chargement des photos…</p>';
    if (ph && ph.length) out += '<div class="photos">' + ph.map((p) => (U.safeImg(p) ? '<img src="' + U.safeImg(p) + '" alt="Photo du spot ' + esc(s.name) + '">' : '')).join('') + '</div>';
    const links = [];
    const own = U.safeUrl(s.linkUrl);
    if (own) links.push('<a href="' + esc(own) + '" target="_blank" rel="noopener noreferrer">' + A.icon('link') + 'Ma prévision</a>');
    links.push('<a href="' + esc(windyUrl(s)) + '" target="_blank" rel="noopener noreferrer">' + A.icon('link') + 'Windy sur ce point</a>');
    out += '<div class="links">' + links.join('') + '</div>';
    out += '<div class="actions">' +
      '<button class="btn btn-small" data-act="edit" data-id="' + esc(s.id) + '">' + A.icon('edit') + 'Modifier</button>' +
      (s.quiet && !H.spotclass.isValidated(s) ? '<button class="btn btn-small btn-primary" data-act="followSpot" data-id="' + esc(s.id) + '">Suivre (alertes)</button>' : '') +
      '<button class="btn btn-small" data-act="linkSpot" data-id="' + esc(s.id) + '">' + A.icon('link') + 'Lien</button>' +
      (S.store.social ? '<button class="btn btn-small" data-act="shareSpot" data-id="' + esc(s.id) + '">' + A.icon('share') + 'Partager</button>' : '') +
      (S.store.social ? '<button class="btn btn-small" data-act="toMap" data-id="' + esc(s.id) + '">Ajouter à une carte</button>' : '') +
      '<button class="btn btn-small" data-act="retry" data-id="' + esc(s.id) + '">Actualiser</button>' + A.voiceButtons('spot', s.id) + '</div>';
    return out + '</div>';
  }

  A.renderers.spots = () => {
    let out = '<div class="head"><h2>Mes spots<span class="count">' + S.spots.length + '</span></h2>' +
      '<button class="btn btn-primary" id="btnAdd" data-act="add" aria-pressed="' + S.adding + '">' + A.icon('plus') + 'Ajouter un spot</button></div>';
    out += A.classBanner();
    out += A.validBanner();
    if (S.spots.length) out += A.nearBlock(S.spots.length, S.spots.filter(A.inNear).length, 'spots');
    if (S.spots.length) out += '<div class="actions"><button class="btn btn-small" data-act="accFilter" aria-pressed="' + !!S.accessOnly + '">♿ Accessibles seulement</button></div>';
    if (!S.spots.length) {
      out += '<div class="empty"><h2>Place ton premier spot</h2><ol class="howto"><li>Appuie sur <b>« Ajouter un spot »</b> ci-dessus.</li><li><b>Touche la carte</b> à l\'endroit exact (tu pourras déplacer le repère), ou colle des coordonnées GPS dans la barre de recherche.</li><li>Donne-lui un nom et règle tes conditions idéales : Houle te prévient quand elles arrivent.</li></ol><button class="btn btn-small" data-act="tour">Voir le tutoriel</button></div>';
    }
    const shown = S.spots.filter(A.inNear).filter((s) => !S.accessOnly || AC.level(s.rules && s.rules.access) === 'ok');
    if (S.spots.length && !shown.length && !S.accessOnly) out += '<div class="empty"><p>Aucun de tes spots dans ce rayon. Agrandis le rayon ou touche « Tout afficher ».</p></div>';
    if (S.accessOnly && !shown.length && S.spots.length) out += '<div class="empty"><p>Aucun de tes spots n\'est marqué « accessible » (parking, sable et chemin tous à « oui »). Complète la fiche avec « Modifier », ou désactive le filtre.</p></div>';
    shown.forEach((s) => {
      const sel = s.id === S.selectedId;
      if (sel && s.photoCount && !photoCache[s.id] && !photoLoading[s.id]) {
        photoLoading[s.id] = true;
        S.store.getPhotos(s.id).then((p) => { photoCache[s.id] = p; }).catch(() => { photoCache[s.id] = []; }).then(() => { photoLoading[s.id] = false; A.scheduleRender(); });
      }
      out += '<article class="spot' + (sel ? ' is-selected' : '') + '" data-spot="' + esc(s.id) + '">' +
        '<button class="spot-main" data-act="select" data-id="' + esc(s.id) + '" aria-expanded="' + sel + '"><span class="spot-name">' + discChip(s) + esc(s.name) + emojiOf(s) + '</span><span class="spot-coords">' + esc(U.fmtCoords(s.lat, s.lon) + tideTxt(s)) + '</span></button>' +
        strip(s) + (sel ? detail(s) : '') + '</article>';
    });
    out += '<div class="foot"><p class="fine">' + (S.mode === 'local' ? 'Tes spots sont enregistrés sur cet appareil, dans ce navigateur. Exporte une sauvegarde de temps en temps.' : 'Tes spots sont privés : toi seul peux les voir.') + '</p>' +
      '<div class="actions"><button class="btn btn-small" data-act="export">Exporter une sauvegarde</button><button class="btn btn-small" data-act="import">Restaurer</button></div><div class="actions"><button class="btn btn-small btn-primary" data-act="importPlaces">Importer mes lieux (Google Maps…)</button></div></div>';
    return out;
  };

  /* ---------- onglet Alertes ---------- */
  const notifBlock = () => {
    if (!('Notification' in globalThis)) return '<p class="fine">Ce navigateur ne gère pas les notifications. Les alertes restent visibles ici.</p>';
    const p = Notification.permission;
    if (p === 'granted') return '<p class="fine">Notifications activées. Elles partent quand l\'appli est ouverte (onglet ouvert ou appli installée sur l\'écran d\'accueil).</p>';
    if (p === 'denied') return '<p class="fine">Les notifications sont bloquées dans ce navigateur. Autorise-les dans les réglages du site pour les recevoir.</p>';
    return '<div class="notice"><span>Reçois une notification quand une alerte se déclenche.</span><button class="btn btn-small" data-act="notif">' + A.icon('bell') + 'Activer</button></div>';
  };

  const sessionLine = (spotName, day, lead) =>
    '<span class="al-name">' + esc(spotName) + '</span><span class="al-when">' + esc(U.fmtDay(day.date)) + ' · ' + esc(U.leadLabel(lead)) + '</span>' +
    '<span class="al-data"><b>' + esc(F.windowText(day.window)) + '</b> · ' + U.num(day.stats.wave) + ' m à ' + U.num(day.stats.period, 0) + ' s · vent ' + U.num(day.stats.wind, 0) + ' km/h ' + esc(U.compass(day.stats.windDir)) + '</span>';

  A.renderers.alerts = () => {
    let out = '<div class="head"><h2>Alertes</h2><span class="actions"><button class="btn btn-small" data-act="refreshAll">Actualiser</button>' + A.voiceButtons('alerts') + '</span></div>' + notifBlock();
    if (!S.spots.length) return out + '<div class="empty"><p>Ajoute un spot et ses conditions idéales : les alertes apparaîtront ici.</p></div>';
    const loading = S.spots.some((s) => !S.fc[s.id] || (S.fc[s.id].status === 'loading' && !S.fc[s.id].days));
    const spotOf = (id) => S.spots.find((s) => s.id === id);
    const aNear = (id) => { const sp = spotOf(id); return !sp || A.inNear(sp); };
    const alertsShown = S.alerts.filter((a) => aNear(a.spotId));
    const farAlerts = S.alerts.length - alertsShown.length;
    out += A.nearBlock(S.spots.length, S.spots.filter(A.inNear).length, 'spots');
    {
      const fol = S.spots.filter((x) => H.spotclass.isFollowed(x)).length, cls = H.spotclass.toClassify(S.spots).length;
      out += '<p class="fine valid-sum"><b>' + fol + ' spot' + (fol > 1 ? 's' : '') + ' en alerte</b> sur ' + S.spots.length + (cls ? ' · ' + cls + ' à classer et régler : <button type="button" class="btn btn-small btn-primary" data-act="classStart">Classer et régler les alertes</button>' : '') + '.</p>';
    }
    out += '<h3>À ne pas rater</h3>';
    if (alertsShown.length) {
      out += '<ul class="alist">' + alertsShown.map((a) => {
        const sp = S.spots.find((s) => s.id === a.spotId);
        const day = S.fc[a.spotId].days.find((d) => d.date === a.date);
        return '<li class="al al--lead' + Math.min(a.lead, 3) + '">' + sessionLine(a.spotName, day, a.lead) +
          (S.store.social && sp ? '<button class="btn btn-small" data-act="shareSession" data-id="' + esc(a.spotId) + '" data-date="' + esc(a.date) + '">' + A.icon('share') + 'Partager la session</button>' : '') + '</li>';
      }).join('') + '</ul>';
    } else {
      out += '<p class="muted">' + (loading ? 'Calcul en cours…' : N_ON() ? 'Aucune alerte dans ce rayon.' : 'Aucune alerte aujourd\'hui. Elles se déclenchent selon les délais choisis pour chaque spot (7 jours, 3 jours, la veille, le matin même).') + '</p>';
    }
    if (farAlerts) out += '<p class="fine far">+ ' + farAlerts + ' alerte' + (farAlerts > 1 ? 's' : '') + ' plus loin, hors de ton rayon. <button type="button" class="btn btn-small" data-act="nearOff">Tout afficher</button></p>';
    const shown = new Set(S.alerts.map((a) => a.spotId + '|' + a.date));
    const others = S.upcoming.filter((u) => !shown.has(u.spot.id + '|' + u.day.date) && A.inNear(u.spot));
    const farOthers = S.upcoming.filter((u) => !shown.has(u.spot.id + '|' + u.day.date)).length - others.length;
    out += '<h3>' + (S.alerts.length ? 'Autres sessions à venir' : 'Prochaines bonnes sessions') + '</h3>';
    if (others.length) {
      out += '<ul class="alist">' + others.map((u) =>
        '<li class="al">' + sessionLine(u.spot.name, u.day, u.lead) +
        (S.store.social ? '<button class="btn btn-small" data-act="shareSession" data-id="' + esc(u.spot.id) + '" data-date="' + esc(u.day.date) + '">' + A.icon('share') + 'Partager la session</button>' : '') + '</li>').join('') + '</ul>';
    } else {
      out += '<p class="muted">' + (loading ? 'Calcul en cours…' : S.alerts.length ? 'Pas d\'autre session sur les 8 prochains jours.' : 'Aucune session ne correspond à tes critères sur les 8 prochains jours. Tu peux élargir les seuils dans la fiche de chaque spot.') + '</p>';
    }
    if (farOthers > 0) out += '<p class="fine far">+ ' + farOthers + ' session' + (farOthers > 1 ? 's' : '') + ' plus loin, hors de ton rayon. <button type="button" class="btn btn-small" data-act="nearOff">Tout afficher</button></p>';
    out += '<p class="fine">Les prévisions à 7 jours sont moins fiables que celles du jour même. Les alertes se calculent quand l\'appli est ouverte.</p>';
    return out;
  };

  /* ---------- actions ---------- */
  Object.assign(A.actions, {
    add() { if (S.adding) { A.stopAdd(); } else { A.startAdd(); A.toast('Touche la carte pour placer le spot'); } },
    select(el) { const id = el.dataset.id; if (S.selectedId === id) { S.selectedId = null; A.render(); } else A.selectSpot(id, true); },
    edit(el) { A.openSpotDialog(S.spots.find((s) => s.id === el.dataset.id)); },
    async retry(el) { const s = S.spots.find((x) => x.id === el.dataset.id); if (s) { await A.refreshForecasts(true, s); } },
    async refreshAll() { A.toast('Mise à jour des prévisions…'); await A.refreshForecasts(true); A.toast('Prévisions à jour'); },
    async notif() { const r = await Notification.requestPermission(); A.toast(r === 'granted' ? 'Notifications activées' : 'Notifications non activées'); A.render(); },
    async export() {
      const data = await S.store.exportAll();
      const url = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
      const a = document.createElement('a');
      a.href = url; a.download = 'houle-sauvegarde-' + U.ymd(new Date()) + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      A.toast('Sauvegarde exportée');
    },
    import() { $('#importFile').click(); },
  });

  $('#importFile').addEventListener('change', async (ev) => {
    const file = ev.target.files[0];
    ev.target.value = '';
    if (!file) return;
    try {
      const n = await S.store.importAll(JSON.parse(await file.text()));
      S.spots = await S.store.listSpots();
      A.render();
      if (S.mapObj.ready) S.mapObj.fitAll(S.spots);
      A.refreshForecasts(false);
      A.toast(n + ' spot(s) importé(s)');
    } catch (e) { A.fail(e.message === 'Fichier non reconnu' ? e : new Error('Fichier non reconnu')); }
  });

  /* ---------- fiche d'un spot (création / modification) ---------- */
  const num = (v, d) => { const n = parseFloat(String(v).replace(',', '.')); return Number.isFinite(n) ? n : d; };
  let D = null; // état de la fiche ouverte

  A.onTempMove = (lat, lon) => {
    if (!D) return;
    D.lat = lat; D.lon = lon;
    const i = $('#f_coords');
    if (i) i.value = U.fmtCoords(lat, lon);
  };

  const photosHtml = () => {
    if (D.photos === null) return '<span class="fine">Chargement des photos…</span>';
    return D.photos.map((p, i) => (U.safeImg(p) ? '<span class="thumb"><img src="' + U.safeImg(p) + '" alt="Photo ' + (i + 1) + '"><button type="button" data-act="rmPhoto" data-i="' + i + '" aria-label="Retirer la photo ' + (i + 1) + '">' + A.icon('x') + '</button></span>' : '')).join('');
  };

  const accessFieldset = (a) => {
    const n = AC.normalize(a);
    const sel = (f) => '<label class="fld">' + esc(f.label) + '<select id="f_acc_' + f.k + '">' + [['', 'Non précisé'], ['yes', 'Oui'], ['part', 'Difficile'], ['no', 'Non']].map((o) => '<option value="' + o[0] + '"' + ((n[f.k] || '') === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select></label>';
    return '<fieldset class="grp" id="accGrp"' + (n.osm ? ' data-osm="1"' : '') + '><legend>♿ Accessibilité (mobilité réduite)</legend>' + AC.FIELDS.map(sel).join('') +
      '<label class="fld">Distance à pied jusqu\'à l\'eau (m)<input id="f_acc_walk" type="number" inputmode="numeric" min="0" max="20000" step="10" value="' + (n.walk != null ? n.walk : '') + '" placeholder="Non précisée"></label>' +
      '<div class="row"><button type="button" class="btn btn-small" data-act="accOsm">Chercher dans OpenStreetMap</button></div>' +
      '<small id="accMsg">Laisse « Non précisé » si tu ne sais pas : rien n\'est inventé. La recherche OpenStreetMap ne remplit que les cases encore vides, à vérifier sur place.</small></fieldset>';
  };
  const readAccess = () => {
    const a = {};
    AC.FIELDS.forEach((f) => { a[f.k] = $('#f_acc_' + f.k).value; });
    a.walk = $('#f_acc_walk').value;
    if ($('#accGrp').dataset.osm) a.osm = true;
    return AC.normalize(a);
  };

  A.openSpotDialog = (spot, coords) => {
    const isNew = !spot;
    const R = F.withDefaults(spot ? spot.rules : (coords && coords.rules) || null);
    const rawRules = spot ? spot.rules : (coords && coords.rules) || null;
    const discSel = spot ? (H.spotclass.needsClass(spot) ? [] : H.spotclass.discsOf(rawRules)) : (coords && coords.rules && (coords.rules.disc || coords.rules.discs)) ? H.spotclass.discsOf(rawRules) : ['s'];
    D = { id: spot ? spot.id : null, lat: spot ? spot.lat : coords.lat, lon: spot ? spot.lon : coords.lon, photos: [] };
    if (spot && spot.photoCount) {
      D.photos = photoCache[spot.id] || null;
      if (D.photos === null) S.store.getPhotos(spot.id).then((p) => { photoCache[spot.id] = p; if (D && D.id === spot.id) { D.photos = p.slice(); $('#photoList').innerHTML = photosHtml(); } }).catch(() => { if (D) { D.photos = []; $('#photoList').innerHTML = photosHtml(); } });
      else D.photos = D.photos.slice();
    }
    const lead = (n, label) => '<label class="chk"><input type="checkbox" name="lead" value="' + n + '"' + (R.leads.indexOf(n) !== -1 ? ' checked' : '') + '> ' + label + '</label>';
    const html =
      '<form class="dlg" id="spotForm" novalidate>' +
      '<h2>' + (isNew ? 'Nouveau spot' : 'Modifier le spot') + '</h2>' +
      '<label class="fld">Nom<input id="f_name" type="text" maxlength="80"' + (isNew ? ' autofocus' : '') + ' value="' + esc(spot ? spot.name : (coords && coords.name) || '') + '" placeholder="Ex. La Gravière" autocomplete="off" required></label>' +
      '<label class="fld">Coordonnées GPS<input id="f_coords" type="text" inputmode="text" value="' + esc(U.fmtCoords(D.lat, D.lon)) + '" autocomplete="off"><small>Déplace le repère sur la carte, ou colle ici « latitude, longitude ».</small></label>' +
      '<div class="row"><button type="button" class="btn btn-small" data-act="useMyPos">' + A.icon('locate') + 'Ma position</button></div>' +
      '<label class="fld">Notes<textarea id="f_notes" rows="3" maxlength="4000" placeholder="Accès, type de vague, marée, dangers…">' + esc(spot ? spot.notes : (coords && coords.notes) || '') + '</textarea></label>' +
      '<div class="fld"><span class="lbl">Photos</span><div class="thumbs" id="photoList">' + photosHtml() + '</div><input id="f_photos" type="file" accept="image/*" multiple><small>Réduites automatiquement. 6 photos maximum.</small></div>' +
      '<label class="fld">Lien de prévision (Windguru, Windy, Ifremer…)<input id="f_link" type="url" inputmode="url" value="' + esc(spot ? spot.linkUrl : '') + '" placeholder="https://"></label>' +
      '<fieldset class="grp"><legend>Discipline(s) sur ce spot</legend><div class="chks">' + H.spotclass.DISCS.map((d) => '<label class="chk"><input type="checkbox" name="disc" value="' + d.k + '"' + (discSel.indexOf(d.k) !== -1 ? ' checked' : '') + '> ' + d.label + '</label>').join('') + '</div><small>Plusieurs possibles. Laisse tout décoché si tu ne sais pas encore : le spot restera « à classer ».</small></fieldset>' +
      '<label class="fld">Marée qui marche bien<select id="f_tide"><option value="">Je ne sais pas / non précisée</option>' + Object.keys(TIDE).map((k) => '<option value="' + k + '"' + (R.tide === k ? ' selected' : '') + '>' + TIDE[k][0].toUpperCase() + TIDE[k].slice(1) + '</option>').join('') + '</select><span class="fine">Pour mémoire : elle s\'affiche sur la fiche du spot. Les alertes ne la prennent pas encore en compte.</span></label>' +
      accessFieldset(R.access) +
      '<fieldset class="grp"><legend>Quand ça marche pour toi</legend>' +
      '<div class="grid2"><label class="fld">Houle min (m)<input id="f_waveMin" type="number" step="0.1" min="0" value="' + R.waveMin + '"></label><label class="fld">Houle max (m)<input id="f_waveMax" type="number" step="0.1" min="0" value="' + R.waveMax + '"></label>' +
      '<label class="fld">Puissance : période min (s)<input id="f_period" type="number" step="1" min="0" value="' + R.periodMin + '"></label><label class="fld">Période max (s), vide = pas de limite<input id="f_periodMax" type="number" step="1" min="0" value="' + (R.periodMax > 0 ? R.periodMax : '') + '" placeholder="ex. 16"></label><label class="fld">Vent max (km/h)<input id="f_wind" type="number" step="1" min="0" value="' + R.windMax + '"></label>' +
      '<label class="fld">Surf à partir de (h)<input id="f_hFrom" type="number" step="1" min="0" max="23" value="' + R.hourFrom + '"></label><label class="fld">jusqu\'à (h)<input id="f_hTo" type="number" step="1" min="1" max="24" value="' + R.hourTo + '"></label></div>' +
      '<div class="grid2"><label class="fld">Marée : hauteur min (m)<input id="f_tideMin" type="number" step="0.1" value="' + (typeof R.tideMin === 'number' ? R.tideMin : '') + '" placeholder="ex. -1"></label><label class="fld">Marée : hauteur max (m)<input id="f_tideMax" type="number" step="0.1" value="' + (typeof R.tideMax === 'number' ? R.tideMax : '') + '" placeholder="ex. 1,5"></label></div>' +
      '<small>Niveau de la mer d\'après le modèle mondial : 0 = niveau moyen, positif = marée haute, négatif = basse. Ordre de grandeur, pas les annuaires officiels.</small>' +
      '<div class="grid2"><label class="fld">Mètres d\'eau min<input id="f_waterMin" type="number" step="0.1" min="0" value="' + (typeof R.waterMin === 'number' ? R.waterMin : '') + '" placeholder="ex. 2"></label><label class="fld">Mètres d\'eau max<input id="f_waterMax" type="number" step="0.1" min="0" value="' + (typeof R.waterMax === 'number' ? R.waterMax : '') + '" placeholder="ex. 4"></label>' +

  const showErr = (m) => { const e = $('#spotErr'); if (e) { e.textContent = m; e.hidden = false; } };

  async function saveSpot() {
    const name = $('#f_name').value.trim();
    if (!name) return showErr('Donne un nom au spot.');
    const c = U.parseCoords($('#f_coords').value);
    if (!c) return showErr('Coordonnées non reconnues. Exemple : 43.48123, -1.55678');
    const linkRaw = $('#f_link').value.trim();
    const link = linkRaw ? U.safeUrl(linkRaw) : '';
    if (linkRaw && !link) return showErr('Le lien doit commencer par https://');
    const waveMin = num($('#f_waveMin').value, 0), waveMax = num($('#f_waveMax').value, 99);
    if (waveMin > waveMax) return showErr('La houle minimale doit être inférieure à la houle maximale.');
    const pMin = num($('#f_period').value, 0), pMax = num($('#f_periodMax').value, 0);
    if (pMax > 0 && pMax < pMin) return showErr('La période maximale doit être supérieure à la période minimale.');
    const hourFrom = Math.round(num($('#f_hFrom').value, 7)), hourTo = Math.round(num($('#f_hTo').value, 20));
    if (hourFrom >= hourTo) return showErr("L'heure de début doit être avant l'heure de fin.");
    const tMinRaw = $('#f_tideMin').value.trim(), tMaxRaw = $('#f_tideMax').value.trim();
    const tMin = tMinRaw === '' ? null : parseFloat(tMinRaw.replace(',', '.')), tMax = tMaxRaw === '' ? null : parseFloat(tMaxRaw.replace(',', '.'));
    if ((tMin === null) !== (tMax === null)) return showErr('Marée : renseigne les deux hauteurs (min et max), ou aucune.');
    if (tMin !== null && (!isFinite(tMin) || !isFinite(tMax) || tMin > tMax)) return showErr('Marée : la hauteur minimale doit être inférieure à la hauteur maximale.');
    const rules = {
      waveMin, waveMax, periodMin: num($('#f_period').value, 0), periodMax: num($('#f_periodMax').value, 0), windMax: num($('#f_wind').value, 99), hourFrom, hourTo, minHours: 2,
      dirOn: $('#f_dirOn').checked, dirFrom: num($('#f_dirFrom').value, 0), dirTo: num($('#f_dirTo').value, 360),
      dirOrL: Math.max(0, num($('#f_dirOrL').value, 0)), dirOrR: Math.max(0, num($('#f_dirOrR').value, 0)), swellOrL: Math.max(0, num($('#f_swOrL').value, 0)), swellOrR: Math.max(0, num($('#f_swOrR').value, 0)),
      swellOn: $('#f_swOn').checked, swellFrom: num($('#f_swFrom').value, 0), swellTo: num($('#f_swTo').value, 360), tide: $('#f_tide').value, access: readAccess(),
      leads: Array.from(document.querySelectorAll('input[name="lead"]:checked')).map((i) => parseInt(i.value, 10)),
    };
    const discs = Array.from(document.querySelectorAll('input[name="disc"]:checked')).map((i) => i.value);
    if (discs.length) Object.assign(rules, H.spotclass.classify({}, discs)); else rules.unclassified = true;
    if (tMin !== null) { rules.tideMin = tMin; rules.tideMax = tMax; }
    const wMinRaw = $('#f_waterMin').value.trim(), wMaxRaw = $('#f_waterMax').value.trim(), wRefRaw = $('#f_waterRef').value.trim();
    if (wMinRaw !== '' || wMaxRaw !== '') {
      const wMin = parseFloat(wMinRaw.replace(',', '.')), wMax = parseFloat(wMaxRaw.replace(',', '.')), wRef = parseFloat(wRefRaw.replace(',', '.'));
      if (!isFinite(wMin) || !isFinite(wMax) || wMin > wMax) return showErr('Mètres d\'eau : renseigne le minimum et le maximum (minimum plus petit que maximum).');
      if (!isFinite(wRef)) return showErr('Mètres d\'eau : il faut caler le spot (eau au niveau moyen, ou « Caler les mètres d\'eau »).');
      Object.assign(rules, { waterMin: wMin, waterMax: wMax, waterRef: wRef });
    }
    const spot = { id: D.id || U.uid(), name, lat: c.lat, lon: c.lon, notes: $('#f_notes').value.trim(), linkUrl: link, rules };
    if (D.photos !== null) spot.photos = D.photos;
    const isNew = !D.id;
    const saved = await S.store.saveSpot(spot);
    if (spot.photos) photoCache[saved.id] = spot.photos;
    const i = S.spots.findIndex((s) => s.id === saved.id);
    if (i >= 0) S.spots[i] = saved; else S.spots.push(saved);
    S.selectedId = saved.id;
    S.tab = 'spots';

    A.render();
    const miss = H.spotclass.missing(saved);

      A.dialog.close();

      A.toast('Spot supprimé');

  });

  /* ---------- barre de recherche de la carte ---------- */
  const results = $('#searchResults');
  $('#searchForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const q = $('#searchInput').value.trim();
    results.hidden = true;
    if (!q) return;

    const known = A.searchKnown ? A.searchKnown(q) : [];
    const knownHtml = known.map((k) => '<li><button type="button" data-act="goKnown" data-i="' + k.i + '"><b>' + esc(k.name) + '</b> <span class="fine">spot connu · ' + esc(k.region) + '</span></button></li>').join('');
    try {
      const res = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=fr&q=' + encodeURIComponent(q));
      if (!res.ok) throw new Error('Recherche indisponible');
      const list = await res.json();
      results.innerHTML = knownHtml + (list.length
        ? list.map((r) => '<li><button type="button" data-act="goPlace" data-lat="' + esc(r.lat) + '" data-lon="' + esc(r.lon) + '">' + esc(r.display_name) + '</button></li>').join('')
        : (knownHtml ? '' : '<li class="none">Aucun résultat</li>'));
      results.hidden = false;
    } catch (e) {
      if (knownHtml) { results.innerHTML = knownHtml; results.hidden = false; } else A.toast('Recherche indisponible pour le moment', 'error');

  const spotsOf = (m) => S.mapSpots[m.id] || [];

  A.renderers.maps = () => {
    if (!S.store.social) return A.lockedPanel('Cartes communes');
    let out = '<div class="head"><h2>Cartes communes</h2></div>' +
      '<p class="fine">Une carte commune réunit des spots que plusieurs personnes alimentent. Chacun garde sa propre carte privée à part.</p>' +
      '<form class="inline" data-form="createMap"><label class="sr-only" for="mapName">Nom de la carte</label><input id="mapName" type="text" maxlength="80" placeholder="Nom de la nouvelle carte"><button class="btn btn-primary" type="submit">Créer</button></form>' +
      '<form class="inline" data-form="joinMap"><label class="sr-only" for="mapCode">Code d\'une carte</label><input id="mapCode" type="text" maxlength="20" placeholder="Code reçu d\'un ami" autocapitalize="characters" autocomplete="off"><button class="btn" type="submit">Demander à rejoindre</button></form>';
    const invites = S.maps.filter((m) => m.myStatus === 'invited');
    if (invites.length) {
      out += '<h3>Invitations</h3><ul class="plist">' + invites.map((m) =>
        '<li><span class="pname">' + esc(m.name) + ' <span class="tag">invité par un ami</span></span><span class="pact"><button class="btn btn-small btn-primary" data-act="inviteOk" data-id="' + esc(m.id) + '">Rejoindre</button><button class="btn btn-small" data-act="inviteNo" data-id="' + esc(m.id) + '">Refuser</button></span></li>').join('') + '</ul>';
    }
    const mine = S.maps.filter((m) => m.myStatus !== 'invited');
    out += '<h3>Mes cartes</h3>';
    if (!mine.length) out += '<p class="muted">Aucune carte commune pour l\'instant.</p>';
    mine.forEach((m) => {
      if (m.myStatus === 'requested') {
        out += '<article class="map"><div class="map-main"><span class="spot-name">' + esc(m.name) + '</span><span class="tag">demande envoyée</span></div><div class="actions"><button class="btn btn-small" data-act="leaveMap" data-id="' + esc(m.id) + '">Annuler la demande</button></div></article>';
        return;
      }
      const open = S.openMapId === m.id;
      const members = m.members.filter((x) => x.status === 'member');
      out += '<article class="map' + (open ? ' is-open' : '') + '"><button class="spot-main" data-act="openMap" data-id="' + esc(m.id) + '" aria-expanded="' + open + '"><span class="spot-name">' + esc(m.name) + '</span><span class="spot-coords">' + members.length + ' membre' + (members.length > 1 ? 's' : '') + ' · code ' + esc(m.code) + '</span></button>';
      if (open) {
        out += '<div class="detail"><p class="fine">Membres : ' + members.map((x) => '@' + esc(x.username) + (x.id === (S.me && S.me.id) ? ' (toi)' : '') + (x.username === m.ownerName ? ' (créateur)' : '')).join(', ') + '</p>';
        if (m.isOwner) {
          const reqs = m.members.filter((x) => x.status === 'requested');
          if (reqs.length) out += '<h4>Demandes à valider</h4><ul class="plist">' + reqs.map((x) => '<li><span class="pname">@' + esc(x.username) + '</span><span class="pact"><button class="btn btn-small btn-primary" data-act="reqOk" data-id="' + esc(m.id) + '" data-user="' + esc(x.id) + '">Accepter</button><button class="btn btn-small" data-act="reqNo" data-id="' + esc(m.id) + '" data-user="' + esc(x.id) + '">Refuser</button></span></li>').join('') + '</ul>';
        }
        const inMap = new Set(m.members.map((x) => x.id));
        const invitable = S.friends.friends.filter((x) => !inMap.has(x.id));
        if (invitable.length) out += '<form class="inline" data-form="invite" data-id="' + esc(m.id) + '"><label class="sr-only" for="inv_' + esc(m.id) + '">Inviter un ami</label><select name="friend" id="inv_' + esc(m.id) + '">' + invitable.map((x) => '<option value="' + esc(x.id) + '">@' + esc(x.username) + '</option>').join('') + '</select><button class="btn btn-small" type="submit">Inviter</button></form>';
        if (S.spots.length) out += '<form class="inline" data-form="addMapSpot" data-id="' + esc(m.id) + '"><label class="sr-only" for="ams_' + esc(m.id) + '">Spot à ajouter</label><select name="spot" id="ams_' + esc(m.id) + '">' + S.spots.map((s) => '<option value="' + esc(s.id) + '">' + esc(s.name) + '</option>').join('') + '</select><label class="chk"><input type="checkbox" name="hide" id="hide_' + esc(m.id) + '"> Sans description</label><button class="btn btn-small" type="submit">Ajouter mon spot</button></form>';
        const list = spotsOf(m);
        out += '<h4>Spots de la carte (' + list.length + ')</h4>';
        out += list.length ? '<ul class="plist">' + list.map((x) =>
          '<li><span class="pname">' + esc(x.snapshot.name || 'Spot') + ' <span class="tag">par @' + esc(x.addedBy) + '</span></span><span class="pact"><button class="btn btn-small" data-act="showShared" data-id="' + esc(x.id) + '">Voir</button>' + (x.mine || m.isOwner ? '<button class="btn btn-small" data-act="rmMapSpot" data-id="' + esc(x.id) + '" aria-label="Retirer de la carte">' + A.icon('x') + '</button>' : '') + '</span></li>').join('') + '</ul>' : '<p class="muted">Aucun spot pour l\'instant.</p>';
        out += '<div class="actions">' + (m.isOwner ? '<button class="btn btn-small btn-danger" data-act="delMap" data-id="' + esc(m.id) + '">Supprimer la carte</button>' : '<button class="btn btn-small" data-act="leaveMap" data-id="' + esc(m.id) + '">Quitter la carte</button>') + '</div></div>';
      }
      out += '</article>';
    });
    return out;
  };

  Object.assign(A.actions, {
    async openMap(el) {
      const id = el.dataset.id;
      if (S.openMapId === id) { S.openMapId = null; A.render(); return; }
      S.openMapId = id;
      S.mapSpots[id] = await S.store.listMapSpots(id);
      A.render();
      const pts = S.mapSpots[id].map((x) => ({ lat: finite(x.snapshot.lat), lon: finite(x.snapshot.lon) })).filter((p) => Number.isFinite(p.lat) && Number.isFinite(p.lon));
      if (pts.length) S.mapObj.fitAll(pts);
    },
    async inviteOk(el) { await S.store.respondInvite(el.dataset.id, true); A.toast('Carte rejointe'); await A.refreshSocial(); },
    async inviteNo(el) { await S.store.respondInvite(el.dataset.id, false); await A.refreshSocial(); },
    async reqOk(el) { await S.store.respondRequest(el.dataset.id, el.dataset.user, true); A.toast('Membre accepté'); await A.refreshSocial(); },
    async reqNo(el) { await S.store.respondRequest(el.dataset.id, el.dataset.user, false); await A.refreshSocial(); },
    async leaveMap(el) {
      const m = S.maps.find((x) => x.id === el.dataset.id);
      if (m && m.myStatus === 'member' && !confirm('Quitter la carte « ' + m.name + ' » ?')) return;
      await S.store.removeMember(el.dataset.id, S.me.id);
      if (S.openMapId === el.dataset.id) S.openMapId = null;
      await A.refreshSocial();
    },
    async delMap(el) {
      const m = S.maps.find((x) => x.id === el.dataset.id);
      if (!m || !confirm('Supprimer la carte « ' + m.name + ' » pour tous ses membres ? Cette action est définitive.')) return;
      await S.store.deleteMap(m.id);
      S.openMapId = null;
      await A.refreshSocial();
      A.toast('Carte supprimée');
    },
    async rmMapSpot(el) {
      await S.store.removeMapSpot(el.dataset.id);
      S.mapSpots[S.openMapId] = await S.store.listMapSpots(S.openMapId);
      A.render();
    },
  });

  /* ---------- spot reçu / d'une carte commune : fiche et import ---------- */
  const importSpot = async (p) => {
    const lat = finite(p.lat), lon = finite(p.lon);
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) throw new Error('Coordonnées invalides');
    const spot = { id: U.uid(), name: String(p.name || p.spotName || 'Spot').slice(0, 80), lat, lon, notes: String(p.notes || '').slice(0, 4000), linkUrl: U.safeUrl(p.linkUrl), rules: p.rules && typeof p.rules === 'object' ? p.rules : {} };
    const saved = await S.store.saveSpot(spot);
    S.spots.push(saved);
    A.refreshForecasts(false, saved);
    A.render();
    return saved;
  };

  const sharedInfoHtml = (p, by) => {
    const link = U.safeUrl(p.linkUrl);
    return '<div class="dlg"><h2>' + esc(p.name || p.spotName || 'Spot') + '</h2>' +
      '<p class="fine">' + esc(U.fmtCoords(finite(p.lat), finite(p.lon))) + (by ? ' · partagé par @' + esc(by) : '') + '</p>' +
      (p.notes ? '<p class="notes">' + esc(p.notes).replace(/\n/g, '<br>') + '</p>' : '<p class="muted">' + (p.hiddenDescription ? 'La description est masquée par la personne qui a partagé ce spot.' : 'Pas de description.') + '</p>') +
      (link ? '<div class="links"><a href="' + esc(link) + '" target="_blank" rel="noopener noreferrer">' + A.icon('link') + 'Lien de prévision</a></div>' : '') +
      '<div class="dlg-actions"><button class="btn" data-act="closeDlg">Fermer</button><span class="sp"></span><button class="btn" data-act="viewPoint" data-lat="' + esc(finite(p.lat)) + '" data-lon="' + esc(finite(p.lon)) + '">Voir sur la carte</button><button class="btn btn-primary" id="importBtn">Ajouter à mes spots</button></div></div>';
  };

  A.actions.showShared = (el) => {
    const x = spotsOf({ id: S.openMapId }).find((i) => i.id === el.dataset.id);
    if (!x) return;
    A.dialog.open(sharedInfoHtml(x.snapshot, x.addedBy), () => {
      $('#importBtn').addEventListener('click', async () => { try { await importSpot(x.snapshot); A.dialog.close(); A.toast('Spot ajouté à ta carte'); } catch (e) { A.fail(e); } });
    });
  };
  A.actions.viewPoint = (el) => {
    const lat = parseFloat(el.dataset.lat), lon = parseFloat(el.dataset.lon);
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) { A.toast('Position invalide', 'error'); return; }
    A.dialog.close();
    S.mapObj.flyTo(lat, lon, 14);
  };

  /* ---------- reçu ---------- */
  const seenAsked = {};
  A.renderers.inbox = () => {
    if (!S.store.social) return A.lockedPanel('Spots et sessions reçus');
    let out = '<div class="head"><h2>Reçu</h2></div>';
    if (!S.inbox.length) return out + '<div class="empty"><p>Les spots et les sessions que tes amis te partagent arrivent ici.</p></div>';
    out += S.inbox.map((x) => {
      const p = x.payload;
      let body;
      if (x.kind === 'session') {
        const hour = /^\d{2}:\d{2}$/.test(p.hour || '') ? p.hour.replace(':', 'h') : '';
        body = '<h3 class="in-title">Session à ' + esc(p.spotName || 'un spot') + '</h3><p class="al-data"><b>' + esc(U.fmtDay(String(p.date || '2000-01-01'))) + (hour ? ' vers ' + esc(hour) : '') + '</b> · créneau ' + esc(String(finite(p.from))) + 'h–' + esc(String(finite(p.to))) + 'h · ' + U.num(finite(p.wave)) + ' m à ' + U.num(finite(p.period), 0) + ' s · vent ' + U.num(finite(p.wind), 0) + ' km/h</p>' + (p.message ? '<p class="notes">' + esc(p.message) + '</p>' : '');
      } else {
        body = '<h3 class="in-title">Spot : ' + esc(p.name || 'Spot') + '</h3>' + (p.notes ? '<p class="notes">' + esc(p.notes).replace(/\n/g, '<br>') + '</p>' : '<p class="muted">' + (p.hiddenDescription ? 'Description masquée.' : 'Pas de description.') + '</p>');
      }
      return '<article class="msg' + (x.seen ? '' : ' is-new') + '"><p class="fine">@' + esc(x.from) + ' · ' + ago(x.createdAt) + (x.seen ? '' : ' <span class="tag tag--new">nouveau</span>') + '</p>' + body +
        '<div class="actions"><button class="btn btn-small" data-act="viewPoint" data-lat="' + esc(finite(p.lat)) + '" data-lon="' + esc(finite(p.lon)) + '">Voir sur la carte</button><button class="btn btn-small" data-act="importShare" data-id="' + esc(x.id) + '">Ajouter à mes spots</button><button class="btn btn-small" data-act="delShare" data-id="' + esc(x.id) + '" aria-label="Supprimer ce message">' + A.icon('x') + '</button></div></article>';
    }).join('');
    const unseen = S.inbox.filter((x) => !x.seen && !seenAsked[x.id]).map((x) => x.id);
    if (unseen.length) {
      unseen.forEach((id) => { seenAsked[id] = true; });
      setTimeout(() => { S.store.markSeen(unseen).then(() => { S.inbox.forEach((x) => { if (unseen.indexOf(x.id) !== -1) x.seen = true; }); A.scheduleRender(); }).catch(() => {}); }, 2500);
    }
    return out;
  };

  Object.assign(A.actions, {
    async importShare(el) {
      const x = S.inbox.find((i) => i.id === el.dataset.id);
      if (!x) return;
      await importSpot(x.payload);
      A.toast('Spot ajouté à ta carte');
    },
    async delShare(el) { await S.store.deleteShare(el.dataset.id); S.inbox = S.inbox.filter((i) => i.id !== el.dataset.id); A.render(); },
  });

  /* ---------- formulaires en ligne ---------- */
  document.addEventListener('submit', async (ev) => {
    const form = ev.target.closest('form[data-form]');
    if (!form) return;
    ev.preventDefault();
    const kind = form.dataset.form, val = (n) => (form.elements[n] ? form.elements[n].value : '');
    try {
      if (kind === 'friend') {
        const who = await S.store.requestFriend($('#friendName').value);
        A.toast('Demande envoyée à @' + who);
      } else if (kind === 'createMap') {
        const name = $('#mapName').value.trim();
        if (!name) return A.toast('Donne un nom à la carte', 'error');
        S.openMapId = await S.store.createMap(name);
        S.mapSpots[S.openMapId] = [];
        A.toast('Carte créée');
      } else if (kind === 'joinMap') {
        await S.store.requestJoin($('#mapCode').value);
        A.toast('Demande envoyée. Le créateur de la carte doit l\'accepter.');
      } else if (kind === 'invite') {
        await S.store.inviteToMap(form.dataset.id, val('friend'));
        A.toast('Invitation envoyée');
      } else if (kind === 'addMapSpot') {
        const s = S.spots.find((x) => x.id === val('spot'));
        if (!s) return;
        await S.store.addSpotToMap(form.dataset.id, s, form.elements.hide.checked);
        S.mapSpots[form.dataset.id] = await S.store.listMapSpots(form.dataset.id);
        A.toast('Spot ajouté à la carte commune');
      }
      await A.refreshSocial();
      A.render();
    } catch (e) { A.fail(e); }
  });

  /* ---------- partage : choix des amis ---------- */
  const friendChecks = () =>
    S.friends.friends.length
      ? '<fieldset class="grp"><legend>Avec qui ?</legend><div class="chks">' + S.friends.friends.map((x) => '<label class="chk"><input type="checkbox" name="to" value="' + esc(x.id) + '"> @' + esc(x.username) + '</label>').join('') + '</div></fieldset>'
      : '<p class="muted">Tu n\'as pas encore d\'ami. Ajoute-en depuis l\'onglet Amis.</p>';
  const picked = () => Array.from(document.querySelectorAll('#shareForm input[name="to"]:checked')).map((i) => i.value);

  A.actions.shareSpot = (el) => {
    const s = S.spots.find((x) => x.id === el.dataset.id);
    if (!s) return;
    A.dialog.open(
      '<form class="dlg" id="shareForm"><h2>Partager « ' + esc(s.name) + ' »</h2>' + friendChecks() +
      '<label class="chk"><input id="s_hide" type="checkbox"> Masquer la description (le nom, la position et le lien sont partagés)</label>' +
      '<p class="fine">Les photos ne sont pas envoyées. Ton ami reçoit une copie qu\'il peut ajouter à sa propre carte.</p>' +
      '<p class="form-err" id="shareErr" role="alert" hidden></p>' +
      '<div class="dlg-actions"><button type="button" class="btn" data-act="closeDlg">Annuler</button><span class="sp"></span><button type="submit" class="btn btn-primary">Envoyer</button></div></form>',
      (d) => {
        $('#shareForm', d).addEventListener('submit', async (e) => {
          e.preventDefault();
          const to = picked();
          if (!to.length) { const er = $('#shareErr'); er.textContent = 'Choisis au moins un ami.'; er.hidden = false; return; }
          const hide = $('#s_hide').checked;
          try {
            await S.store.sendShares(to, 'spot', { name: s.name, lat: s.lat, lon: s.lon, notes: hide ? '' : s.notes, linkUrl: s.linkUrl || '', rules: s.rules || {}, hiddenDescription: hide });
            A.dialog.close(); A.toast('Spot partagé');
          } catch (ex) { const er = $('#shareErr'); er.textContent = ex.message; er.hidden = false; }
        });
      });
  };

  A.actions.shareSession = (el) => {
    const s = S.spots.find((x) => x.id === el.dataset.id);
    const f = s && S.fc[s.id];
    const day = f && f.days && f.days.find((d) => d.date === el.dataset.date);
    if (!day || !day.window) return;
    const hh = String(day.window.from).padStart(2, '0') + ':00';
    A.dialog.open(
      '<form class="dlg" id="shareForm"><h2>Partager la session</h2>' +
      '<p class="al-data"><b>' + esc(s.name) + '</b> · ' + esc(U.fmtDay(day.date)) + ' · ' + esc(F.windowText(day.window)) + '</p>' + friendChecks() +
      '<label class="fld">Heure à laquelle tu y vas<input id="s_time" type="time" value="' + hh + '"></label>' +
      '<label class="fld">Message (facultatif)<textarea id="s_msg" rows="2" maxlength="300" placeholder="On se retrouve au parking ?"></textarea></label>' +
      '<p class="form-err" id="shareErr" role="alert" hidden></p>' +
      '<div class="dlg-actions"><button type="button" class="btn" data-act="closeDlg">Annuler</button><span class="sp"></span><button type="submit" class="btn btn-primary">Envoyer</button></div></form>',
      (d) => {
        $('#shareForm', d).addEventListener('submit', async (e) => {
          e.preventDefault();
          const to = picked();
          if (!to.length) { const er = $('#shareErr'); er.textContent = 'Choisis au moins un ami.'; er.hidden = false; return; }
          try {
            await S.store.sendShares(to, 'session', {
              spotName: s.name, lat: s.lat, lon: s.lon, linkUrl: s.linkUrl || '', date: day.date, from: day.window.from, to: day.window.to,
              wave: day.stats.wave, period: day.stats.period, wind: day.stats.wind, hour: $('#s_time').value, message: $('#s_msg').value.trim(),
            });
            A.dialog.close(); A.toast('Session partagée');
          } catch (ex) { const er = $('#shareErr'); er.textContent = ex.message; er.hidden = false; }
        });
      });
  };

  A.actions.toMap = (el) => {
    const s = S.spots.find((x) => x.id === el.dataset.id);
    const maps = S.maps.filter((m) => m.myStatus === 'member');
    if (!s) return;
    if (!maps.length) { A.toast("Crée ou rejoins d'abord une carte commune (onglet Cartes).", 'error'); return; }
    A.dialog.open(
      '<form class="dlg" id="shareForm"><h2>Ajouter « ' + esc(s.name) + ' » à une carte commune</h2>' +
      '<label class="fld">Carte<select id="m_sel">' + maps.map((m) => '<option value="' + esc(m.id) + '">' + esc(m.name) + '</option>').join('') + '</select></label>' +
      '<label class="chk"><input id="s_hide" type="checkbox"> Masquer la description</label>' +
      '<p class="fine">Tous les membres de la carte verront ce spot. Ton spot personnel reste privé.</p>' +
      '<p class="form-err" id="shareErr" role="alert" hidden></p>' +
      '<div class="dlg-actions"><button type="button" class="btn" data-act="closeDlg">Annuler</button><span class="sp"></span><button type="submit" class="btn btn-primary">Ajouter</button></div></form>',
      (d) => {
        $('#shareForm', d).addEventListener('submit', async (e) => {
          e.preventDefault();
          try {
            const id = $('#m_sel').value;
            await S.store.addSpotToMap(id, s, $('#s_hide').checked);
            if (S.openMapId === id) S.mapSpots[id] = await S.store.listMapSpots(id);
            A.dialog.close(); A.toast('Spot ajouté à la carte commune'); A.render();
          } catch (ex) { const er = $('#shareErr'); er.textContent = ex.message; er.hidden = false; }
        });
      });
  };
})();

/* ===== app-help ===== */

      '<p>Houle est ton <b>carnet de spots de surf</b> : tu places tes spots sur la carte, et l\'appli te prévient quand la houle et le vent sont bons pour <b>toi</b>.</p>' +
