        (S.store.social ? '<button class="btn btn-small" data-act="shareSession" data-id="' + esc(u.spot.id) + '" data-date="' + esc(u.day.date) + '">' + A.icon('share') + 'Partager la session</button>' : '') + '</li>').join('') + '</ul>';
    } else {
      out += '<p class="muted">' + (loading ? 'Calcul en cours…' : S.alerts.length ? 'Pas d\'autre session sur les 8 prochains jours.' : 'Aucune session ne correspond à tes critères sur les 8 prochains jours. Tu peux élargir les seuils dans la fiche de chaque spot.') + '</p>';
    }
    out += '<p class="fine">Les prévisions à 7 jours sont moins fiables que celles du jour même. Les alertes se calculent quand l\'appli est ouverte.</p>';
    return out;
  };

  /* ---------- actions ---------- */
  Object.assign(A.actions, {
    add() { if (S.adding) { A.stopAdd(); } else { A.startAdd(); A.toast('Touche la carte pour placer le spot'); } },
    select(el) { const id = el.dataset.id; if (S.selectedId === id) { S.selectedId = null; A.render(); } else A.selectSpot(id, true); },
    edit(el) { A.openSpotDialog(S.spots.find((s) => s.id === el.dataset.id)); },
    async retry(el) { const s = S.spots.find((x) => x.id === el.dataset.id); if (s) { await A.refreshForecasts(true, s); } },
    async refreshAll() { A.toast('Mise à jour des prévisions…'); await A.refreshForecasts(true); A.toast('Prévisions à jour'); },
    async notif() { const r = await Notification.requestPermission(); A.toast(r === 'granted' ? 'Notifications activées' : 'Notifications non activées'); A.render(); },
    async export() {
      const data = await S.store.exportAll();
      const url = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
      const a = document.createElement('a');
      a.href = url; a.download = 'houle-sauvegarde-' + U.ymd(new Date()) + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      A.toast('Sauvegarde exportée');
    },
    import() { $('#importFile').click(); },
  });

  $('#importFile').addEventListener('change', async (ev) => {
    const file = ev.target.files[0];
    ev.target.value = '';
    if (!file) return;
    try {
      const n = await S.store.importAll(JSON.parse(await file.text()));
      S.spots = await S.store.listSpots();
      A.render();
      if (S.mapObj.ready) S.mapObj.fitAll(S.spots);
      A.refreshForecasts(false);
      A.toast(n + ' spot(s) importé(s)');
    } catch (e) { A.fail(e.message === 'Fichier non reconnu' ? e : new Error('Fichier non reconnu')); }
  });

  /* ---------- fiche d'un spot (création / modification) ---------- */
  const num = (v, d) => { const n = parseFloat(String(v).replace(',', '.')); return Number.isFinite(n) ? n : d; };
  let D = null; // état de la fiche ouverte

  A.onTempMove = (lat, lon) => {
    if (!D) return;
    D.lat = lat; D.lon = lon;
    const i = $('#f_coords');
    if (i) i.value = U.fmtCoords(lat, lon);
  };

  const photosHtml = () => {
    if (D.photos === null) return '<span class="fine">Chargement des photos…</span>';
    return D.photos.map((p, i) => (U.safeImg(p) ? '<span class="thumb"><img src="' + U.safeImg(p) + '" alt="Photo ' + (i + 1) + '"><button type="button" data-act="rmPhoto" data-i="' + i + '" aria-label="Retirer la photo ' + (i + 1) + '">' + A.icon('x') + '</button></span>' : '')).join('');
  };

  A.openSpotDialog = (spot, coords) => {
    const isNew = !spot;
    const R = F.withDefaults(spot ? spot.rules : (coords && coords.rules) || null);
    D = { id: spot ? spot.id : null, lat: spot ? spot.lat : coords.lat, lon: spot ? spot.lon : coords.lon, photos: [] };
    if (spot && spot.photoCount) {
      D.photos = photoCache[spot.id] || null;
      if (D.photos === null) S.store.getPhotos(spot.id).then((p) => { photoCache[spot.id] = p; if (D && D.id === spot.id) { D.photos = p.slice(); $('#photoList').innerHTML = photosHtml(); } }).catch(() => { if (D) { D.photos = []; $('#photoList').innerHTML = photosHtml(); } });
      else D.photos = D.photos.slice();
    }
    const lead = (n, label) => '<label class="chk"><input type="checkbox" name="lead" value="' + n + '"' + (R.leads.indexOf(n) !== -1 ? ' checked' : '') + '> ' + label + '</label>';
    const html =
      '<form class="dlg" id="spotForm" novalidate>' +
      '<h2>' + (isNew ? 'Nouveau spot' : 'Modifier le spot') + '</h2>' +
      '<label class="fld">Nom<input id="f_name" type="text" maxlength="80"' + (isNew ? ' autofocus' : '') + ' value="' + esc(spot ? spot.name : (coords && coords.name) || '') + '" placeholder="Ex. La Gravière" autocomplete="off" required></label>' +
      '<label class="fld">Coordonnées GPS<input id="f_coords" type="text" inputmode="text" value="' + esc(U.fmtCoords(D.lat, D.lon)) + '" autocomplete="off"><small>Déplace le repère sur la carte, ou colle ici « latitude, longitude ».</small></label>' +
      '<div class="row"><button type="button" class="btn btn-small" data-act="useMyPos">' + A.icon('locate') + 'Ma position</button></div>' +
      '<label class="fld">Notes<textarea id="f_notes" rows="3" maxlength="4000" placeholder="Accès, type de vague, marée, dangers…">' + esc(spot ? spot.notes : (coords && coords.notes) || '') + '</textarea></label>' +
      '<div class="fld"><span class="lbl">Photos</span><div class="thumbs" id="photoList">' + photosHtml() + '</div><input id="f_photos" type="file" accept="image/*" multiple><small>Réduites automatiquement. 6 photos maximum.</small></div>' +
      '<label class="fld">Lien de prévision (Windguru, Windy, Ifremer…)<input id="f_link" type="url" inputmode="url" value="' + esc(spot ? spot.linkUrl : '') + '" placeholder="https://"></label>' +
      '<label class="fld">Ma discipline sur ce spot<select id="f_disc"><option value="s"' + (R.disc === 's' || !R.disc ? ' selected' : '') + '>Surf</option><option value="b"' + (R.disc === 'b' ? ' selected' : '') + '>Bodyboard</option><option value="l"' + (R.disc === 'l' ? ' selected' : '') + '>Longboard</option></select></label>' +
      '<fieldset class="grp"><legend>Quand ça marche pour toi</legend>' +
      '<div class="grid2"><label class="fld">Houle min (m)<input id="f_waveMin" type="number" step="0.1" min="0" value="' + R.waveMin + '"></label><label class="fld">Houle max (m)<input id="f_waveMax" type="number" step="0.1" min="0" value="' + R.waveMax + '"></label>' +
      '<label class="fld">Période min (s)<input id="f_period" type="number" step="1" min="0" value="' + R.periodMin + '"></label><label class="fld">Vent max (km/h)<input id="f_wind" type="number" step="1" min="0" value="' + R.windMax + '"></label>' +
      '<label class="fld">Surf à partir de (h)<input id="f_hFrom" type="number" step="1" min="0" max="23" value="' + R.hourFrom + '"></label><label class="fld">jusqu\'à (h)<input id="f_hTo" type="number" step="1" min="1" max="24" value="' + R.hourTo + '"></label></div>' +
      '<label class="chk"><input id="f_dirOn" type="checkbox"' + (R.dirOn ? ' checked' : '') + '> Limiter la direction du vent</label>' +
      '<div class="grid2" id="dirRow"><label class="fld">Vent venant de (°)<input id="f_dirFrom" type="number" step="5" min="0" max="360" value="' + R.dirFrom + '"></label><label class="fld">à (°)<input id="f_dirTo" type="number" step="5" min="0" max="360" value="' + R.dirTo + '"></label></div>' +
      '<small>0° = nord, 90° = est, 180° = sud, 270° = ouest. Le vent de terre (offshore) vient de l\'intérieur des terres.</small>' +
      '<label class="chk"><input id="f_swOn" type="checkbox"' + (R.swellOn ? ' checked' : '') + '> Limiter la direction de la houle</label>' +
      '<div class="grid2" id="swRow"><label class="fld">Houle venant de (°)<input id="f_swFrom" type="number" step="5" min="0" max="360" value="' + R.swellFrom + '"></label><label class="fld">à (°)<input id="f_swTo" type="number" step="5" min="0" max="360" value="' + R.swellTo + '"></label></div>' +
      '<small>Direction d\'où arrive la houle : ouest = 270°, nord-ouest = 315°. Les jours où elle arrive d\'ailleurs sont écartés.</small></fieldset>' +
      '<fieldset class="grp"><legend>Me prévenir</legend><div class="chks">' + lead(7, '7 jours avant') + lead(3, '3 jours avant') + lead(1, 'la veille') + lead(0, 'le matin même') + '</div></fieldset>' +
      '<p class="form-err" id="spotErr" role="alert" hidden></p>' +
      '<div class="dlg-actions">' + (isNew ? '' : '<button type="button" class="btn btn-danger" data-act="delSpot">Supprimer</button>') + '<span class="sp"></span><button type="button" class="btn" data-act="closeDlg">Annuler</button><button type="submit" class="btn btn-primary">Enregistrer</button></div></form>';

    A.dialog.open(html, (d) => {
      const dirRow = $('#dirRow', d), dirOn = $('#f_dirOn', d);
      const syncDir = () => {
        dirRow.style.opacity = dirOn.checked ? '1' : '.45';
        dirRow.querySelectorAll('input').forEach((i) => { i.disabled = !dirOn.checked; });
      };
      dirOn.addEventListener('change', syncDir);
      syncDir();
      const swRow = $('#swRow', d), swOn = $('#f_swOn', d);
      const syncSw = () => {
        swRow.style.opacity = swOn.checked ? '1' : '.45';
        swRow.querySelectorAll('input').forEach((i) => { i.disabled = !swOn.checked; });
      };
      swOn.addEventListener('change', syncSw);
      syncSw();
      $('#f_coords', d).addEventListener('input', (e) => {
        const c = U.parseCoords(e.target.value);
        e.target.classList.toggle('is-bad', !c && e.target.value.trim() !== '');
        if (c) { D.lat = c.lat; D.lon = c.lon; S.mapObj.setTempPin(c.lat, c.lon); }
      });
      $('#f_photos', d).addEventListener('change', async (e) => {
        const files = Array.from(e.target.files); e.target.value = '';
        if (D.photos === null) return;
        for (const f of files) {
          if (D.photos.length >= 6) { A.toast('6 photos maximum'); break; }
          try { D.photos.push(await U.compressImage(f)); } catch (err) { A.toast('Photo illisible', 'error'); }
        }
        $('#photoList').innerHTML = photosHtml();
      });
      $('#spotForm', d).addEventListener('submit', (e) => { e.preventDefault(); saveSpot().catch((err) => showErr(err.message)); });
    }, { onclose: () => { D = null; if (S.mapObj) S.mapObj.setTempPin(null); A.stopAdd(); } });

    S.mapObj.setTempPin(D.lat, D.lon);
    if (S.mapObj.ready) S.mapObj.flyTo(D.lat, D.lon, 14);
  };

  const showErr = (m) => { const e = $('#spotErr'); if (e) { e.textContent = m; e.hidden = false; } };

  async function saveSpot() {
    const name = $('#f_name').value.trim();
    if (!name) return showErr('Donne un nom au spot.');
    const c = U.parseCoords($('#f_coords').value);
    if (!c) return showErr('Coordonnées non reconnues. Exemple : 43.48123, -1.55678');
    const linkRaw = $('#f_link').value.trim();
    const link = linkRaw ? U.safeUrl(linkRaw) : '';
    if (linkRaw && !link) return showErr('Le lien doit commencer par https://');
    const waveMin = num($('#f_waveMin').value, 0), waveMax = num($('#f_waveMax').value, 99);
    if (waveMin > waveMax) return showErr('La houle minimale doit être inférieure à la houle maximale.');
    const hourFrom = Math.round(num($('#f_hFrom').value, 7)), hourTo = Math.round(num($('#f_hTo').value, 20));
    if (hourFrom >= hourTo) return showErr("L'heure de début doit être avant l'heure de fin.");
    const rules = {
      waveMin, waveMax, periodMin: num($('#f_period').value, 0), windMax: num($('#f_wind').value, 99), hourFrom, hourTo, minHours: 2,
      dirOn: $('#f_dirOn').checked, dirFrom: num($('#f_dirFrom').value, 0), dirTo: num($('#f_dirTo').value, 360),
      swellOn: $('#f_swOn').checked, swellFrom: num($('#f_swFrom').value, 0), swellTo: num($('#f_swTo').value, 360), disc: $('#f_disc').value,
      leads: Array.from(document.querySelectorAll('input[name="lead"]:checked')).map((i) => parseInt(i.value, 10)),
    };
    const spot = { id: D.id || U.uid(), name, lat: c.lat, lon: c.lon, notes: $('#f_notes').value.trim(), linkUrl: link, rules };
    if (D.photos !== null) spot.photos = D.photos;
    const isNew = !D.id;
    const saved = await S.store.saveSpot(spot);
    if (spot.photos) photoCache[saved.id] = spot.photos;
    const i = S.spots.findIndex((s) => s.id === saved.id);
    if (i >= 0) S.spots[i] = saved; else S.spots.push(saved);
    S.selectedId = saved.id;
    S.tab = 'spots';
    A.dialog.close();
    A.render();
    A.toast(isNew ? 'Spot ajouté' : 'Spot enregistré');
    A.refreshForecasts(false, saved);
  }

  Object.assign(A.actions, {
    closeDlg() { A.dialog.close(); },
    rmPhoto(el) { if (D && D.photos) { D.photos.splice(parseInt(el.dataset.i, 10), 1); $('#photoList').innerHTML = photosHtml(); } },
    async useMyPos() {
      const p = await S.mapObj.locate();
      D.lat = p.lat; D.lon = p.lon;
      $('#f_coords').value = U.fmtCoords(p.lat, p.lon);
      S.mapObj.setTempPin(p.lat, p.lon); S.mapObj.flyTo(p.lat, p.lon, 16);
    },
    async delSpot() {
      const s = S.spots.find((x) => x.id === D.id);
      if (!s || !confirm('Supprimer « ' + s.name + ' » ? Cette action est définitive.')) return;
      await S.store.deleteSpot(s.id);
      S.spots = S.spots.filter((x) => x.id !== s.id);
      delete S.fc[s.id]; delete photoCache[s.id];
      if (S.selectedId === s.id) S.selectedId = null;
      A.dialog.close();
      A.recompute();
      A.toast('Spot supprimé');
    },
  });

  /* ---------- barre de recherche de la carte ---------- */
  const results = $('#searchResults');
  $('#searchForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const q = $('#searchInput').value.trim();
    results.hidden = true;
    if (!q) return;
    const c = U.parseCoords(q);
    if (c) { S.mapObj.flyTo(c.lat, c.lon, 15); A.openSpotDialog(null, c); return; }
    const known = A.searchKnown ? A.searchKnown(q) : [];
    const knownHtml = known.map((k) => '<li><button type="button" data-act="goKnown" data-i="' + k.i + '"><b>' + esc(k.name) + '</b> <span class="fine">spot connu · ' + esc(k.region) + '</span></button></li>').join('');
    try {
      const res = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=fr&q=' + encodeURIComponent(q));
      if (!res.ok) throw new Error('Recherche indisponible');
      const list = await res.json();
      results.innerHTML = knownHtml + (list.length
        ? list.map((r) => '<li><button type="button" data-act="goPlace" data-lat="' + esc(r.lat) + '" data-lon="' + esc(r.lon) + '">' + esc(r.display_name) + '</button></li>').join('')
        : (knownHtml ? '' : '<li class="none">Aucun résultat</li>'));
      results.hidden = false;
    } catch (e) {
      if (knownHtml) { results.innerHTML = knownHtml; results.hidden = false; } else A.toast('Recherche indisponible pour le moment', 'error');
    }
  });
  A.actions.goPlace = (el) => {
    results.hidden = true;
    S.mapObj.flyTo(parseFloat(el.dataset.lat), parseFloat(el.dataset.lon), 13);
  };
  $('#btnLocate').addEventListener('click', () => {
    S.mapObj.locate().then((p) => S.mapObj.flyTo(p.lat, p.lon, 14)).catch(A.fail);
  });
  $('#btnSat').addEventListener('click', (ev) => {
    const on = S.mapObj.toggleSatellite();
    ev.currentTarget.setAttribute('aria-pressed', String(!!on));
  });
  $('#btnCancelAdd').addEventListener('click', () => A.stopAdd());
  $('#dlg').addEventListener('cancel', (ev) => { if ($('#dlg').dataset.locked) ev.preventDefault(); });
})();

/* ===== app-social ===== */
/* Houle - compte, amis, partages, cartes communes (mode serveur) */
(function () {
  const H = (globalThis.Houle = globalThis.Houle || {});
  const A = H.app, U = H.util, F = H.forecast, S = A.S, $ = A.$;
  const esc = U.esc;
  const finite = (x) => (typeof x === 'number' && Number.isFinite(x) ? x : parseFloat(x));

  const ago = (ms) => {
    const m = Math.max(0, Math.round((Date.now() - ms) / 60000));
    if (m < 2) return "à l'instant";
    if (m < 60) return 'il y a ' + m + ' min';
    if (m < 1440) return 'il y a ' + Math.round(m / 60) + ' h';
    return 'il y a ' + Math.round(m / 1440) + ' j';
  };

  /* ---------- connexion ---------- */
  let authMode = 'in';
  const authHtml = () =>
    '<form class="dlg" id="authForm" novalidate>' +
    '<h2>Bienvenue sur Houle</h2>' +
    '<p class="lead">Un compte garde tes spots en sécurité et te permet de les partager avec tes amis.</p>' +
    '<div class="seg" role="group" aria-label="Connexion ou création de compte">' +
    '<button type="button" data-act="authMode" data-mode="in" aria-pressed="' + (authMode === 'in') + '">Connexion</button>' +
    '<button type="button" data-act="authMode" data-mode="up" aria-pressed="' + (authMode === 'up') + '">Créer un compte</button></div>' +
    '<label class="fld">Adresse e-mail<input id="a_email" type="email" autocomplete="email" inputmode="email" required></label>' +
    '<label class="fld">Mot de passe<input id="a_pw" type="password" autocomplete="' + (authMode === 'in' ? 'current-password' : 'new-password') + '" required>' +
    (authMode === 'up' ? '<small>8 caractères minimum. Choisis un mot de passe que tu n\'utilises nulle part ailleurs.</small>' : '') + '</label>' +
    '<p class="form-err" id="authErr" role="alert" hidden></p><p class="form-ok" id="authOk" role="status" hidden></p>' +
    '<div class="dlg-actions"><span class="sp"></span><button type="submit" class="btn btn-primary">' + (authMode === 'in' ? 'Se connecter' : 'Créer mon compte') + '</button></div></form>';

  A.openAuth = () => {
    A.dialog.open(authHtml(), (d) => {
      $('#authForm', d).addEventListener('submit', async (e) => {
        e.preventDefault();
        const err = $('#authErr'), ok = $('#authOk');
        err.hidden = true; ok.hidden = true;
        const email = $('#a_email').value.trim(), pw = $('#a_pw').value;
        if (!email || !pw) { err.textContent = 'Saisis ton e-mail et ton mot de passe.'; err.hidden = false; return; }
        if (authMode === 'up' && pw.length < 8) { err.textContent = 'Le mot de passe doit faire au moins 8 caractères.'; err.hidden = false; return; }
        try {
          const r = authMode === 'in' ? await S.store.signIn(email, pw) : await S.store.signUp(email, pw);
          if (r.needsConfirm) { ok.textContent = 'Compte créé. Ouvre le mail de confirmation que tu viens de recevoir, puis reviens te connecter ici.'; ok.hidden = false; return; }
          if (!r.user.username) A.openUsername(); else { A.dialog.close(); await A.afterLogin(); }
        } catch (ex) { err.textContent = ex.message; err.hidden = false; }
      });
    }, { locked: true });
  };

  A.openUsername = () => {
    A.dialog.open(
      '<form class="dlg" id="nameForm" novalidate><h2>Choisis ton pseudo</h2>' +
      '<p class="lead">Tes amis t\'ajouteront avec ce pseudo. Lettres minuscules, chiffres et _ (3 à 20 caractères).</p>' +
      '<label class="fld">Pseudo<input id="u_name" type="text" autocomplete="username" autocapitalize="none" maxlength="20" required></label>' +
      '<p class="form-err" id="nameErr" role="alert" hidden></p>' +
      '<div class="dlg-actions"><button type="button" class="btn" data-act="logout">Se déconnecter</button><span class="sp"></span><button type="submit" class="btn btn-primary">Continuer</button></div></form>',
      (d) => {
        $('#nameForm', d).addEventListener('submit', async (e) => {
          e.preventDefault();
          try { await S.store.createProfile($('#u_name').value); A.dialog.close(); await A.afterLogin(); } catch (ex) { const er = $('#nameErr'); er.textContent = ex.message; er.hidden = false; }
        });
      }, { locked: true });
  };

  A.openAuthError = (msg) => {
    A.dialog.open(
      '<div class="dlg"><h2>Connexion au serveur impossible</h2><p class="lead">' + esc(msg) + '</p>' +
      '<p class="fine">Vérifie ta connexion internet et les deux lignes de réglage du serveur au début du fichier.</p>' +
      '<div class="dlg-actions"><button class="btn" data-act="useLocal">Utiliser sans compte</button><span class="sp"></span><button class="btn btn-primary" data-act="reload">Réessayer</button></div></div>',
      null, { locked: true });
  };

  Object.assign(A.actions, {
    authMode(el) {
      authMode = el.dataset.mode;
      const email = $('#a_email') ? $('#a_email').value : '';
      A.openAuth();
      $('#a_email').value = email;
    },
    reload() { location.reload(); },
    useLocal() { return A.useLocalMode(); },
    async logout() {
      await S.store.signOut();
      S.me = null; S.spots = []; S.fc = {}; S.alerts = []; S.upcoming = []; S.selectedId = null;
      S.friends = { friends: [], incoming: [], outgoing: [] }; S.inbox = []; S.maps = []; S.openMapId = null; S.mapSpots = {}; S.tab = 'spots'; S.socialSig = '';
      A.render();
      A.openAuth();
    },
  });

  /* ---------- amis ---------- */
  A.renderers.friends = () => {
    if (!S.store.social) return A.lockedPanel('Amis');
    const f = S.friends;
    let out = '<div class="head"><h2>Amis<span class="count">' + f.friends.length + '</span></h2></div>';
    if (S.me) out += '<p class="fine">Ton pseudo : <b>@' + esc(S.me.username) + '</b>. Donne-le à tes amis pour qu\'ils t\'ajoutent.</p>';
    out += '<form class="inline" data-form="friend"><label class="sr-only" for="friendName">Pseudo de ton ami</label><input id="friendName" type="text" placeholder="Pseudo de ton ami" autocapitalize="none" autocomplete="off"><button class="btn btn-primary" type="submit">Envoyer la demande</button></form>';
    if (f.incoming.length) {
      out += '<h3>Demandes reçues</h3><ul class="plist">' + f.incoming.map((x) =>
        '<li><span class="pname">@' + esc(x.username) + '</span><span class="pact"><button class="btn btn-small btn-primary" data-act="friendOk" data-id="' + esc(x.friendshipId) + '">Accepter</button><button class="btn btn-small" data-act="friendNo" data-id="' + esc(x.friendshipId) + '">Refuser</button></span></li>').join('') + '</ul>';
    }
    if (f.outgoing.length) {
      out += '<h3>Demandes envoyées</h3><ul class="plist">' + f.outgoing.map((x) =>
        '<li><span class="pname">@' + esc(x.username) + ' <span class="tag">en attente</span></span><span class="pact"><button class="btn btn-small" data-act="friendNo" data-id="' + esc(x.friendshipId) + '">Annuler</button></span></li>').join('') + '</ul>';
    }
    out += '<h3>Mes amis</h3>';
    out += f.friends.length
      ? '<ul class="plist">' + f.friends.map((x) => '<li><span class="pname">@' + esc(x.username) + '</span><span class="pact"><button class="btn btn-small" data-act="friendDel" data-id="' + esc(x.friendshipId) + '" data-name="' + esc(x.username) + '">Retirer</button></span></li>').join('') + '</ul>'
      : '<p class="muted">Pas encore d\'ami. Envoie une demande avec son pseudo : il doit l\'accepter avant que vous puissiez partager quoi que ce soit.</p>';
    return out;
  };

  Object.assign(A.actions, {
    async friendOk(el) { await S.store.respondFriend(el.dataset.id, true); A.toast('Ami ajouté'); await A.refreshSocial(); },
    async friendNo(el) { await S.store.respondFriend(el.dataset.id, false); await A.refreshSocial(); },
    async friendDel(el) {
      if (!confirm('Retirer @' + el.dataset.name + ' de tes amis ?')) return;
      await S.store.removeFriend(el.dataset.id); await A.refreshSocial();
    },
  });

  /* ---------- cartes communes ---------- */
  const spotsOf = (m) => S.mapSpots[m.id] || [];

  A.renderers.maps = () => {
    if (!S.store.social) return A.lockedPanel('Cartes communes');
    let out = '<div class="head"><h2>Cartes communes</h2></div>' +
      '<p class="fine">Une carte commune réunit des spots que plusieurs personnes alimentent. Chacun garde sa propre carte privée à part.</p>' +
      '<form class="inline" data-form="createMap"><label class="sr-only" for="mapName">Nom de la carte</label><input id="mapName" type="text" maxlength="80" placeholder="Nom de la nouvelle carte"><button class="btn btn-primary" type="submit">Créer</button></form>' +
      '<form class="inline" data-form="joinMap"><label class="sr-only" for="mapCode">Code d\'une carte</label><input id="mapCode" type="text" maxlength="20" placeholder="Code reçu d\'un ami" autocapitalize="characters" autocomplete="off"><button class="btn" type="submit">Demander à rejoindre</button></form>';
    const invites = S.maps.filter((m) => m.myStatus === 'invited');
    if (invites.length) {
      out += '<h3>Invitations</h3><ul class="plist">' + invites.map((m) =>
        '<li><span class="pname">' + esc(m.name) + ' <span class="tag">invité par un ami</span></span><span class="pact"><button class="btn btn-small btn-primary" data-act="inviteOk" data-id="' + esc(m.id) + '">Rejoindre</button><button class="btn btn-small" data-act="inviteNo" data-id="' + esc(m.id) + '">Refuser</button></span></li>').join('') + '</ul>';
    }
    const mine = S.maps.filter((m) => m.myStatus !== 'invited');
    out += '<h3>Mes cartes</h3>';
    if (!mine.length) out += '<p class="muted">Aucune carte commune pour l\'instant.</p>';
    mine.forEach((m) => {
      if (m.myStatus === 'requested') {
        out += '<article class="map"><div class="map-main"><span class="spot-name">' + esc(m.name) + '</span><span class="tag">demande envoyée</span></div><div class="actions"><button class="btn btn-small" data-act="leaveMap" data-id="' + esc(m.id) + '">Annuler la demande</button></div></article>';
        return;
      }
      const open = S.openMapId === m.id;
      const members = m.members.filter((x) => x.status === 'member');
      out += '<article class="map' + (open ? ' is-open' : '') + '"><button class="spot-main" data-act="openMap" data-id="' + esc(m.id) + '" aria-expanded="' + open + '"><span class="spot-name">' + esc(m.name) + '</span><span class="spot-coords">' + members.length + ' membre' + (members.length > 1 ? 's' : '') + ' · code ' + esc(m.code) + '</span></button>';
      if (open) {
        out += '<div class="detail"><p class="fine">Membres : ' + members.map((x) => '@' + esc(x.username) + (x.id === (S.me && S.me.id) ? ' (toi)' : '') + (x.username === m.ownerName ? ' (créateur)' : '')).join(', ') + '</p>';
        if (m.isOwner) {
          const reqs = m.members.filter((x) => x.status === 'requested');
          if (reqs.length) out += '<h4>Demandes à valider</h4><ul class="plist">' + reqs.map((x) => '<li><span class="pname">@' + esc(x.username) + '</span><span class="pact"><button class="btn btn-small btn-primary" data-act="reqOk" data-id="' + esc(m.id) + '" data-user="' + esc(x.id) + '">Accepter</button><button class="btn btn-small" data-act="reqNo" data-id="' + esc(m.id) + '" data-user="' + esc(x.id) + '">Refuser</button></span></li>').join('') + '</ul>';
        }
        const inMap = new Set(m.members.map((x) => x.id));
        const invitable = S.friends.friends.filter((x) => !inMap.has(x.id));
        if (invitable.length) out += '<form class="inline" data-form="invite" data-id="' + esc(m.id) + '"><label class="sr-only" for="inv_' + esc(m.id) + '">Inviter un ami</label><select name="friend" id="inv_' + esc(m.id) + '">' + invitable.map((x) => '<option value="' + esc(x.id) + '">@' + esc(x.username) + '</option>').join('') + '</select><button class="btn btn-small" type="submit">Inviter</button></form>';
        if (S.spots.length) out += '<form class="inline" data-form="addMapSpot" data-id="' + esc(m.id) + '"><label class="sr-only" for="ams_' + esc(m.id) + '">Spot à ajouter</label><select name="spot" id="ams_' + esc(m.id) + '">' + S.spots.map((s) => '<option value="' + esc(s.id) + '">' + esc(s.name) + '</option>').join('') + '</select><label class="chk"><input type="checkbox" name="hide" id="hide_' + esc(m.id) + '"> Sans description</label><button class="btn btn-small" type="submit">Ajouter mon spot</button></form>';
        const list = spotsOf(m);
        out += '<h4>Spots de la carte (' + list.length + ')</h4>';
        out += list.length ? '<ul class="plist">' + list.map((x) =>
          '<li><span class="pname">' + esc(x.snapshot.name || 'Spot') + ' <span class="tag">par @' + esc(x.addedBy) + '</span></span><span class="pact"><button class="btn btn-small" data-act="showShared" data-id="' + esc(x.id) + '">Voir</button>' + (x.mine || m.isOwner ? '<button class="btn btn-small" data-act="rmMapSpot" data-id="' + esc(x.id) + '" aria-label="Retirer de la carte">' + A.icon('x') + '</button>' : '') + '</span></li>').join('') + '</ul>' : '<p class="muted">Aucun spot pour l\'instant.</p>';
        out += '<div class="actions">' + (m.isOwner ? '<button class="btn btn-small btn-danger" data-act="delMap" data-id="' + esc(m.id) + '">Supprimer la carte</button>' : '<button class="btn btn-small" data-act="leaveMap" data-id="' + esc(m.id) + '">Quitter la carte</button>') + '</div></div>';
      }
      out += '</article>';
    });
    return out;
  };

  Object.assign(A.actions, {
    async openMap(el) {
      const id = el.dataset.id;
      if (S.openMapId === id) { S.openMapId = null; A.render(); return; }
      S.openMapId = id;
      S.mapSpots[id] = await S.store.listMapSpots(id);
      A.render();
      const pts = S.mapSpots[id].map((x) => ({ lat: finite(x.snapshot.lat), lon: finite(x.snapshot.lon) })).filter((p) => Number.isFinite(p.lat) && Number.isFinite(p.lon));
      if (pts.length) S.mapObj.fitAll(pts);
    },
    async inviteOk(el) { await S.store.respondInvite(el.dataset.id, true); A.toast('Carte rejointe'); await A.refreshSocial(); },
    async inviteNo(el) { await S.store.respondInvite(el.dataset.id, false); await A.refreshSocial(); },
    async reqOk(el) { await S.store.respondRequest(el.dataset.id, el.dataset.user, true); A.toast('Membre accepté'); await A.refreshSocial(); },
    async reqNo(el) { await S.store.respondRequest(el.dataset.id, el.dataset.user, false); await A.refreshSocial(); },
    async leaveMap(el) {
      const m = S.maps.find((x) => x.id === el.dataset.id);
      if (m && m.myStatus === 'member' && !confirm('Quitter la carte « ' + m.name + ' » ?')) return;
      await S.store.removeMember(el.dataset.id, S.me.id);
      if (S.openMapId === el.dataset.id) S.openMapId = null;
      await A.refreshSocial();
    },
    async delMap(el) {
      const m = S.maps.find((x) => x.id === el.dataset.id);
      if (!m || !confirm('Supprimer la carte « ' + m.name + ' » pour tous ses membres ? Cette action est définitive.')) return;
      await S.store.deleteMap(m.id);
      S.openMapId = null;
      await A.refreshSocial();
      A.toast('Carte supprimée');
    },
    async rmMapSpot(el) {
      await S.store.removeMapSpot(el.dataset.id);
      S.mapSpots[S.openMapId] = await S.store.listMapSpots(S.openMapId);
      A.render();
    },
  });

  /* ---------- spot reçu / d'une carte commune : fiche et import ---------- */
  const importSpot = async (p) => {
    const lat = finite(p.lat), lon = finite(p.lon);
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) throw new Error('Coordonnées invalides');
    const spot = { id: U.uid(), name: String(p.name || p.spotName || 'Spot').slice(0, 80), lat, lon, notes: String(p.notes || '').slice(0, 4000), linkUrl: U.safeUrl(p.linkUrl), rules: p.rules && typeof p.rules === 'object' ? p.rules : {} };
    const saved = await S.store.saveSpot(spot);
    S.spots.push(saved);
    A.refreshForecasts(false, saved);
    A.render();
    return saved;
  };

  const sharedInfoHtml = (p, by) => {
    const link = U.safeUrl(p.linkUrl);
    return '<div class="dlg"><h2>' + esc(p.name || p.spotName || 'Spot') + '</h2>' +
      '<p class="fine">' + esc(U.fmtCoords(finite(p.lat), finite(p.lon))) + (by ? ' · partagé par @' + esc(by) : '') + '</p>' +
      (p.notes ? '<p class="notes">' + esc(p.notes).replace(/\n/g, '<br>') + '</p>' : '<p class="muted">' + (p.hiddenDescription ? 'La description est masquée par la personne qui a partagé ce spot.' : 'Pas de description.') + '</p>') +
      (link ? '<div class="links"><a href="' + esc(link) + '" target="_blank" rel="noopener noreferrer">' + A.icon('link') + 'Lien de prévision</a></div>' : '') +
      '<div class="dlg-actions"><button class="btn" data-act="closeDlg">Fermer</button><span class="sp"></span><button class="btn" data-act="viewPoint" data-lat="' + esc(finite(p.lat)) + '" data-lon="' + esc(finite(p.lon)) + '">Voir sur la carte</button><button class="btn btn-primary" id="importBtn">Ajouter à mes spots</button></div></div>';
  };

  A.actions.showShared = (el) => {
    const x = spotsOf({ id: S.openMapId }).find((i) => i.id === el.dataset.id);
    if (!x) return;
    A.dialog.open(sharedInfoHtml(x.snapshot, x.addedBy), () => {
      $('#importBtn').addEventListener('click', async () => { try { await importSpot(x.snapshot); A.dialog.close(); A.toast('Spot ajouté à ta carte'); } catch (e) { A.fail(e); } });
    });
  };
  A.actions.viewPoint = (el) => {
    const lat = parseFloat(el.dataset.lat), lon = parseFloat(el.dataset.lon);
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) { A.toast('Position invalide', 'error'); return; }
    A.dialog.close();
    S.mapObj.flyTo(lat, lon, 14);
  };

  /* ---------- reçu ---------- */
  const seenAsked = {};
  A.renderers.inbox = () => {
    if (!S.store.social) return A.lockedPanel('Spots et sessions reçus');
    let out = '<div class="head"><h2>Reçu</h2></div>';
    if (!S.inbox.length) return out + '<div class="empty"><p>Les spots et les sessions que tes amis te partagent arrivent ici.</p></div>';
    out += S.inbox.map((x) => {
      const p = x.payload;
      let body;
      if (x.kind === 'session') {
        const hour = /^\d{2}:\d{2}$/.test(p.hour || '') ? p.hour.replace(':', 'h') : '';
        body = '<h3 class="in-title">Session à ' + esc(p.spotName || 'un spot') + '</h3><p class="al-data"><b>' + esc(U.fmtDay(String(p.date || '2000-01-01'))) + (hour ? ' vers ' + esc(hour) : '') + '</b> · créneau ' + esc(String(finite(p.from))) + 'h–' + esc(String(finite(p.to))) + 'h · ' + U.num(finite(p.wave)) + ' m à ' + U.num(finite(p.period), 0) + ' s · vent ' + U.num(finite(p.wind), 0) + ' km/h</p>' + (p.message ? '<p class="notes">' + esc(p.message) + '</p>' : '');
      } else {
        body = '<h3 class="in-title">Spot : ' + esc(p.name || 'Spot') + '</h3>' + (p.notes ? '<p class="notes">' + esc(p.notes).replace(/\n/g, '<br>') + '</p>' : '<p class="muted">' + (p.hiddenDescription ? 'Description masquée.' : 'Pas de description.') + '</p>');
      }
      return '<article class="msg' + (x.seen ? '' : ' is-new') + '"><p class="fine">@' + esc(x.from) + ' · ' + ago(x.createdAt) + (x.seen ? '' : ' <span class="tag tag--new">nouveau</span>') + '</p>' + body +
        '<div class="actions"><button class="btn btn-small" data-act="viewPoint" data-lat="' + esc(finite(p.lat)) + '" data-lon="' + esc(finite(p.lon)) + '">Voir sur la carte</button><button class="btn btn-small" data-act="importShare" data-id="' + esc(x.id) + '">Ajouter à mes spots</button><button class="btn btn-small" data-act="delShare" data-id="' + esc(x.id) + '" aria-label="Supprimer ce message">' + A.icon('x') + '</button></div></article>';
    }).join('');
    const unseen = S.inbox.filter((x) => !x.seen && !seenAsked[x.id]).map((x) => x.id);
    if (unseen.length) {
      unseen.forEach((id) => { seenAsked[id] = true; });
      setTimeout(() => { S.store.markSeen(unseen).then(() => { S.inbox.forEach((x) => { if (unseen.indexOf(x.id) !== -1) x.seen = true; }); A.scheduleRender(); }).catch(() => {}); }, 2500);
    }
    return out;
  };

  Object.assign(A.actions, {
    async importShare(el) {
      const x = S.inbox.find((i) => i.id === el.dataset.id);
      if (!x) return;
      await importSpot(x.payload);
      A.toast('Spot ajouté à ta carte');
    },
    async delShare(el) { await S.store.deleteShare(el.dataset.id); S.inbox = S.inbox.filter((i) => i.id !== el.dataset.id); A.render(); },
  });

  /* ---------- formulaires en ligne ---------- */
  document.addEventListener('submit', async (ev) => {
    const form = ev.target.closest('form[data-form]');
    if (!form) return;
    ev.preventDefault();
    const kind = form.dataset.form, val = (n) => (form.elements[n] ? form.elements[n].value : '');
    try {
      if (kind === 'friend') {
        const who = await S.store.requestFriend($('#friendName').value);
        A.toast('Demande envoyée à @' + who);
      } else if (kind === 'createMap') {
        const name = $('#mapName').value.trim();
        if (!name) return A.toast('Donne un nom à la carte', 'error');
        S.openMapId = await S.store.createMap(name);
        S.mapSpots[S.openMapId] = [];
        A.toast('Carte créée');
      } else if (kind === 'joinMap') {
        await S.store.requestJoin($('#mapCode').value);
        A.toast('Demande envoyée. Le créateur de la carte doit l\'accepter.');
      } else if (kind === 'invite') {
        await S.store.inviteToMap(form.dataset.id, val('friend'));
        A.toast('Invitation envoyée');
      } else if (kind === 'addMapSpot') {
        const s = S.spots.find((x) => x.id === val('spot'));
        if (!s) return;
        await S.store.addSpotToMap(form.dataset.id, s, form.elements.hide.checked);
        S.mapSpots[form.dataset.id] = await S.store.listMapSpots(form.dataset.id);
        A.toast('Spot ajouté à la carte commune');
      }
      await A.refreshSocial();
      A.render();
    } catch (e) { A.fail(e); }
  });

  /* ---------- partage : choix des amis ---------- */
  const friendChecks = () =>
    S.friends.friends.length
      ? '<fieldset class="grp"><legend>Avec qui ?</legend><div class="chks">' + S.friends.friends.map((x) => '<label class="chk"><input type="checkbox" name="to" value="' + esc(x.id) + '"> @' + esc(x.username) + '</label>').join('') + '</div></fieldset>'
      : '<p class="muted">Tu n\'as pas encore d\'ami. Ajoute-en depuis l\'onglet Amis.</p>';
  const picked = () => Array.from(document.querySelectorAll('#shareForm input[name="to"]:checked')).map((i) => i.value);

  A.actions.shareSpot = (el) => {
    const s = S.spots.find((x) => x.id === el.dataset.id);
    if (!s) return;
    A.dialog.open(
      '<form class="dlg" id="shareForm"><h2>Partager « ' + esc(s.name) + ' »</h2>' + friendChecks() +
      '<label class="chk"><input id="s_hide" type="checkbox"> Masquer la description (le nom, la position et le lien sont partagés)</label>' +
      '<p class="fine">Les photos ne sont pas envoyées. Ton ami reçoit une copie qu\'il peut ajouter à sa propre carte.</p>' +
      '<p class="form-err" id="shareErr" role="alert" hidden></p>' +
      '<div class="dlg-actions"><button type="button" class="btn" data-act="closeDlg">Annuler</button><span class="sp"></span><button type="submit" class="btn btn-primary">Envoyer</button></div></form>',
      (d) => {
        $('#shareForm', d).addEventListener('submit', async (e) => {
          e.preventDefault();
          const to = picked();
          if (!to.length) { const er = $('#shareErr'); er.textContent = 'Choisis au moins un ami.'; er.hidden = false; return; }
          const hide = $('#s_hide').checked;
          try {
            await S.store.sendShares(to, 'spot', { name: s.name, lat: s.lat, lon: s.lon, notes: hide ? '' : s.notes, linkUrl: s.linkUrl || '', rules: s.rules || {}, hiddenDescription: hide });
            A.dialog.close(); A.toast('Spot partagé');
          } catch (ex) { const er = $('#shareErr'); er.textContent = ex.message; er.hidden = false; }
        });
      });
  };

  A.actions.shareSession = (el) => {
    const s = S.spots.find((x) => x.id === el.dataset.id);
    const f = s && S.fc[s.id];
    const day = f && f.days && f.days.find((d) => d.date === el.dataset.date);
    if (!day || !day.window) return;
    const hh = String(day.window.from).padStart(2, '0') + ':00';
    A.dialog.open(
      '<form class="dlg" id="shareForm"><h2>Partager la session</h2>' +
      '<p class="al-data"><b>' + esc(s.name) + '</b> · ' + esc(U.fmtDay(day.date)) + ' · ' + esc(F.windowText(day.window)) + '</p>' + friendChecks() +
      '<label class="fld">Heure à laquelle tu y vas<input id="s_time" type="time" value="' + hh + '"></label>' +
      '<label class="fld">Message (facultatif)<textarea id="s_msg" rows="2" maxlength="300" placeholder="On se retrouve au parking ?"></textarea></label>' +
      '<p class="form-err" id="shareErr" role="alert" hidden></p>' +
      '<div class="dlg-actions"><button type="button" class="btn" data-act="closeDlg">Annuler</button><span class="sp"></span><button type="submit" class="btn btn-primary">Envoyer</button></div></form>',
      (d) => {
        $('#shareForm', d).addEventListener('submit', async (e) => {
          e.preventDefault();
          const to = picked();
          if (!to.length) { const er = $('#shareErr'); er.textContent = 'Choisis au moins un ami.'; er.hidden = false; return; }
          try {
            await S.store.sendShares(to, 'session', {
              spotName: s.name, lat: s.lat, lon: s.lon, linkUrl: s.linkUrl || '', date: day.date, from: day.window.from, to: day.window.to,
              wave: day.stats.wave, period: day.stats.period, wind: day.stats.wind, hour: $('#s_time').value, message: $('#s_msg').value.trim(),
            });
            A.dialog.close(); A.toast('Session partagée');
          } catch (ex) { const er = $('#shareErr'); er.textContent = ex.message; er.hidden = false; }
        });
      });
  };

  A.actions.toMap = (el) => {
    const s = S.spots.find((x) => x.id === el.dataset.id);
    const maps = S.maps.filter((m) => m.myStatus === 'member');
    if (!s) return;
    if (!maps.length) { A.toast("Crée ou rejoins d'abord une carte commune (onglet Cartes).", 'error'); return; }
    A.dialog.open(
      '<form class="dlg" id="shareForm"><h2>Ajouter « ' + esc(s.name) + ' » à une carte commune</h2>' +
      '<label class="fld">Carte<select id="m_sel">' + maps.map((m) => '<option value="' + esc(m.id) + '">' + esc(m.name) + '</option>').join('') + '</select></label>' +
      '<label class="chk"><input id="s_hide" type="checkbox"> Masquer la description</label>' +
      '<p class="fine">Tous les membres de la carte verront ce spot. Ton spot personnel reste privé.</p>' +
      '<p class="form-err" id="shareErr" role="alert" hidden></p>' +
      '<div class="dlg-actions"><button type="button" class="btn" data-act="closeDlg">Annuler</button><span class="sp"></span><button type="submit" class="btn btn-primary">Ajouter</button></div></form>',
      (d) => {
        $('#shareForm', d).addEventListener('submit', async (e) => {
          e.preventDefault();
          try {
            const id = $('#m_sel').value;
            await S.store.addSpotToMap(id, s, $('#s_hide').checked);
            if (S.openMapId === id) S.mapSpots[id] = await S.store.listMapSpots(id);
            A.dialog.close(); A.toast('Spot ajouté à la carte commune'); A.render();
          } catch (ex) { const er = $('#shareErr'); er.textContent = ex.message; er.hidden = false; }
        });
      });
  };
})();

/* ===== app-help ===== */
/* Houle - tutoriel d'accueil et aide */

    { t: 'Bienvenue sur Houle', b: () =>
      '<p>Houle est ton <b>carnet de spots de surf</b> : tu places tes spots sur la carte, et l\'appli te prévient quand la houle et le vent sont bons pour <b>toi</b>.</p>' +
      '<ol class="howto"><li>Tu ajoutes un spot sur la carte.</li><li>Tu dis ce que tu aimes (taille de houle, vent…).</li><li>Houle surveille les prévisions et te prévient.</li></ol>' +
      '<p class="muted">Pas besoin de compte pour commencer : tout reste sur cet appareil.</p>' },
    { t: '1. Ajouter un spot', b: () =>

      '<p>Autres façons de placer un spot :</p><ul class="howto"><li>Écris un lieu dans la barre de recherche de la carte.</li><li>Colle des coordonnées GPS, par exemple <code>43.48, -1.55</code>.</li><li>Appuie sur la cible <b>⌖</b> pour utiliser ta position.</li></ul>' +

    { t: '4. Recevoir des alertes', b: () =>
      '<p>Dans la fiche d\'un spot, choisis <b>quand être prévenu</b> : 7 jours avant, 3 jours avant, la veille ou le matin même.</p>' +
      '<p>Va dans l\'onglet <b>Alertes</b> et autorise les notifications. Elles s\'affichent <b>quand Houle est ouverte</b> dans ton navigateur : garde l\'onglet ouvert, ou rouvre l\'appli régulièrement.</p>' },
    { t: '5. Garder tes données', b: () => {
      const social = S.store && S.store.social;
      return '<p>Tes spots sont enregistrés <b>sur cet appareil</b>. Dans l\'onglet <b>Spots</b>, utilise <b>« Exporter une sauvegarde »</b> de temps en temps.</p>' +
        (social
          ? '<p>Avec ton compte, tu peux aussi : ajouter des <b>amis</b> (onglet Amis), leur <b>partager un spot</b> en masquant ou non ta description, leur envoyer une <b>session</b> (« j\'y vais à 13 h »), et créer des <b>cartes communes</b> (onglet Cartes). Tes spots restent privés tant que tu ne les partages pas.</p>'
          : '<p class="muted">Les amis, les partages et les cartes communes ne sont pas activés dans cette version : ils demandent un petit serveur gratuit (voir le guide <b>LISEZ-MOI</b>). Tout le reste fonctionne déjà.</p>') +
        '<p>Tu peux relire ce tutoriel à tout moment avec le bouton <b>?</b> en haut.</p>';
    } },
  ];

  let step = 0;
  function show() {
    const s = STEPS[step], last = step === STEPS.length - 1;
    const dots = STEPS.map((_, i) => '<span class="dot' + (i === step ? ' on' : '') + '"></span>').join('');
    A.dialog.open(
      '<div class="dlg tour"><div class="tour-head"><span class="tour-count">' + (step + 1) + ' / ' + STEPS.length + '</span><button class="btn btn-small" data-act="tourSkip">Passer</button></div>' +
      '<h2>' + s.t + '</h2><div class="tour-body">' + s.b() + '</div>' +
      '<div class="dots" aria-hidden="true">' + dots + '</div>' +
      '<div class="dlg-actions">' + (step ? '<button class="btn" data-act="tourPrev">Précédent</button>' : '') +
      '<button class="btn btn-primary" data-act="' + (last ? 'tourSkip' : 'tourNext') + '" style="margin-left:auto">' + (last ? 'C\'est parti' : 'Suivant') + '</button></div></div>',
      null, { onclose: done }
    );
  }
  function done() { try { localStorage.setItem(KEY, '1'); } catch (e) { /* ignore */ } }

  A.openTour = () => { step = 0; show(); };
  A.maybeTour = () => {
    let seen = false;
    try { seen = !!localStorage.getItem(KEY); } catch (e) { /* ignore */ }
    if (!seen && !$dlgOpen()) A.openTour();
  };
  const $dlgOpen = () => { const d = document.getElementById('dlg'); return d && d.open; };

  Object.assign(A.actions, {
    tour() { A.openTour(); },
    tourNext() { step = Math.min(step + 1, STEPS.length - 1); show(); },
    tourPrev() { step = Math.max(step - 1, 0); show(); },
    tourSkip() { done(); A.dialog.close(); },
  });
})();

/* ===== app-known ===== */
/* Houle - spots connus (base de départ, à confirmer sur satellite) */
(function () {
  const H = globalThis.Houle, A = H.app, S = A.S, U = H.util, F = H.forecast;
  const esc = U.esc;
  const TYPES = { beach: 'beach break', reef: 'reef', point: 'point break', rivermouth: 'embouchure', other: 'spot' };
  const DISC = { s: { n: 'Surf', c: 'surf' }, b: { n: 'Bodyboard', c: 'body' }, l: { n: 'Longboard', c: 'long' } };
  const TIDE = { low: 'marée basse', mid: 'mi-marée', high: 'marée haute', all: 'toutes marées' };
  const LEVEL = { beginner: 'débutant', intermediate: 'intermédiaire', advanced: 'confirmé', all: 'tous niveaux' };
  const norm = (s) => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();

  const KNOWN = (H.knownSpots || []).map((r, i) => {
    const x = r[6] || {};
    return { i, name: r[0], lat: r[1], lon: r[2], type: r[3], region: r[4], sure: r[5] === 1, p: x.p || 's', d: x.d || [-1, -1, -1], sw: x.sw || null, wd: x.wd || null, ti: x.ti || null, sz: x.sz || null, lv: x.lv || null, alt: x.alt || null, est: !!x.est, read: !!x.ok, n: norm(r[0] + ' ' + r[4] + ' ' + (x.alt || '')) };
  });
  A.known = KNOWN;
  const kfc = {}; // prévisions chargées pour les spots connus

  A.searchKnown = (q) => {
    const t = norm(q);
    if (t.length < 2) return [];
    const words = t.split(' ');
    return KNOWN.filter((k) => words.every((w) => k.n.indexOf(w) !== -1)).slice(0, 6);
  };

  const arc = (a) => (a ? U.compass(a[0]) + ' → ' + U.compass(a[1]) + ' (' + a[0] + '° à ' + a[1] + '°)' : null);
  const sayDisc = (k) => {
    const lab = ['Surf', 'Bodyboard', 'Longboard'];
    const best = [], ok = [];
    k.d.forEach((v, j) => { if (v === 2) best.push(lab[j]); else if (v === 1) ok.push(lab[j]); });
    return (best.length ? '<b>' + best.join(', ') + '</b>' : '') + (ok.length ? (best.length ? ' · possible : ' : 'possible : ') + ok.join(', ') : '');
  };

  /* le spot est-il déjà dans mes spots (moins de 150 m) ? */
  function mine(k) {
    const R = 6371000, p = Math.PI / 180;
    return S.spots.find((s) => {
      const x = (s.lon - k.lon) * p * Math.cos(((s.lat + k.lat) / 2) * p), y = (s.lat - k.lat) * p;
      return R * Math.hypot(x, y) < 150;
    });
  }

  function rulesFor(k) {
    const r = { disc: k.p };
    if (k.sw) { r.swellOn = true; r.swellFrom = k.sw[0]; r.swellTo = k.sw[1]; }
    if (k.wd) { r.dirOn = true; r.dirFrom = k.wd[0]; r.dirTo = k.wd[1]; }
    if (k.sz) { r.waveMin = k.sz[0]; r.waveMax = k.sz[1]; }
    return r;
  }

  function fcBlock(i) {
    const f = kfc[i];
    if (!f) return '<button class="btn btn-small" data-act="knownFc" data-i="' + i + '">🌊 Voir la houle prévue</button>';
    if (f.status === 'loading') return '<p class="fine">Chargement de la prévision…</p>';
    if (f.status === 'error') return '<p class="fine">' + esc(f.error) + ' <button class="btn btn-small" data-act="knownFc" data-i="' + i + '">Réessayer</button></p>';
    const e = F.swellEmoji(f.days);
    const cells = f.days.map((d, j) => '<div class="cell cell--' + d.status + '" title="' + esc(U.fmtDay(d.date)) + '"><span class="cd">' + (j === 0 ? 'auj.' : esc(U.weekdayShort(d.date))) + '</span><span class="cb"><i style="height:' + Math.max(10, Math.min(100, Math.round(((d.waveMax || 0) / 4) * 100))) + '%"></i></span><span class="cv">' + U.num(d.stats.wave) + '</span></div>').join('');
    return '<p class="kfc-head"><span class="swe big">' + e.emoji + '</span> <b>' + e.label + '</b> dans les 3 prochains jours (jusqu\'à ' + U.num(e.wave) + ' m)</p><div class="strip">' + cells + '</div>' +
      '<p class="fine">Vert : conditions réunies d\'après les réglages conseillés pour ce spot. Houle du modèle Open-Meteo, au large.</p>';
  }

  A.showKnown = (i, fly) => {
    const k = KNOWN[i];
    if (!k) return;
    if (fly) S.mapObj.flyTo(k.lat, k.lon, 15);
    const have = mine(k);
    const cond = [];
    if (k.sw) cond.push('<li>Houle : <b>' + arc(k.sw) + '</b></li>');
    if (k.wd) cond.push('<li>Vent favorable : <b>' + arc(k.wd) + '</b></li>');
    if (k.ti) cond.push('<li>Marée : <b>' + TIDE[k.ti] + '</b></li>');
    if (k.sz) cond.push('<li>Taille : <b>' + k.sz[0] + ' à ' + k.sz[1] + ' m</b></li>');
    if (k.lv) cond.push('<li>Niveau : <b>' + LEVEL[k.lv] + '</b></li>');
    A.dialog.open(
      '<div class="dlg"><h2><i class="dchip dchip--' + DISC[k.p].c + '"></i>' + esc(k.name) + '</h2>' +
      '<p class="muted">' + esc(k.region) + ' · ' + (TYPES[k.type] || 'spot') + (k.alt ? ' · aussi : ' + esc(k.alt) : '') + '</p>' +
      '<p class="fine">' + U.fmtCoords(k.lat, k.lon) + '</p>' +
      '<p>' + sayDisc(k) + (k.est ? ' <span class="fine">(estimé d\'après le type de spot)</span>' : ' <span class="fine">(indicatif)</span>') + '</p>' +
      (cond.length ? '<h4>Conditions conseillées</h4><ul class="howto">' + cond.join('') + '</ul>' : '<p class="fine">Pas de conditions publiées trouvées pour ce spot : règle les tiennes après l\'ajout.</p>') +
      '<div id="kfc">' + fcBlock(i) + '</div>' +
      '<p class="knote">Position <b>' + (k.sure ? 'recoupée sur plusieurs sources' : 'issue d\'une seule source') + '</b>, précise à environ 300 à 500 m : c\'est souvent le parking ou la plage, pas le pic exact. Après l\'ajout, passe en <b>vue satellite</b> et déplace le repère sur le pic.</p>' +
      '<div class="dlg-actions"><button class="btn" data-act="closeDlg">Fermer</button><span class="sp"></span>' +
      (have ? '<button class="btn btn-primary" data-act="selectMine" data-id="' + esc(have.id) + '">Déjà dans mes spots</button>'
        : '<button class="btn btn-primary" data-act="addKnown" data-i="' + i + '">Ajouter à mes spots</button>') + '</div></div>'
    );
  };

  async function loadKnownFc(i) {
    const k = KNOWN[i];
    kfc[i] = { status: 'loading' };
    const box = () => document.getElementById('kfc');
    if (box()) box().innerHTML = fcBlock(i);
    try {
      const data = await F.getForecast(k.lat, k.lon);
      kfc[i] = { status: 'ok', days: F.evaluateSpot(data, rulesFor(k)) };
      S.mapObj.setKnownEmoji(i, F.swellEmoji(kfc[i].days).emoji);
    } catch (e) { kfc[i] = { status: 'error', error: e.message }; }
    if (box()) box().innerHTML = fcBlock(i);
  }

  Object.assign(A.actions, {
    goKnown(el) { document.getElementById('searchResults').hidden = true; A.showKnown(parseInt(el.dataset.i, 10), true); },
    knownFc(el) { return loadKnownFc(parseInt(el.dataset.i, 10)); },
    addKnown(el) {
      const k = KNOWN[parseInt(el.dataset.i, 10)];
      A.dialog.close();
      S.mapObj.flyTo(k.lat, k.lon, 16);
      A.openSpotDialog(null, { lat: k.lat, lon: k.lon, name: k.name, rules: rulesFor(k), notes: 'Position de départ issue de la base de spots connus (à confirmer sur satellite).' + (k.read ? ' Conditions conseillées lues sur des sites de spots.' : '') });
    },
    selectMine(el) { A.dialog.close(); A.selectSpot(el.dataset.id, true); },
    kfilter(el) {
      const key = el.dataset.k;
      document.querySelectorAll('#kFilter [data-act="kfilter"]').forEach((b) => b.setAttribute('aria-pressed', String(b === el)));
      const idx = { s: 0, b: 1, l: 2 }[key];
      S.mapObj.setKnownFilter(key === 'all' ? null : (k) => k.d[idx] >= 1 || (k.d.every((v) => v < 0) && k.p === key));
      const n = KNOWN.filter((k) => key === 'all' || k.d[idx] >= 1).length;
      A.toast(key === 'all' ? KNOWN.length + ' spots connus' : n + ' spots : ' + DISC[key].n.toLowerCase());
    },
  });

  A.initKnown = () => {
    if (!S.mapObj || !S.mapObj.ready) return;
    S.mapObj.setKnown(KNOWN);
    const b = document.getElementById('btnKnown');
    b.addEventListener('click', () => {
      const on = b.getAttribute('aria-pressed') !== 'true';
      b.setAttribute('aria-pressed', String(on));
      S.mapObj.setKnownVisible(on);
      document.getElementById('kFilter').hidden = !on;
      A.toast(on ? KNOWN.length + ' spots connus affichés' : 'Spots connus masqués');
    });
  };
})();

/* ===== app-cond ===== */
/* Houle - mode « Conditions » : vent animé (façon Windy) ou houle (façon Windguru), un seul à la fois ; clic = tableau heure par heure */
(function () {
  const H = globalThis.Houle, A = H.app, S = A.S, U = H.util, K = H.cond;
  const esc = U.esc;
  const $ = (s) => document.querySelector(s);

  const C = (A.cond = {
    active: false, view: 'wind', pressure: true, source: '', res: '5', offset: 0, maxOffset: 48,
    grid: null, cacheW: new Map(), cacheM: new Map(), token: 0, status: '', loading: false, timer: 0,
    canvas: null, ctx: null, pcv: null, pctx: null, work: null, land: null, landState: '', vec: null, raf: 0, parts: [], det: null, dtoken: 0,
  });
  const TTL = 30 * 60 * 1000;
  // finesse de la maille : pas minimal en degrés (1° ≈ 111 km) et nombre maximal de points par vue (quota Open-Meteo)
  const RES = { '15': { min: 0.125, max: 150, km: 15, label: '15 km' }, '5': { min: 0.05, max: 400, km: 5, label: '5 km' }, '1.3': { min: 0.0125, max: 600, km: 1.3, label: '1,3 km' } };
  const keyOf = (p) => p.lat.toFixed(3) + ',' + K.normLon(p.lon).toFixed(3);
  const hourNow = () => Math.floor(Date.now() / 3600000) * 3600000;
  const atMs = () => hourNow() + C.offset * 3600000;
  const fmtWhen = (ms) => (C.offset === 0 ? 'Maintenant' : new Date(ms).toLocaleString('fr-FR', { weekday: 'short', day: 'numeric', hour: 'numeric' }).replace(':00', ''));
  const reduced = () => !!(globalThis.matchMedia && globalThis.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /* ---------- trait de côte (pour que la houle reste dans l'eau) ---------- */
  async function loadLand() {
    if (C.landState) return;
    C.landState = 'loading';
    try {
      await U.loadScript('https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js');
      const res = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-50m.json');
      if (!res.ok) throw new Error('land ' + res.status);
      const topo = await res.json();
      const f = globalThis.topojson.feature(topo, topo.objects.land);
      const geoms = f.type === 'FeatureCollection' ? f.features.map((x) => x.geometry) : [f.geometry];
      const polys = [];
      geoms.forEach((g) => {
        const list = g.type === 'MultiPolygon' ? g.coordinates : g.type === 'Polygon' ? [g.coordinates] : [];
        list.forEach((rings) => {
          let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
          rings[0].forEach(([lo, la]) => { if (lo < x0) x0 = lo; if (lo > x1) x1 = lo; if (la < y0) y0 = la; if (la > y1) y1 = la; });
          polys.push({ rings, x0, x1, y0, y1 });
        });
      });
      C.land = polys; C.landState = 'ok';
      draw();
    } catch (e) {
      C.landState = 'fail';
      renderPanel();
    }
  }
  // efface la terre sur le canvas de travail (destination-out)
  function maskLand(ctx, w, h) {
    const map = S.mapObj.raw;
    if (!C.land) return false;
    const z = map.getZoom(), scale = 256 * Math.pow(2, z), b = map.getBounds();
    const fast = typeof map.project === 'function', o = fast ? map.project(map.containerPointToLatLng([0, 0]), z) : null;
    const W = b.getWest(), E = b.getEast(), So = b.getSouth(), No = b.getNorth();
    const stride = z < 5 ? 3 : z < 7 ? 2 : 1;
    const slow = (lat, lon) => { const q = map.latLngToContainerPoint([lat, lon]); return [q.x, q.y]; };
    const X = (lon, lat) => (fast ? ((lon + 180) / 360) * scale - o.x : slow(lat, lon)[0]);
    const Y = (lat, lon) => { if (!fast) return slow(lat, lon)[1]; const la = clamp(lat, -85.05, 85.05); return (0.5 - Math.log(Math.tan(Math.PI / 4 + (la * Math.PI) / 360)) / (2 * Math.PI)) * scale - o.y; };
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = '#000';
    C.land.forEach((p) => {
      if (p.y1 < So || p.y0 > No) return;
      if (p.x1 < W || p.x0 > E) return;
      ctx.beginPath();
      p.rings.forEach((ring) => {
        const last = ring.length - 1;
        for (let k = 0; k <= last; k += stride) {
          const pt = ring[k], x = X(pt[0]), y = Y(pt[1]);
          if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.lineTo(X(ring[last][0], ring[last][1]), Y(ring[last][1], ring[last][0]));
        ctx.closePath();
      });
      ctx.fill('evenodd');
    });
    ctx.restore();
    return true;
  }

  /* ---------- données de la zone ---------- */
  async function refresh() {
    if (!C.active || !S.mapObj || !S.mapObj.raw) return;
    const map = S.mapObj.raw, b = map.getBounds(), size = map.getSize(), GL = H.global;
    const bb = { south: b.getSouth(), west: b.getWest(), north: b.getNorth(), east: b.getEast() };
    if (map.getZoom() <= 5 && GL) {
      if (GL.ready) { refreshGlobal(bb); return; }
      if (GL.state === 'loading') { C.status = 'Chargement des données mondiales…'; renderPanel(); return; }
    }
    const R = RES[C.res] || RES['5'], swell = C.view === 'swell', cache = swell ? C.cacheM : C.cacheW;
    // la houle du modèle gratuit a des mailles d'environ 8 km : inutile de la demander plus fin que 0,1°
    const g = K.gridFor(bb, 999, R.max, swell ? Math.max(R.min, 0.1) : R.min);
    const nodes = [];
    g.lats.forEach((lat) => g.lons.forEach((lon) => nodes.push({ lat, lon, step: g.step })));
    const now = Date.now();
    const missing = nodes.filter((p) => { const c = cache.get(keyOf(p)); return !c || now - c.at > TTL; });
    const token = ++C.token;
    if (missing.length) {
      C.loading = true; C.status = 'Chargement de ' + missing.length + ' points…'; renderPanel();
      try {
        const recs = await K.fetchPoints(missing, { marine: swell, wind: !swell });
        recs.forEach((r, i) => cache.set(keyOf(missing[i]), { rec: r, at: Date.now() }));
      } catch (e) {
        C.loading = false;
        if (GL && GL.ready) { refreshGlobal(bb); return; } // Open-Meteo saturé : on garde la carte mondiale
        C.status = e.message || 'Données indisponibles';
        renderPanel();
        if (token === C.token) A.toast(C.status, 'error');
        return;
      }
      C.loading = false;
    }
    if (token !== C.token) return; // la carte a encore bougé : une autre mise à jour est en cours
    C.source = 'om';
    C.grid = { step: g.step, lats: g.lats, lons: g.lons, rec: g.lats.map((lat) => g.lons.map((lon) => { const c = cache.get(keyOf({ lat, lon })); return c ? c.rec : null; })) };
    const withData = nodes.filter((p) => { const c = cache.get(keyOf(p)); return c && c.rec.n; }).length;

    html += '<tr class="sec"><th class="rowh" colspan="' + (cols.length + 1) + '">Vent</th></tr>';
    html += row('Vent', 'km/h', (i) => { const v = d.wind[i]; if (v == null) return cell('nd', '–', '', i); const c = K.windColor(v); return cell('v', Math.round(v), bg(c) + ';' + txtOn(c), i); });
    html += row('Rafales', 'km/h', (i) => { const v = d.gust[i]; if (v == null) return cell('nd', '–', '', i); const c = K.windColor(v); return cell('v', Math.round(v), bg(c) + ';' + txtOn(c), i); });
    html += row('Direction', '', (i) => cell('dr', d.wdir[i] == null ? '–' : rot(d.wdir[i]) + '<small>' + U.compass(d.wdir[i]) + '</small>', '', i));
    if (sea) {
      html += '<tr class="sec"><th class="rowh" colspan="' + (cols.length + 1) + '">Houle</th></tr>';
      html += row('Hauteur', 'm', (i) => { const v = d.main[i].h; if (v == null) return cell('nd', '–', '', i); const c = K.waveColor(v); return cell('v', v.toFixed(1), bg(c) + ';' + txtOn(c), i); });
      html += row('Période', 's', (i) => { const v = d.main[i].t; return cell('v2', v == null ? '–' : Math.round(v), '', i); });
      html += row('Direction', '', (i) => cell('dr', d.main[i].d == null ? '–' : rot(d.main[i].d) + '<small>' + U.compass(d.main[i].d) + '</small>', '', i));
      html += row('Puissance', 'kW/m', (i) => { const v = d.power[i]; return cell('v2', v == null ? '–' : Math.round(v), '', i); });
      if (d.sh.some((v) => v != null)) {
        html += row('Mer de vent', 'm · s', (i) => cell('v2', d.wh[i] == null ? '–' : d.wh[i].toFixed(1) + '<small>' + (d.wp[i] == null ? '' : Math.round(d.wp[i]) + 's') + '</small>', '', i));
        if (d.s2h.some((v) => v != null)) html += row('2e houle', 'm · s', (i) => cell('v2', d.s2h[i] == null ? '–' : d.s2h[i].toFixed(1) + '<small>' + (d.s2p[i] == null ? '' : Math.round(d.s2p[i]) + 's') + '</small>', '', i));
      }
    }
    return html + '</tbody></table>';
  }

  function renderDetail() {
    const D = C.det, el = $('#wgBody');
    if (!D || !el) return;
    const d = D.d;
    el.innerHTML =
      summarySvg(D) +
      '<div class="wg-days" role="group" aria-label="Jour affiché">' + D.days.map((o, k) => '<button type="button" class="kf" data-act="wgDay" data-i="' + k + '" aria-pressed="' + (k === D.sel) + '">' + esc(o.label) + '</button>').join('') + '</div>' +
      '<div class="wg-scroll">' + dayTable(D) + '</div>' +
      '<p class="fine">Heures de ton appareil (' + esc(Intl.DateTimeFormat().resolvedOptions().timeZone || 'locale') + '). La nuit est grisée. Au-delà de 4 jours, les colonnes sont ternes : la prévision est moins fiable.</p>' +
      (d.sea ? '<p class="fine">Houle principale du modèle de vagues (cases de 10 à 25 km, plutôt au large). Puissance = 0,49 × hauteur² × période. Direction : d\'où vient la houle ou le vent, la flèche montre où ça va.</p>'
        : '<p class="cp-warn" role="note">Ce point est à terre ou trop loin de la mer : pas de données de houle, seulement le vent.</p>');
  }

  async function showDetail(lat, lon) {
    const tok = ++C.dtoken;
    const dlg = A.dialog.open('<div class="dlg wg"><h2>Prévisions</h2><p class="fine">Chargement de 7 jours de prévisions…</p><div class="dlg-actions"><button class="btn" data-act="closeDlg">Fermer</button></div></div>', null, { onclose: () => { C.dtoken++; dlg.classList.remove('wide'); } });
    dlg.classList.add('wide');
    let d;
    try { d = await K.fetchDetail(lat, lon); } catch (e) {
      if (tok !== C.dtoken) return;
      dlg.innerHTML = '<div class="dlg"><h2>Prévisions</h2><p class="knote">' + esc(e.message || 'Prévisions indisponibles') + '</p><div class="dlg-actions"><button class="btn" data-act="closeDlg">Fermer</button></div></div>';
      return;
    }
    if (tok !== C.dtoken) return;
    const days = buildDays(d);
    const cur = localKey(atMs());
    C.det = { d, days, sel: Math.max(0, days.findIndex((o) => o.key === cur)), lat, lon };
    dlg.innerHTML =
      '<div class="dlg wg"><h2>Prévisions · ' + esc(U.fmtCoords(lat, lon)) + '</h2>' +
      '<p class="fine">' + (d.sea ? 'En mer ou près de la côte' : 'À terre') + ' · l\'heure choisie sur la carte est encadrée dans le tableau</p>' +
      '<div id="wgBody"></div>' +
      '<div class="dlg-actions"><button class="btn" data-act="closeDlg">Fermer</button><span class="sp"></span><button class="btn btn-primary" data-act="condAdd" data-lat="' + lat + '" data-lon="' + lon + '">Ajouter un spot ici</button></div></div>';
    renderDetail();
  }
  A.cond.click = (lat, lon) => { if (!C.active) return false; showDetail(lat, lon); return true; };

  /* ---------- panneau ---------- */
  function legendHtml() {
    const wind = C.view === 'wind', stops = wind ? K.WIND_STOPS : K.WAVE_STOPS, max = stops[stops.length - 1][0];
    const ticks = (wind ? [0, 10, 20, 30, 40, 55, 70, 90] : [0, 0.5, 1, 1.8, 2.8, 4, 6]).map((v) => '<span style="left:' + (v / max) * 100 + '%">' + v + '</span>').join('');
    return '<div class="cp-row cp-legend"><span class="lg"><b>' + (wind ? 'Vent' : 'Houle') + '</b> ' + (wind ? 'km/h' : 'mètres') + '</span>' +
      '<span class="scale"><i class="bar" style="background:linear-gradient(90deg,' + stops.map((s) => lerp(s[1])).join(',') + ')"></i><span class="ticks">' + ticks + '</span></span></div>';
  }
  function renderPanel() {
    const el = $('#condPanel');
    if (!el || el.hidden) return;
    const chip = (k, name) => '<button type="button" class="kf" data-act="condView" data-k="' + k + '" aria-pressed="' + (C.view === k) + '">' + name + '</button>';
    const fine = C.view === 'swell' && C.source === 'om' && RES[C.res].km < 5 ? '<p class="cp-warn" role="note">Le modèle de houle gratuit a des mailles d\'environ 8 km. La côte est dessinée au kilomètre près, mais la houle elle-même est lissée entre ces mailles.</p>' : '';
    const note = fine + (C.view === 'swell' && C.landState === 'fail' ? '<p class="cp-warn" role="note">Trait de côte non chargé : la houle peut déborder un peu sur la terre.</p>' : '');
    el.innerHTML =
      '<div class="cp-row">' + chip('wind', 'Vent') + chip('swell', 'Houle') + (H.global && H.global.ready ? '<button type="button" class="kf" data-act="condPres" aria-pressed="' + C.pressure + '">Pression</button>' : '') + '<span class="cp-status" aria-live="polite">' + esc(C.status) + '</span></div>' +
      '<div class="cp-row cp-res"><span class="cp-lbl">Maille</span>' + ['1.3', '5', '15'].map((k) => '<button type="button" class="kf" data-act="condRes" data-k="' + k + '" aria-pressed="' + (C.res === k) + '">' + RES[k].label + '</button>').join('') + '</div>' +
      '<div class="cp-row"><label class="cp-time">' + esc(fmtWhen(atMs())) + '<input id="condTime" type="range" min="0" max="' + C.maxOffset + '" step="1" value="' + C.offset + '" aria-label="Heure affichée"></label>' +
      '<button type="button" class="btn btn-small" data-act="condNow">Maintenant</button></div>' +
      legendHtml() + note +
      '<p class="cp-hint"><span class="cp-more">Touche la carte pour le détail heure par heure.</span></p>';
    const t = $('#condTime');
    if (t) t.addEventListener('input', () => { C.offset = parseInt(t.value, 10) || 0; renderPanelLabelOnly(); requestDraw(); });
  }
  function renderPanelLabelOnly() { const l = document.querySelector('.cp-time'); if (l) l.firstChild.textContent = fmtWhen(atMs()); }

  /* ---------- bascule de mode ---------- */
  function setMode(m) {
    const on = m === 'cond';
    if (on === C.active) return;
    if (!S.mapObj || !S.mapObj.ready) { A.toast('Carte indisponible', 'error'); return; }
    C.active = on;
    document.querySelectorAll('#modeSwitch [data-act="mode"]').forEach((b) => b.setAttribute('aria-pressed', String((b.dataset.m === 'cond') === on)));
    const known = $('#btnKnown');
    if (on) {
      if (!C.canvas) {
        C.canvas = document.createElement('canvas'); C.canvas.className = 'condcanvas';
        C.pcv = document.createElement('canvas'); C.pcv.className = 'condcanvas condparticles';
        const raw = S.mapObj.raw, LL = globalThis.L;
        if (raw.createPane && LL && LL.DomUtil) {
          // volet de la carte entre les fonds et les repères : les spots restent visibles au-dessus des couleurs
          const pane = raw.getPane('houleCond') || raw.createPane('houleCond');
          pane.style.zIndex = 450; pane.style.pointerEvents = 'none';
          pane.appendChild(C.canvas); pane.appendChild(C.pcv); C.inPane = true;
        } else { raw.getContainer().appendChild(C.canvas); raw.getContainer().appendChild(C.pcv); }
        C.ctx = C.canvas.getContext('2d'); C.pctx = C.pcv.getContext('2d');
        raw.on('move zoom resize', requestDraw);
        raw.on('movestart zoomstart', stopParticles);
        raw.on('moveend', scheduleRefresh);
      }
      C.canvas.hidden = false; C.pcv.hidden = false;
      $('#condPanel').hidden = false;
      $('#kFilter').hidden = true;
      S.mapObj.setKnownVisible(false);
      renderPanel();
      if (H.global && !H.global.ready && H.global.state !== 'loading') H.global.load().then(() => { if (C.active) { renderPanel(); refresh(); } });
      refresh();
      loadLand();
    } else {
      stopParticles();
      if (C.canvas) { C.canvas.hidden = true; C.pcv.hidden = true; C.ctx.clearRect(0, 0, C.canvas.width, C.canvas.height); }
      $('#condPanel').hidden = true;
      const kn = !known || known.getAttribute('aria-pressed') === 'true';
      S.mapObj.setKnownVisible(kn);
      $('#kFilter').hidden = !kn;
    }
    document.getElementById('app').classList.toggle('is-cond', on);
    setTimeout(() => S.mapObj.invalidate(), 60);
  }

  Object.assign(A.actions, {
    mode(el) { setMode(el.dataset.m); },
    condView(el) { C.view = el.dataset.k === 'swell' ? 'swell' : 'wind'; renderPanel(); refresh(); },
    condRes(el) { C.res = RES[el.dataset.k] ? el.dataset.k : '5'; renderPanel(); refresh(); },
    condPres() { C.pressure = !C.pressure; renderPanel(); draw(); },
    condNow() { C.offset = 0; renderPanel(); draw(); },
    condAdd(el) { const lat = parseFloat(el.dataset.lat), lon = parseFloat(el.dataset.lon); A.dialog.close(); setMode('normal'); A.openSpotDialog(null, { lat, lon }); },
    wgDay(el) { if (C.det) { C.det.sel = clamp(parseInt(el.dataset.i, 10) || 0, 0, C.det.days.length - 1); renderDetail(); } },
  });
  window.addEventListener('resize', () => { if (C.active) { requestDraw(); scheduleRefresh(); } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && C.active && C.view === 'wind' && C.vec && !C.raf) startParticles(); });
  A.cond.setMode = setMode;
})();


Houle.app.boot();

</script>
</body>
</html>
