<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e2830">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Houle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* Houle : carte marine + tableau de marées.
   Mise en page : panneau d'information à gauche, carte à droite (carte au-dessus sur téléphone).
   Palette : papier de carte (gris-vert froid), encre d'abysse, orange de balise pour l'action,
   vert/ambre/gris pour l'état d'une session. */
:root {
  --paper: #edf2f2; --card: #fafcfc; --ink: #0e2830; --ink-2: #46606a; --line: #cbd8da;
  --sea: #1b6f80; --shoal: #d4e8ea; --signal: #d9440e; --on-signal: #ffffff;
  --good: #0f8a5f; --good-bg: #d3eee2; --maybe: #9a6200; --maybe-bg: #f6e7c3; --no: #8798a0; --no-bg: #e1e8ea;
  --bar-bg: #0e2830; --bar-fg: #edf2f2; --pin-idle: #0e2830; --danger: #b3261e;
  --display: 'Archivo', 'Arial Narrow', system-ui, sans-serif;
  --body: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --d-s: #1b6f80; --d-b: #c2185b; --d-l: #e0a100;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --paper: #0a1a20; --card: #102830; --ink: #e6f0f1; --ink-2: #98b2ba; --line: #234450;
    --sea: #6cc6d4; --shoal: #153944; --signal: #ff7a45; --on-signal: #0a1a20;
    --good: #3fcb92; --good-bg: #123f31; --maybe: #e7b54a; --maybe-bg: #43360f; --no: #5f7882; --no-bg: #17313a;
    --bar-bg: #06131a; --bar-fg: #e6f0f1; --pin-idle: #6cc6d4; --danger: #ff8a80;
    --d-s: #6cc6d4; --d-b: #ff5c9d; --d-l: #ffc83d;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--paper); color: var(--ink); font: 15px/1.45 var(--body);
  -webkit-text-size-adjust: 100%; overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--display); font-stretch: 108%; font-weight: 700; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 19px; }
h3 { font-size: 15px; margin: 18px 0 8px; }
h4 { font-size: 13px; margin: 14px 0 6px; color: var(--ink-2); }
p { margin: 0 0 10px; }
a { color: var(--sea); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--sea); outline-offset: 2px; }
.ico { width: 18px; height: 18px; flex: none; }

/* ---------- barre du haut ---------- */
#app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100vh; height: 100dvh; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 16px; padding-top: calc(9px + env(safe-area-inset-top, 0px)); background: var(--bar-bg); color: var(--bar-fg); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 30px; height: 20px; color: var(--sea); }
.brand-name { font-family: var(--display); font-stretch: 125%; font-weight: 800; font-size: 22px; letter-spacing: 0.01em; }
.top-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
.who { font-size: 13.5px; opacity: 0.85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who--local { padding: 3px 9px; border: 1px solid color-mix(in srgb, var(--bar-fg) 35%, transparent); border-radius: 4px; font-size: 12.5px; }

/* ---------- boutons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); cursor: pointer; font-weight: 600; font-size: 14px; line-height: 1.1; }
.btn:hover { border-color: var(--ink-2); }
.btn-primary { background: var(--signal); border-color: var(--signal); color: var(--on-signal); }
.btn-primary:hover { filter: brightness(1.06); border-color: var(--signal); }
.btn-primary[aria-pressed='true'] { box-shadow: 0 0 0 3px color-mix(in srgb, var(--signal) 30%, transparent); }
.btn-small { min-height: 34px; padding: 6px 10px; font-size: 13px; }
.btn-danger { color: var(--danger); }
.btn-bar { background: transparent; color: var(--bar-fg); border-color: color-mix(in srgb, var(--bar-fg) 40%, transparent); min-height: 34px; padding: 5px 10px; font-size: 13px; }
.btn[disabled] { opacity: 0.5; cursor: default; }

/* ---------- mise en page ---------- */
.stage { display: grid; grid-template-columns: minmax(340px, 430px) minmax(0, 1fr); grid-template-areas: 'panel map'; min-height: 0; }
.mapcol { grid-area: map; position: relative; min-height: 0; min-width: 0; }
#map { position: absolute; inset: 0; background: var(--shoal); }
.panel { grid-area: panel; display: flex; flex-direction: column; min-height: 0; min-width: 0; border-right: 1px solid var(--line); background: var(--paper); }
@media (max-width: 820px) {
  .stage { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(210px, 38%) minmax(0, 1fr); grid-template-areas: 'map' 'panel'; }
  .panel { border-right: 0; border-top: 1px solid var(--line); }
}

.searchbar { position: absolute; z-index: 800; top: 10px; left: 10px; right: 56px; max-width: 420px; display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 2px 8px rgb(0 0 0 / 0.18); }
.searchbar input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 10px 12px; font-size: 16px; }
.searchbar input:focus-visible { outline-offset: -2px; }
.searchbar button { border: 0; background: transparent; padding: 0 12px; cursor: pointer; color: var(--ink-2); }
.results { position: absolute; z-index: 801; top: 54px; left: 10px; right: 56px; max-width: 420px; margin: 0; padding: 4px; list-style: none; background: var(--card); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 18px rgb(0 0 0 / 0.25); max-height: 40%; overflow: auto; }
.results button { width: 100%; text-align: left; border: 0; background: transparent; padding: 9px 10px; border-radius: 4px; cursor: pointer; font-size: 14px; }
.results button:hover { background: var(--shoal); }
.results .none { padding: 9px 10px; color: var(--ink-2); }
.mapbtns { position: absolute; z-index: 800; right: 10px; bottom: 30px; display: flex; flex-direction: column; gap: 8px; }
.mapbtns button { width: 42px; height: 42px; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; box-shadow: 0 2px 8px rgb(0 0 0 / 0.2); }
.mapbtns button[aria-pressed='true'] { background: var(--ink); color: var(--paper); }
.banner { position: absolute; z-index: 800; left: 50%; bottom: 30px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 14px; background: var(--ink); color: var(--paper); border-radius: 6px; font-weight: 600; font-size: 14px; box-shadow: 0 4px 14px rgb(0 0 0 / 0.3); max-width: calc(100% - 80px); }
.banner .btn { min-height: 32px; padding: 4px 10px; background: transparent; color: inherit; border-color: color-mix(in srgb, var(--paper) 45%, transparent); }
.fallback { position: absolute; inset: 0; z-index: 700; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--ink-2); background: var(--shoal); }

/* ---------- onglets ---------- */
.tabs { display: flex; border-bottom: 1px solid var(--line); background: var(--card); flex: none; }
.tab { flex: 1; min-height: 44px; padding: 8px 4px; border: 0; border-bottom: 3px solid transparent; background: transparent; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--ink-2); display: flex; align-items: center; justify-content: center; gap: 6px; }
.tab[aria-selected='true'] { color: var(--ink); border-bottom-color: var(--signal); }
.badge { min-width: 18px; padding: 1px 5px; border-radius: 9px; background: var(--signal); color: var(--on-signal); font-size: 11px; font-weight: 700; line-height: 16px; text-align: center; }
.panel-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }

.head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.count { margin-left: 8px; padding: 1px 8px; border-radius: 10px; background: var(--shoal); font-size: 13px; font-family: var(--body); font-stretch: 100%; font-weight: 600; }
.fine { font-size: 12.5px; color: var(--ink-2); }
.muted { color: var(--ink-2); }
.lead { font-size: 15px; color: var(--ink-2); }
.empty { padding: 22px 16px; border: 1px dashed var(--line); border-radius: 8px; color: var(--ink-2); }
.empty h2 { color: var(--ink); margin-bottom: 8px; }
.empty p:last-child { margin-bottom: 0; }
.notice { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; margin-bottom: 8px; background: var(--shoal); border-radius: 6px; font-size: 14px; }
.foot { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.tag { display: inline-block; padding: 1px 7px; border-radius: 4px; background: var(--no-bg); color: var(--ink-2); font-size: 11.5px; font-weight: 600; }
.tag--new { background: var(--signal); color: var(--on-signal); }

/* ---------- spots ---------- */
.spot, .map { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px 12px; margin-bottom: 10px; }
.spot.is-selected, .map.is-open { border-color: var(--sea); box-shadow: 0 0 0 1px var(--sea); }
.spot-main { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; width: 100%; padding: 2px 0 8px; border: 0; background: transparent; cursor: pointer; text-align: left; }
.map-main { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.spot-name { font-family: var(--display); font-stretch: 108%; font-weight: 700; font-size: 17px; }
.spot-coords { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

.strip { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 3px; }
.strip.is-stale { opacity: 0.6; }
.cell { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0 5px; border-radius: 3px; background: var(--no-bg); color: var(--no); min-height: 62px; }
.cell--good { background: var(--good-bg); color: var(--good); }
.cell--maybe { background: var(--maybe-bg); color: var(--maybe); }
.cd { font-size: 11px; color: var(--ink-2); }
.cb { display: flex; align-items: flex-end; width: 46%; height: 24px; }
.cb i { display: block; width: 100%; background: currentColor; border-radius: 2px 2px 0 0; }
.cv { font-family: var(--display); font-stretch: 100%; font-weight: 700; font-size: 12.5px; color: var(--ink); font-variant-numeric: tabular-nums; }
.is-loading .cell { background: linear-gradient(100deg, var(--no-bg) 30%, var(--shoal) 50%, var(--no-bg) 70%); background-size: 300% 100%; animation: sheen 1.4s linear infinite; }
@keyframes sheen { to { background-position: -150% 0; } }
@media (prefers-reduced-motion: reduce) { .is-loading .cell { animation: none; } }
.fc-error { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; border-radius: 6px; background: var(--no-bg); font-size: 13px; }

.detail { margin-top: 12px; }
.days { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.days th { text-align: left; font-weight: 600; padding: 6px 6px 6px 0; white-space: nowrap; }
.days td { padding: 6px 6px; white-space: nowrap; }
.days th small { display: block; margin: 0; font-weight: 400; color: var(--ink-2); }
.days tr { border-top: 1px solid var(--line); }
.days .d--good th, .days .d--good .win { color: var(--good); font-weight: 700; }
.days .d--maybe .win { color: var(--maybe); font-weight: 700; }
.days .d--no { color: var(--ink-2); }
.days .wnd { white-space: nowrap; }
.warrow { width: 13px; height: 13px; vertical-align: -2px; margin-right: 4px; }
.notes { padding: 8px 10px; border-radius: 6px; background: var(--paper); white-space: normal; overflow-wrap: anywhere; }
.photos { display: flex; gap: 6px; overflow-x: auto; margin: 8px 0; }
.photos img { height: 110px; width: auto; border-radius: 4px; flex: none; }
.links { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; }
.links a { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; }

/* ---------- alertes ---------- */
.alist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.al { display: grid; gap: 2px; padding: 10px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
.al-name { font-family: var(--display); font-stretch: 108%; font-weight: 700; font-size: 16px; }
.al-when { font-size: 13px; color: var(--ink-2); }
.al-data { font-size: 13.5px; font-variant-numeric: tabular-nums; }
.al .btn { justify-self: start; margin-top: 6px; }
.al--lead0, .al--lead1 { border-color: var(--good); background: color-mix(in srgb, var(--good-bg) 55%, var(--card)); }

/* ---------- listes de personnes, messages ---------- */
.inline { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; align-items: center; }
.inline input[type='text'], .inline select { flex: 1 1 150px; min-width: 0; }
input[type='text'], input[type='email'], input[type='password'], input[type='url'], input[type='number'], input[type='time'], select, textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); font-size: 16px; }
input.is-bad { border-color: var(--danger); }
.plist { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 6px; }
.plist li { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 8px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; }
.pname { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.pact { display: flex; gap: 6px; flex-wrap: wrap; }
.msg { padding: 10px 12px; margin-bottom: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
.msg.is-new { border-color: var(--signal); }
.in-title { margin: 0 0 4px; }

/* ---------- formulaires et dialogue ---------- */
dialog { padding: 0; border: 0; border-radius: 10px; width: min(560px, calc(100vw - 20px)); max-height: calc(100dvh - 24px); background: var(--card); color: var(--ink); box-shadow: 0 20px 60px rgb(0 0 0 / 0.45); }
dialog::backdrop { background: rgb(6 19 26 / 0.6); }
.dlg { padding: 20px 20px 16px; }
.dlg h2 { margin-bottom: 12px; }
.fld { display: block; margin-bottom: 12px; font-weight: 600; font-size: 13.5px; }
.fld > input, .fld > textarea, .fld > select { display: block; margin-top: 4px; font-weight: 400; }
.fld small, small { display: block; margin-top: 4px; font-weight: 400; font-size: 12.5px; color: var(--ink-2); }
.lbl { display: block; font-weight: 600; font-size: 13.5px; margin-bottom: 4px; }
.row { margin-bottom: 12px; }
.grp { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px 12px; margin: 0 0 14px; }
.grp legend { padding: 0 6px; font-family: var(--display); font-stretch: 108%; font-weight: 700; font-size: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 12px; }
.chk { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 14px; cursor: pointer; }
.chk input { width: 18px; height: 18px; accent-color: var(--signal); }
.chks { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.thumb { position: relative; }
.thumb img { width: 76px; height: 76px; object-fit: cover; border-radius: 6px; display: block; }
.thumb button { position: absolute; top: -6px; right: -6px; width: 24px; height: 24px; padding: 0; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); background: var(--card); cursor: pointer; }
.thumb .ico { width: 13px; height: 13px; }
.form-err { padding: 8px 10px; border-radius: 6px; background: color-mix(in srgb, var(--danger) 14%, var(--card)); color: var(--danger); font-weight: 600; font-size: 13.5px; }
.form-ok { padding: 8px 10px; border-radius: 6px; background: var(--good-bg); color: var(--good); font-weight: 600; font-size: 13.5px; }
.dlg-actions { display: flex; align-items: center; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.sp { flex: 1; }
.seg { display: flex; margin-bottom: 14px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { flex: 1; min-height: 40px; border: 0; background: transparent; cursor: pointer; font-weight: 600; }
.seg button[aria-pressed='true'] { background: var(--ink); color: var(--paper); }
#toast { position: fixed; z-index: 2000; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; padding: 10px 16px; border-radius: 6px; background: var(--ink); color: var(--paper); font-weight: 600; font-size: 14px; max-width: calc(100vw - 32px); text-align: center; transition: opacity 0.2s, transform 0.2s; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.error { background: var(--danger); color: #fff; }
@media (max-width: 480px) { .grid2 { gap: 0 10px; } .dlg { padding: 16px 14px 14px; } }

/* ---------- repères sur la carte ---------- */
.pin-wrap { background: none; border: 0; }
.pin { width: 24px; height: 24px; margin: 4px 2px 0; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--pin-idle); border: 2px solid #fff; box-shadow: 0 1px 5px rgb(0 0 0 / 0.5); }
.pin::after { content: ''; position: absolute; inset: 5px; border-radius: 50%; background: #fff; }
.pin--good { background: var(--good); }
.pin--later { background: var(--maybe); }
.pin--shared { background: var(--sea); border-radius: 4px; transform: rotate(45deg); margin-top: 8px; }
.pin--temp { background: var(--signal); }
.pin.is-selected { transform: rotate(-45deg) scale(1.28); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 35%, transparent), 0 1px 5px rgb(0 0 0 / 0.5); }
.leaflet-container { font-family: var(--body); }
.leaflet-tooltip { font-weight: 600; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) #map[data-layer='osm'] .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.92) contrast(0.88) saturate(0.8); }
}

/* ---------- tutoriel et aide ---------- */
.btn-help { min-width: 34px; padding: 5px 0; border-radius: 50%; font-weight: 800; }
.tour-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.tour-count { font-size: 12.5px; letter-spacing: 0.06em; color: var(--ink-2); font-weight: 600; }
.tour-body { min-height: 190px; }
.howto { margin: 0 0 12px; padding-left: 20px; }
.howto li { margin-bottom: 6px; }
.howto.legend { list-style: none; padding-left: 0; }
.muted { color: var(--ink-2); }
code { padding: 1px 5px; border-radius: 4px; background: var(--shoal); font-size: 0.92em; }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; border: 1px solid var(--line); }
.sw--good { background: var(--good); } .sw--maybe { background: var(--maybe); } .sw--no { background: var(--no); }
.dots { display: flex; gap: 6px; justify-content: center; margin-top: 12px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.dot.on { background: var(--signal); width: 20px; border-radius: 4px; }
.empty .howto { color: var(--ink); }

.tilenote { position: absolute; z-index: 700; left: 12px; right: 12px; bottom: 12px; padding: 10px 12px; border-radius: 6px; background: var(--maybe-bg); color: var(--ink); border: 1px solid var(--maybe); font-size: 13.5px; }

.knote { padding: 10px 12px; border-radius: 6px; background: var(--maybe-bg); border: 1px solid var(--maybe); font-size: 13.5px; }
#searchResults .fine { color: var(--ink-2); font-size: 12px; }

.pin-emoji { position: absolute; left: 14px; top: 13px; transform: translate(-50%, -50%); font-size: 12px; line-height: 1; pointer-events: none; }
.swe { font-size: 15px; vertical-align: -1px; }
.dchip { display: inline-block; width: 11px; height: 11px; margin-right: 7px; background: var(--d-s); border-radius: 50%; vertical-align: -1px; }
.dchip--body { background: var(--d-b); border-radius: 1px; transform: rotate(45deg) scale(.85); }
.dchip--long { background: var(--d-l); border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); }

.kpin-wrap { background: none; border: 0; }
.kpin { width: 16px; height: 16px; margin: 3px; background: var(--d-s); border: 2px solid #fff; border-radius: 50%; box-shadow: 0 1px 4px rgb(0 0 0 / .5); }
.kpin--b { background: var(--d-b); border-radius: 2px; transform: rotate(45deg) scale(.88); }
.kpin--l { width: 20px; height: 18px; margin: 2px; background: var(--d-l); border: 0; border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); box-shadow: none; filter: drop-shadow(0 1px 2px rgb(0 0 0 / .6)); }
.kpin--est { opacity: .72; }
.kpin-emoji { position: absolute; left: 12px; top: -6px; font-size: 13px; line-height: 1; filter: drop-shadow(0 1px 1px rgb(0 0 0 / .5)); pointer-events: none; }
.klabel { padding: 1px 6px; border: 0; border-radius: 3px; background: color-mix(in srgb, var(--card) 88%, transparent); color: var(--ink); font-weight: 600; font-size: 11.5px; box-shadow: 0 1px 3px rgb(0 0 0 / .3); }
.klabel::before { display: none; }
.kfilter { position: absolute; z-index: 700; left: 12px; bottom: 30px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 80px); }
.kf { display: inline-flex; align-items: center; min-height: 32px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); font-size: 13px; font-weight: 600; cursor: pointer; }
.kf[aria-pressed='true'] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.kf .dchip { margin-right: 6px; }
.swe.big { font-size: 24px; }
.kfc-head { display: flex; align-items: center; gap: 8px; margin: 12px 0 6px; }

.sw--s { background: var(--d-s); border-radius: 50%; }
.sw--b { background: var(--d-b); transform: rotate(45deg) scale(.85); border-radius: 2px; }
.sw--l { background: var(--d-l); clip-path: polygon(50% 0, 100% 100%, 0 100%); border: 0; }

/* ---------- mode conditions ---------- */
.modeswitch { position: absolute; z-index: 790; top: 62px; left: 12px; display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--card); box-shadow: 0 1px 4px rgb(0 0 0 / .25); }
.modeswitch button { min-height: 34px; padding: 4px 14px; border: 0; background: transparent; font-size: 13.5px; font-weight: 700; cursor: pointer; }
.modeswitch button[aria-pressed='true'] { background: var(--ink); color: var(--paper); }
.condcanvas { position: absolute; left: 0; top: 0; z-index: 450; pointer-events: none; }
.condparticles { z-index: 451; }
.condpanel { position: absolute; z-index: 780; left: 12px; right: 64px; bottom: 28px; max-width: 560px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: color-mix(in srgb, var(--card) 94%, transparent); box-shadow: 0 2px 10px rgb(0 0 0 / .3); }
.cp-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.cp-row + .cp-row { margin-top: 8px; }
.cp-status { margin-left: auto; font-size: 12px; color: var(--ink-2); }
.cp-time { display: flex; flex: 1 1 220px; align-items: center; gap: 10px; font-weight: 700; font-size: 13.5px; min-width: 0; }
.cp-time input { flex: 1; min-width: 80px; accent-color: var(--signal); }
.cp-legend { gap: 14px; font-size: 12px; color: var(--ink-2); }
.cp-legend .lg { display: inline-flex; align-items: center; gap: 6px; }
.cp-legend { align-items: flex-start; flex-wrap: nowrap; }
.cp-legend .scale { position: relative; flex: 1; min-width: 120px; max-width: 320px; padding-bottom: 14px; }
.cp-legend .bar { display: block; width: 100%; height: 9px; border-radius: 5px; }
.cp-legend .ticks span { position: absolute; top: 11px; transform: translateX(-50%); font-size: 10.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cp-legend .ticks span:first-child { transform: none; }
.cp-legend .ticks span:last-child { transform: translateX(-100%); }
.cp-lbl { font-size: 12px; font-weight: 700; color: var(--ink-2); }
.cp-res .kf { min-height: 28px; padding: 2px 9px; font-size: 12.5px; }
.cp-hint { margin: 6px 0 0; font-size: 12px; color: var(--ink-2); }
.cp-warn { margin: 8px 0 0; padding: 7px 9px; border-radius: 6px; background: var(--maybe-bg); border: 1px solid var(--maybe); font-size: 12.5px; }
dialog.wide { width: min(1080px, calc(100vw - 20px)); }
.wg-sum { width: 100%; height: auto; display: block; margin: 4px 0 8px; }
.wg-sum .sep { stroke: var(--line); stroke-width: 1; }
.wg-sum .dl { font-size: 11px; fill: var(--ink-2); font-weight: 700; }
.wg-sum .ax { font-size: 10px; fill: #c2410c; }
.wg-sum .ax-w { fill: #2563a8; }
.wg-sum .sel-bg { fill: color-mix(in srgb, var(--signal) 14%, transparent); }
.wg-sum .far-bg { fill: color-mix(in srgb, var(--ink) 9%, transparent); }
.wg-sum .wave-a { fill: rgb(61 143 214 / .35); }
.wg-sum .wave-l { fill: none; stroke: #2f7fd0; stroke-width: 1.6; }
.wg-sum .wind-l { fill: none; stroke: #e8822c; stroke-width: 1.8; }
.wg-sum .gust-l { fill: none; stroke: #e8822c; stroke-width: 1; stroke-dasharray: 3 3; opacity: .7; }
.wg-sum .now { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 2 2; }
.wg-days { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
.wg-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table.wgt { border-collapse: collapse; width: max-content; min-width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
table.wgt th, table.wgt td { padding: 4px 3px; text-align: center; min-width: 38px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.wgt small { display: block; font-size: 10px; color: var(--ink-2); font-weight: 600; }
table.wgt td.v small, table.wgt td small { opacity: .85; }
table.wgt .rowh { position: sticky; left: 0; z-index: 2; background: var(--card); text-align: left; min-width: 82px; padding-left: 8px; font-weight: 700; border-right: 1px solid var(--line); }
table.wgt .sec .rowh { position: static; background: var(--paper); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
table.wgt td.v { font-weight: 800; }
table.wgt .night { filter: grayscale(.7) brightness(.82); }
table.wgt th.night, table.wgt td.dr.night, table.wgt td.v2.night { background: color-mix(in srgb, var(--ink) 12%, var(--card)); }
table.wgt .far { opacity: .6; }
table.wgt .cur { outline: 2px solid var(--signal); outline-offset: -2px; }
.ar { display: inline-block; font-style: normal; font-weight: 800; line-height: 1; }
table.cond th, table.cond td { padding: 5px 8px; text-align: left; vertical-align: top; }
table.cond small { color: var(--ink-2); }
.tbl { overflow-x: auto; max-height: 46vh; }
@media (max-width: 520px) { .condpanel { right: 12px; bottom: 12px; } .modeswitch { top: 58px; } }

@media (max-width: 820px) {
  .is-cond .stage { grid-template-rows: minmax(300px, 62%) minmax(0, 1fr); }
  .condpanel { left: 8px; right: 8px; bottom: 8px; padding: 8px 10px; }
  .mapbtns { bottom: 150px; }
  .is-cond .mapbtns { bottom: auto; top: 112px; }
}
@media (max-width: 520px) {
  .cp-legend, .cp-more, .cp-status { display: none; }
  .cp-warn { font-size: 12px; padding: 5px 8px; }
  .cp-row .kf { min-height: 30px; padding: 2px 10px; }
}


/* ---------- onglet week-end ---------- */
.wk-head { display: grid; gap: 10px; padding-bottom: 12px; }
.wk-head h2 { margin: 0; }
.wk-head .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.wk-list { display: grid; gap: 8px; }
.wk { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--line); border-left-width: 4px; border-radius: 8px; background: var(--card); }
.wk--good { border-left-color: var(--sea); }
.wk--maybe { border-left-color: #d9a21b; }
.wk--no { border-left-color: var(--line); opacity: .8; }
.wk-rank { font-weight: 800; font-size: 18px; color: var(--ink-2); text-align: center; }
.wk-name { font-weight: 700; }
.wk-main { min-width: 0; }

.ip-list { max-height: 36vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; margin: 8px 0; }
.ip-row { display: flex; align-items: baseline; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.ip-row:last-child { border-bottom: 0; }
.ip-n { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }

.wgt .rowh.hasdef { cursor: pointer; }

.wg-def { margin: 8px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--paper); border: 1px solid var(--line); font-size: 13px; line-height: 1.45; }

.wg-tide { margin: 8px 0 0; font-size: 13px; line-height: 1.5; }

(function () {

(function () {
  const H = (globalThis.Houle = globalThis.Houle || {});

  const key = (lat, lon) => lat.toFixed(4) + ',' + lon.toFixed(4);

    const e = (table || data)[key(lat, lon)];

  };

  const factor = (ex, dir) => {
    if (!ex || !ex.f || dir == null || isNaN(dir)) return 1;
    const d = ((dir % 360) + 360) % 360;
    const b = Math.floor(d / 10);
    // on prend la direction la plus ouverte des tranches voisines : la houle se courbe un peu
    const km = Math.max(ex.f[b], 0.5 * (ex.f[(b + 35) % 36] + ex.f[(b + 1) % 36]) * 0.9);

    if (km <= CLOSED_KM) return MIN_FACTOR;
    return MIN_FACTOR + ((1 - MIN_FACTOR) * (km - CLOSED_KM)) / (OPEN_KM - CLOSED_KM);
  };

  const attenuate = (hours, ex) => {
    if (!ex) return hours;
    return hours.map((h) => {
      if (h.wave == null) return h;
      const f = factor(ex, h.waveDir);
      return f >= 1 ? h : Object.assign({}, h, { wave: Math.round(h.wave * f * 100) / 100, shelter: f });
    });

      await new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    } catch (e) { mem[k] = v; }
  };

  const clean = (s) => ({
    id: s.id, name: s.name, lat: s.lat, lon: s.lon, notes: s.notes || '', photos: s.photos || [], linkUrl: s.linkUrl || '',
    rules: s.rules || {}, createdAt: s.createdAt || Date.now(), updatedAt: Date.now(),
    ...(s.batch ? { batch: s.batch } : {}), ...(s.quiet ? { quiet: true } : {}),
  });

  const store = {
    mode: 'local',
    social: false,
    async init() { return { user: null }; },
    async listSpots() {
      const list = (await kvGet('spots')) || [];
      return list.map((s) => Object.assign({}, s, { photoCount: (s.photos || []).length }));
    },
    async saveSpot(spot) {
      const list = (await kvGet('spots')) || [];
      const i = list.findIndex((s) => s.id === spot.id);
      const prev = i >= 0 ? list[i] : null;
      const next = clean(Object.assign({}, prev || {}, spot));
      if (i >= 0) list[i] = next; else list.push(next);
      await kvSet('spots', list);
      return Object.assign({}, next, { photoCount: next.photos.length });
    },
    async deleteSpot(id) {
      const list = (await kvGet('spots')) || [];
      await kvSet('spots', list.filter((s) => s.id !== id));
    },
    async getPhotos(id) {
      const list = (await kvGet('spots')) || [];
      const s = list.find((x) => x.id === id);
      return s ? s.photos || [] : [];
    },
    async exportAll() {
      return { app: 'houle', version: 1, exportedAt: new Date().toISOString(), spots: (await kvGet('spots')) || [] };
    },
    async importAll(data) {
      if (!data || data.app !== 'houle' || !Array.isArray(data.spots)) throw new Error('Fichier non reconnu');
      const list = (await kvGet('spots')) || [];
      const ids = new Set(list.map((s) => s.id));
      let added = 0;
      data.spots.forEach((s) => {
        if (s && s.id && !ids.has(s.id) && typeof s.lat === 'number' && typeof s.lon === 'number') { list.push(clean(s)); added++; }
      });
      await kvSet('spots', list);
      return added;
    },
  };

  H.localStore = store;
})();

/* ===== store-supabase ===== */
/* Houle - stockage et social sur Supabase (comptes, amis, partages, cartes communes) */
(function () {
  const H = (globalThis.Houle = globalThis.Houle || {});
  const U = H.util;

  const SDK_URL = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';

  const MESSAGES = [
    [/Invalid login credentials/i, 'E-mail ou mot de passe incorrect.'],
    [/Email not confirmed/i, 'Confirme ton adresse e-mail (lien reçu par mail), puis reconnecte-toi.'],
    [/already registered|already been registered/i, 'Un compte existe déjà avec cet e-mail. Connecte-toi.'],
    [/at least \d+ characters|weak password/i, 'Mot de passe trop court : 6 caractères minimum.'],
    [/valid email|invalid format|Unable to validate email/i, "Cette adresse e-mail n'est pas valide."],
    [/rate limit|too many/i, 'Trop de tentatives. Réessaie dans quelques minutes.'],
    [/Failed to fetch|NetworkError|Load failed/i, 'Connexion au serveur impossible. Vérifie ta connexion internet.'],
    [/row-level security|violates row-level/i, "Action refusée : tu n'as pas les droits pour ça."],
  ];
  const friendly = (err) => {
    const msg = (err && err.message) || String(err);
    for (let i = 0; i < MESSAGES.length; i++) if (MESSAGES[i][0].test(msg)) return new Error(MESSAGES[i][1]);
    return new Error(msg);
  };
  const unwrap = (res) => {
    if (res.error) throw friendly(res.error);
    return res.data;
  };

  function createSupabaseStore(cfg) {
    let sb = null;
    let me = null; // { id, email, username }

    const spotCols = 'id,name,lat,lon,notes,link_url,rules,photo_count,created_at,updated_at';
    const rowToSpot = (r) => ({
      id: r.id, name: r.name, lat: r.lat, lon: r.lon, notes: r.notes || '', linkUrl: r.link_url || '', rules: r.rules || {},
      photoCount: r.photo_count || 0, createdAt: Date.parse(r.created_at) || Date.now(), updatedAt: Date.parse(r.updated_at) || Date.now(),
    });

    async function namesOf(ids) {
      const list = Array.from(new Set(ids.filter(Boolean)));
      if (!list.length) return {};
      const rows = unwrap(await sb.from('profiles').select('id,username').in('id', list));
      const out = {};
      rows.forEach((r) => { out[r.id] = r.username; });
      return out;
    }

    async function loadProfile() {
      const { data, error } = await sb.auth.getUser();
      if (error || !data || !data.user) { me = null; return null; }
      const p = unwrap(await sb.from('profiles').select('id,username').eq('id', data.user.id).maybeSingle());
      me = { id: data.user.id, email: data.user.email, username: p ? p.username : null };
      return me;
    }

    const store = {
      mode: 'supabase',
      social: true,
      get me() { return me; },

      async init() {
        if (!cfg || !cfg.supabaseUrl || !cfg.supabaseAnonKey) throw new Error('Serveur non configuré');
        if (!globalThis.supabase) await U.loadScript(SDK_URL);
        sb = globalThis.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
          auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
        });
        const { data } = await sb.auth.getSession();
        if (!data || !data.session) return { user: null };
        return { user: await loadProfile() };
      },

      /* ----- compte ----- */
      async signUp(email, password) {
        const res = await sb.auth.signUp({ email: email.trim(), password });
        if (res.error) throw friendly(res.error);
        if (res.data && res.data.session) return { user: await loadProfile() };
        return { needsConfirm: true };
      },
      async signIn(email, password) {
        const res = await sb.auth.signInWithPassword({ email: email.trim(), password });
        if (res.error) throw friendly(res.error);
        return { user: await loadProfile() };
      },
      async signOut() { await sb.auth.signOut(); me = null; },
      async createProfile(username) {
        const name = String(username || '').trim().toLowerCase().replace(/^@/, '');
        if (!/^[a-z0-9_]{3,20}$/.test(name)) throw new Error('Pseudo : 3 à 20 caractères, lettres minuscules, chiffres ou _.');
        const { data } = await sb.auth.getUser();
        const res = await sb.from('profiles').insert({ id: data.user.id, username: name });
        if (res.error) {
          if (res.error.code === '23505') throw new Error('Ce pseudo est déjà pris.');
          throw friendly(res.error);
        }
        return loadProfile();
      },

      /* ----- spots (privés : seul le propriétaire les voit) ----- */
      async listSpots() {
        return unwrap(await sb.from('spots').select(spotCols).order('created_at')).map(rowToSpot);
      },
      async saveSpot(spot) {
        const row = {
          id: spot.id, name: spot.name, lat: spot.lat, lon: spot.lon, notes: spot.notes || '', link_url: spot.linkUrl || '',
          rules: spot.rules || {}, updated_at: new Date().toISOString(),
        };
        if (Array.isArray(spot.photos)) row.photos = spot.photos;
        return rowToSpot(unwrap(await sb.from('spots').upsert(row).select(spotCols).single()));
      },
      async deleteSpot(id) { unwrap(await sb.from('spots').delete().eq('id', id)); },
      async getPhotos(id) {
        const r = unwrap(await sb.from('spots').select('photos').eq('id', id).maybeSingle());
        return r && Array.isArray(r.photos) ? r.photos : [];
      },
      async exportAll() {
        const rows = unwrap(await sb.from('spots').select('*').order('created_at'));
        return {
          app: 'houle', version: 1, exportedAt: new Date().toISOString(),
          spots: rows.map((r) => Object.assign(rowToSpot(r), { photos: r.photos || [] })),
        };
      },
      async importAll(data) {
        if (!data || data.app !== 'houle' || !Array.isArray(data.spots)) throw new Error('Fichier non reconnu');
        const rows = data.spots
          .filter((s) => s && s.id && typeof s.lat === 'number' && typeof s.lon === 'number')
          .map((s) => ({ id: s.id, name: String(s.name || 'Spot'), lat: s.lat, lon: s.lon, notes: s.notes || '', link_url: s.linkUrl || '', rules: s.rules || {}, photos: s.photos || [] }));
        if (!rows.length) return 0;
        unwrap(await sb.from('spots').upsert(rows, { onConflict: 'id', ignoreDuplicates: true }));
        return rows.length;
      },

      /* ----- amis ----- */
      async listFriends() {
        const rows = unwrap(await sb.from('friendships').select('id,requester,addressee,status'));
        const otherOf = (r) => (r.requester === me.id ? r.addressee : r.requester);
        const names = await namesOf(rows.map(otherOf));
        const out = { friends: [], incoming: [], outgoing: [] };
        rows.forEach((r) => {
          const item = { friendshipId: r.id, id: otherOf(r), username: names[otherOf(r)] || '?' };
          if (r.status === 'accepted') out.friends.push(item);
          else if (r.addressee === me.id) out.incoming.push(item);
          else out.outgoing.push(item);
        });
        out.friends.sort((a, b) => a.username.localeCompare(b.username));
        return out;
      },
      async requestFriend(username) {
        const u = String(username || '').trim().toLowerCase().replace(/^@/, '');
        if (!u) throw new Error('Saisis un pseudo.');
        const p = unwrap(await sb.from('profiles').select('id,username').eq('username', u).maybeSingle());
        if (!p) throw new Error('Aucun utilisateur avec ce pseudo.');
        if (p.id === me.id) throw new Error("C'est ton propre pseudo.");
        const res = await sb.from('friendships').insert({ addressee: p.id });
        if (res.error) {
          if (res.error.code === '23505') throw new Error('Une demande existe déjà avec ' + p.username + ' (regarde aussi tes demandes reçues).');
          throw friendly(res.error);
        }
        return p.username;
      },
      async respondFriend(friendshipId, accept) {
        if (accept) unwrap(await sb.from('friendships').update({ status: 'accepted' }).eq('id', friendshipId));
        else unwrap(await sb.from('friendships').delete().eq('id', friendshipId));
      },
      async removeFriend(friendshipId) { unwrap(await sb.from('friendships').delete().eq('id', friendshipId)); },

      /* ----- partages envoyés aux amis ----- */
      async sendShares(toIds, kind, payload) {
        if (!toIds.length) return;
        unwrap(await sb.from('shares').insert(toIds.map((to) => ({ to_user: to, kind, payload }))));
      },
      async listInbox() {
        const rows = unwrap(await sb.from('shares').select('id,from_user,kind,payload,seen,created_at').eq('to_user', me.id).order('created_at', { ascending: false }).limit(100));
        const names = await namesOf(rows.map((r) => r.from_user));
        return rows.map((r) => ({ id: r.id, from: names[r.from_user] || '?', kind: r.kind, payload: r.payload || {}, seen: !!r.seen, createdAt: Date.parse(r.created_at) }));
      },
      async markSeen(ids) { if (ids.length) unwrap(await sb.from('shares').update({ seen: true }).in('id', ids)); },
      async deleteShare(id) { unwrap(await sb.from('shares').delete().eq('id', id)); },

      /* ----- cartes communes ----- */
      async listMaps() {
        const maps = unwrap(await sb.from('maps').select('id,name,owner,join_code,created_at').order('created_at'));
        if (!maps.length) return [];
        const mem = unwrap(await sb.from('map_members').select('map_id,user_id,status').in('map_id', maps.map((m) => m.id)));
        const names = await namesOf(mem.map((x) => x.user_id).concat(maps.map((m) => m.owner)));
        return maps.map((m) => {
          const ms = mem.filter((x) => x.map_id === m.id);
          const mine = ms.find((x) => x.user_id === me.id);
          return {
            id: m.id, name: m.name, isOwner: m.owner === me.id, ownerName: names[m.owner] || '?', code: m.join_code,
            myStatus: mine ? mine.status : 'member',
            members: ms.map((x) => ({ id: x.user_id, username: names[x.user_id] || '?', status: x.status })),
          };
        });
      },
      async createMap(name) {
        return unwrap(await sb.from('maps').insert({ name: String(name).trim() }).select('id').single()).id;
      },
      async inviteToMap(mapId, userId) {
        const res = await sb.from('map_members').insert({ map_id: mapId, user_id: userId, status: 'invited' });
        if (res.error) {
          if (res.error.code === '23505') throw new Error('Cette personne est déjà invitée ou membre.');
          throw friendly(res.error);
        }
      },
      async respondInvite(mapId, accept) {
        const q = accept ? sb.from('map_members').update({ status: 'member' }) : sb.from('map_members').delete();
        unwrap(await q.eq('map_id', mapId).eq('user_id', me.id));
      },
      async requestJoin(code) {
        const res = await sb.rpc('request_join', { code: String(code || '').trim() });
        if (res.error) throw friendly(res.error);
        return res.data;
      },
      async respondRequest(mapId, userId, accept) {
        const q = accept ? sb.from('map_members').update({ status: 'member' }) : sb.from('map_members').delete();
        unwrap(await q.eq('map_id', mapId).eq('user_id', userId));
      },
      async removeMember(mapId, userId) { unwrap(await sb.from('map_members').delete().eq('map_id', mapId).eq('user_id', userId)); },
      async deleteMap(mapId) { unwrap(await sb.from('maps').delete().eq('id', mapId)); },
      async listMapSpots(mapId) {
        const rows = unwrap(await sb.from('map_spots').select('id,added_by,snapshot,created_at').eq('map_id', mapId).order('created_at'));
        const names = await namesOf(rows.map((r) => r.added_by));
        return rows.map((r) => ({ id: r.id, addedBy: names[r.added_by] || '?', mine: r.added_by === me.id, snapshot: r.snapshot || {} }));
      },
      async addSpotToMap(mapId, spot, hideDescription) {
        const snapshot = {
          name: spot.name, lat: spot.lat, lon: spot.lon, notes: hideDescription ? '' : spot.notes || '',
          linkUrl: spot.linkUrl || '', rules: spot.rules || {}, hiddenDescription: !!hideDescription,
        };
        unwrap(await sb.from('map_spots').insert({ map_id: mapId, snapshot }));
      },
      async removeMapSpot(id) { unwrap(await sb.from('map_spots').delete().eq('id', id)); },
    };
    return store;
  }

  H.createSupabaseStore = createSupabaseStore;
})();

/* ===== map ===== */
/* Houle - carte (Leaflet + OpenStreetMap / satellite Esri) */
(function () {
  const H = (globalThis.Houle = globalThis.Houle || {});

  function createMap(el, handlers) {
    const L = globalThis.L;
    const noop = () => {};
    if (!L) {
      return { ready: false, setKnown: noop, setKnownFilter: noop, setKnownEmoji: noop, setKnownVisible: noop, setSpots: noop, setShared: noop, flyTo: noop, setTempPin: noop, fitAll: noop, toggleSatellite: noop, invalidate: noop, locate: () => Promise.reject(new Error('Carte indisponible')) };
    }

    const map = L.map(el, { zoomControl: false, worldCopyJump: true, preferCanvas: true }).setView([40, -4], 4);
    L.control.zoom({ position: 'topright' }).addTo(map);
    // Fonds de carte sans clé d'accès. OpenStreetMap refuse les fichiers ouverts depuis l'ordinateur
    // (pas d'adresse d'origine) : on l'utilise seulement quand l'appli est en ligne (http/https).
    const online = /^https?:$/.test(location.protocol);
    const OSM = { url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', opt: { maxZoom: 19, attribution: '&copy; contributeurs <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>' } };
    const ESRI_ST = { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', opt: { maxZoom: 19, attribution: 'Fond &copy; Esri, HERE, Garmin, OpenStreetMap' } };
    const TOPO = { url: 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', opt: { subdomains: 'abc', maxZoom: 17, attribution: '&copy; OpenStreetMap, SRTM | OpenTopoMap' } };
    const CHAIN = online ? [OSM, ESRI_ST, TOPO] : [ESRI_ST, TOPO];
    let idx = 0;
    const mk = (c) => L.tileLayer(c.url, c.opt);
    let osm = mk(CHAIN[0]);
    const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Imagery &copy; Esri' });
    let errs = 0;
    const note = document.createElement('div');
    note.className = 'tilenote'; note.hidden = true;
    note.textContent = 'Le fond de carte ne se charge pas. Essaie la vue satellite (bouton couches), vérifie ta connexion, ou ouvre le fichier dans Chrome / Safari / Edge plutôt que dans un aperçu.';
    el.parentNode.appendChild(note);
    const okTile = () => { note.hidden = true; };
    function watch(layer) {
      layer.on('tileload', okTile);
      layer.on('tileerror', function () {
        if (++errs < 4) return;
        errs = 0;
        if (idx >= CHAIN.length - 1) { note.hidden = false; return; }
        idx++;
        const wasOn = map.hasLayer(osm);
        map.removeLayer(osm);
        osm = mk(CHAIN[idx]);
        watch(osm);
        if (wasOn) osm.addTo(map);
      });
    }
    sat.on("tileerror", function () { if (++errs >= 4) { errs = 0; note.hidden = false; } });
    sat.on('tileload', okTile);
    watch(osm);
    osm.addTo(map);
    el.dataset.layer = 'osm';

    const pinIcon = (cls, selected, emoji) =>
      L.divIcon({ className: 'pin-wrap', html: '<div class="pin ' + cls + (selected ? ' is-selected' : '') + '"></div>' + (emoji ? '<span class="pin-emoji">' + emoji + '</span>' : ''), iconSize: [28, 36], iconAnchor: [14, 34] });

    let markers = {}, sharedMarkers = [], temp = null, knownLayer = null, knownOn = true;

    let knownList = [], knownMarkers = [], knownShow = () => true, knownEmoji = {};
    const knownIcon = (k, i) => L.divIcon({
      className: 'kpin-wrap',
      html: '<div class="kpin kpin--' + k.p + (k.est ? ' kpin--est' : '') + '"></div>' + (knownEmoji[i] ? '<span class="kpin-emoji">' + knownEmoji[i] + '</span>' : ''),
      iconSize: [22, 22], iconAnchor: [11, 11],
    });
    function relabel() {
      const z = map.getZoom();
      const bounds = map.getBounds ? map.getBounds() : null;
      let n = 0;
      knownMarkers.forEach((m, i) => {
        if (!m) return;
        const want = z >= 11 && knownShow(knownList[i]) && knownOn && (!bounds || bounds.contains(m.getLatLng())) && n < 90;
        if (want) n++;
        if (want === !!m.__lab) return;
        m.__lab = want;
        m.unbindTooltip();
        m.bindTooltip(knownList[i].name, want ? { permanent: true, direction: 'right', offset: [8, 0], className: 'klabel' } : { direction: 'top', offset: [0, -8] });
      });
    }
    function setKnown(list) {
      if (knownLayer) map.removeLayer(knownLayer);
      knownLayer = L.layerGroup();
      knownList = list;
      knownMarkers = list.map((k, i) => {
        const m = L.marker([k.lat, k.lon], { icon: knownIcon(k, i), title: k.name, keyboard: true, riseOnHover: true });
        m.bindTooltip(k.name, { direction: 'top', offset: [0, -8] });
        m.on('click', () => handlers.onKnownClick(i));
        return m;
      });
      applyKnownFilter();
      if (knownOn) knownLayer.addTo(map);
      map.on('zoomend moveend', relabel);
      relabel();
    }
    function applyKnownFilter() {
      if (!knownLayer) return;
      knownMarkers.forEach((m, i) => {
        const on = knownShow(knownList[i]);
        if (on) { if (!knownLayer.hasLayer || !knownLayer.hasLayer(m)) m.addTo(knownLayer); } else if (knownLayer.removeLayer) knownLayer.removeLayer(m);
      });
    }
    function setKnownFilter(pred) { knownShow = pred || (() => true); applyKnownFilter(); relabel(); }
    function setKnownEmoji(i, emoji) {
      knownEmoji[i] = emoji;
      if (knownMarkers[i] && knownMarkers[i].setIcon) knownMarkers[i].setIcon(knownIcon(knownList[i], i));
    }
    function setKnownVisible(on) {
      knownOn = !!on;
      if (!knownLayer) return;
      if (knownOn) knownLayer.addTo(map); else map.removeLayer(knownLayer);
      relabel();
    }

    function setSpots(spots, stateOf, selectedId, emojiOf) {
      Object.keys(markers).forEach((id) => map.removeLayer(markers[id]));
      markers = {};
      spots.forEach((s) => {
        const m = L.marker([s.lat, s.lon], { icon: pinIcon('pin--' + (stateOf(s.id) || 'idle'), s.id === selectedId, emojiOf ? emojiOf(s.id) : ''), title: s.name, keyboard: true });
        m.bindTooltip(s.name, { direction: 'top', offset: [0, -30] });
        m.on('click', () => handlers.onSpotClick(s.id));
        m.addTo(map);
        markers[s.id] = m;
      });
    }

    function setShared(list) {
      sharedMarkers.forEach((m) => map.removeLayer(m));
      sharedMarkers = list.map((s) => {
        const m = L.marker([s.lat, s.lon], { icon: pinIcon('pin--shared', false), title: s.name });
        m.bindTooltip(s.name + ' (carte commune)', { direction: 'top', offset: [0, -30] });
        m.on('click', () => handlers.onSharedClick(s.key));
        m.addTo(map);
        return m;
      });
    }

    function setTempPin(lat, lon) {
      if (temp) { map.removeLayer(temp); temp = null; }
      if (lat == null) return;
      temp = L.marker([lat, lon], { icon: pinIcon('pin--temp', false), draggable: true, zIndexOffset: 1000, title: 'Nouveau spot' });
      temp.on('dragend', () => { const p = temp.getLatLng(); handlers.onTempMove(p.lat, p.lng); });
      temp.addTo(map);
    }

    function flyTo(lat, lon, zoom) {
      map.flyTo([lat, lon], zoom || Math.max(map.getZoom(), 13), { duration: 0.8 });
    }

    function fitAll(points) {
      if (!points.length) return;
      if (points.length === 1) return map.setView([points[0].lat, points[0].lon], 12);
      map.fitBounds(L.latLngBounds(points.map((p) => [p.lat, p.lon])), { padding: [40, 40], maxZoom: 12 });
    }

    function toggleSatellite() {
      const isSat = map.hasLayer(sat);
      if (isSat) { map.removeLayer(sat); osm.addTo(map); } else { map.removeLayer(osm); sat.addTo(map); }
      el.dataset.layer = isSat ? 'osm' : 'sat';
      return !isSat;
    }

    function locate() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) return reject(new Error('Position non disponible sur cet appareil'));
        navigator.geolocation.getCurrentPosition(
          (p) => resolve({ lat: p.coords.latitude, lon: p.coords.longitude }),
          () => reject(new Error("Position refusée ou indisponible. Vérifie l'autorisation du navigateur.")),
          { enableHighAccuracy: true, timeout: 15000 }
        );
      });
    }

    map.on('click', (e) => handlers.onMapClick(e.latlng.lat, e.latlng.lng));

    return { ready: true, raw: map, setKnown, setKnownFilter, setKnownEmoji, setKnownVisible, setSpots, setShared, flyTo, setTempPin, fitAll, toggleSatellite, locate, invalidate: () => map.invalidateSize() };
  }

  H.createMap = createMap;
})();

/* ===== app-core ===== */
/* Houle - noyau de l'interface : état, démarrage, carte, prévisions, alertes */
(function () {
  const H = (globalThis.Houle = globalThis.Houle || {});
  const U = H.util, F = H.forecast;
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

  const A = (H.app = {
    $, $$,
    S: {
      store: null, mode: 'local', me: null,
      spots: [], fc: {}, selectedId: null, tab: 'spots', adding: false, alerts: [], upcoming: [],
      friends: { friends: [], incoming: [], outgoing: [] }, inbox: [], maps: [], openMapId: null, mapSpots: {},
      mapObj: null, bootError: null,
    },
    actions: {}, renderers: {},
  });
  const S = A.S;

  /* ---------- icônes ---------- */
  const ICONS = {
    plus: '<path d="M12 5v14M5 12h14"/>',
    locate: '<circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4"/>',
    search: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/>',
    layers: '<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',
    share: '<circle cx="6" cy="12" r="2.4"/><circle cx="18" cy="6" r="2.4"/><circle cx="18" cy="18" r="2.4"/><path d="M8.1 10.9l7.8-3.8M8.1 13.1l7.8 3.8"/>',
    edit: '<path d="M4 20l1-4L16.5 4.5a2 2 0 013 3L8 19l-4 1z"/>',
    link: '<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>',
    x: '<path d="M6 6l12 12M18 6L6 18"/>',
    bell: '<path d="M6 17V11a6 6 0 1112 0v6l1.5 2h-15L6 17z"/><path d="M10 21h4"/>',
    arrow: '<path d="M12 4v16M6 14l6 6 6-6"/>',
  };
  A.icon = (n, cls) => '<svg class="ico ' + (cls || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[n] || '') + '</svg>';
  A.windArrow = (deg) => (deg == null ? '' : '<svg class="warrow" viewBox="0 0 24 24" style="transform:rotate(' + Math.round(deg + 180) + 'deg)" aria-hidden="true"><path d="M12 3v15M6.5 12.5L12 18l5.5-5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>');

  /* ---------- toast + dialogue ---------- */
  let toastTimer = null;
  A.toast = (msg, kind) => {
    const t = $('#toast');
    t.textContent = msg;
    t.className = 'show' + (kind === 'error' ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = ''; }, kind === 'error' ? 6000 : 3200);
  };
  A.fail = (e) => A.toast((e && e.message) || 'Une erreur est survenue.', 'error');

  A.dialog = {
    open(html, mount, opts) {
      const d = $('#dlg');
      d.innerHTML = html;
      d.dataset.locked = opts && opts.locked ? '1' : '';
      const h = (opts && opts.onclose) || null;
      d.__h = h;
      d.onclose = () => { if (d.__pending > 0) { d.__pending--; return; } d.__h = null; if (h) h(); };
      if (!d.open) d.showModal();
      if (mount) mount(d);
      return d;
    },
    // le gestionnaire de fermeture s'exécute tout de suite : l'événement natif « close » arrive plus tard
    // et viendrait sinon éteindre la fenêtre suivante ouverte dans la foulée.
    close() { const d = $('#dlg'); if (!d.open) return; const h = d.__h; d.__h = null; d.__pending = (d.__pending || 0) + 1; d.close(); if (h) h(); },
  };

  /* ---------- prévisions et alertes ---------- */
  A.daysAhead = (days, d) => U.daysBetween(days[0].date, d.date);

  A.spotState = (id) => {
    const f = S.fc[id];
    if (!f || f.status !== 'ok') return 'idle';
    const next = f.days.find((d) => d.status === 'good');
    if (!next) return 'idle';
    const n = A.daysAhead(f.days, next);
    return n <= 3 ? 'good' : 'later';
  };

  function computeAlerts() {
    const alerts = [], upcoming = [];
    S.spots.forEach((s) => {
      const f = S.fc[s.id];
      if (!f || f.status !== 'ok') return;
      alerts.push.apply(alerts, F.alertsFor(s, f.days));
      f.days.forEach((d) => { if (d.status === 'good') upcoming.push({ spot: s, day: d, lead: A.daysAhead(f.days, d) }); });
    });
    alerts.sort((a, b) => a.lead - b.lead || a.spotName.localeCompare(b.spotName));
    upcoming.sort((a, b) => a.day.date.localeCompare(b.day.date) || a.spot.name.localeCompare(b.spot.name));
    S.alerts = alerts;
    S.upcoming = upcoming;
  }

  function notifyNew() {
    if (!('Notification' in globalThis) || Notification.permission !== 'granted') return;
    let seen = [];
    try { seen = JSON.parse(localStorage.getItem('houle.notified') || '[]'); } catch (e) { /* ignore */ }
    S.alerts.forEach((a) => {
      if (seen.indexOf(a.key) !== -1) return;
      try { new Notification('Houle', { body: F.alertText(a) }); } catch (e) { /* ignore */ }
      seen.push(a.key);
    });
    try { localStorage.setItem('houle.notified', JSON.stringify(seen.slice(-300))); } catch (e) { /* ignore */ }
  }

  async function loadForecast(spot, force) {
    S.fc[spot.id] = Object.assign({}, S.fc[spot.id], { status: 'loading' });
    A.scheduleRender();
    try {
      const data = await F.getForecast(spot.lat, spot.lon, { force: !!force });
      S.fc[spot.id] = { status: 'ok', days: F.evaluateSpot(data, spot.rules), fetchedAt: data.fetchedAt };
    } catch (e) {
      S.fc[spot.id] = { status: 'error', error: e.message };
    }
  }

  A.recompute = () => { computeAlerts(); A.render(); };

  A.refreshForecasts = async (force, only) => {
    const list = (only ? [only] : S.spots.filter((x) => !x.quiet)).slice();
    let i = 0;
    const worker = async () => { while (i < list.length) { const s = list[i++]; await loadForecast(s, force); } };
    await Promise.all([worker(), worker(), worker()]);
    computeAlerts();
    notifyNew();
    A.scheduleRender();
  };

  /* ---------- carte ---------- */
  A.syncMap = () => {
    const m = S.mapObj;
    if (!m || !m.ready) return;
    m.setSpots(S.spots, A.spotState, S.selectedId, A.emojiForSpot);
    const open = S.openMapId && S.mapSpots[S.openMapId];
    m.setShared(open ? open.map((x) => ({ key: x.id, name: x.snapshot.name || 'Spot', lat: x.snapshot.lat, lon: x.snapshot.lon })) : []);
  };

  A.selectSpot = (id, fly) => {
    S.selectedId = id;
    S.tab = 'spots';
    const s = S.spots.find((x) => x.id === id);
    if (s && fly && S.mapObj) S.mapObj.flyTo(s.lat, s.lon, 13);
    A.render();
    const card = $('[data-spot="' + id + '"]');
    if (card && card.scrollIntoView) card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  };

  A.startAdd = () => {
    S.adding = true;
    $('#addBanner').hidden = false;
    $('#btnAdd') && $('#btnAdd').setAttribute('aria-pressed', 'true');
  };
  A.stopAdd = () => {
    S.adding = false;
    $('#addBanner').hidden = true;
    $('#btnAdd') && $('#btnAdd').setAttribute('aria-pressed', 'false');
  };

  /* ---------- rendu ---------- */
  const TABS = [
    { id: 'spots', label: 'Spots' },
    { id: 'alerts', label: 'Alertes' },
    { id: 'weekend', label: 'Week-end' },
    { id: 'friends', label: 'Amis', social: true },
    { id: 'maps', label: 'Cartes', social: true },
    { id: 'inbox', label: 'Reçu', social: true },
  ];

  A.badges = () => ({
    alerts: S.alerts.filter((a) => a.lead <= 1).length,
    friends: S.friends.incoming.length,
    maps: S.maps.filter((m) => m.myStatus === 'invited').length + S.maps.reduce((n, m) => n + (m.isOwner ? m.members.filter((x) => x.status === 'requested').length : 0), 0),
    inbox: S.inbox.filter((x) => !x.seen).length,
  });

  function renderTop() {
    const el = $('#topRight');
    const help = '<button class="btn btn-bar btn-help" data-act="tour" aria-label="Aide et tutoriel" title="Aide et tutoriel">?</button>';
    if (S.mode === 'supabase' && S.me) {
      el.innerHTML = '<span class="who">@' + U.esc(S.me.username || '…') + '</span>' + help + '<button class="btn btn-bar" data-act="logout">Se déconnecter</button>';
    } else if (S.mode === 'supabase') {
      el.innerHTML = '';
    } else {
      el.innerHTML = '<span class="who who--local" title="Tes spots sont enregistrés dans ce navigateur">Sur cet appareil</span>' + help;
    }
  }

  function renderTabs() {
    const b = A.badges();
    $('#tabs').innerHTML = TABS.filter((t) => !t.social || (S.store && S.store.social)).map((t) => {
      const n = b[t.id] || 0;
      return '<button role="tab" class="tab" data-act="tab" data-tab="' + t.id + '" aria-selected="' + (S.tab === t.id) + '">' + t.label + (n ? '<span class="badge">' + n + '</span>' : '') + '</button>';
    }).join('');
  }

  /* un rendu ne doit jamais effacer ce que la personne est en train de saisir */
  const snapInputs = (root) => {
    const snap = {}, active = document.activeElement;
    root.querySelectorAll('input[id],select[id],textarea[id]').forEach((el) => {
      snap[el.id] = { value: el.value, checked: el.checked, focus: el === active, start: el.selectionStart, end: el.selectionEnd };
    });
    return snap;
  };
  const restoreInputs = (root, snap) => {
    Object.keys(snap).forEach((id) => {
      const el = root.querySelector('#' + (globalThis.CSS && CSS.escape ? CSS.escape(id) : id));
      if (!el) return;
      const v = snap[id];
      if (el.type === 'checkbox' || el.type === 'radio') el.checked = v.checked; else if (v.value !== '' || el.tagName !== 'SELECT') el.value = v.value;
      if (v.focus) { el.focus(); try { el.setSelectionRange(v.start, v.end); } catch (e) { /* champ sans sélection */ } }
    });
  };

  A.render = () => {
    renderTop();
    renderTabs();
    const body = $('#panelBody');
    const keepScroll = body.scrollTop;
    const snap = snapInputs(body);
    const r = A.renderers[S.tab];
    body.innerHTML = r ? r() : '';
    restoreInputs(body, snap);
    body.scrollTop = keepScroll;
    A.syncMap();
  };
  let raf = 0;
  A.scheduleRender = () => {
    if (raf) return;
    raf = requestAnimationFrame(() => { raf = 0; A.render(); });
  };

  A.lockedPanel = (what) =>
    '<div class="empty"><h2>' + U.esc(what) + '</h2><p>Cette partie a besoin d\'un compte. Elle s\'active quand l\'appli est reliée à son serveur (voir le guide <b>LISEZ-MOI</b>, étape 2). Tes spots et tes alertes fonctionnent déjà sans.</p></div>';

  /* ---------- clics du panneau ---------- */
  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-act]');
    if (!el) return;
    const fn = A.actions[el.dataset.act];
    if (fn) { ev.preventDefault(); Promise.resolve(fn(el, ev)).catch(A.fail); }
  });

  A.actions.tab = (el) => {
    S.tab = el.dataset.tab;
    A.render();
    if (S.mapObj && S.mapObj.ready) setTimeout(S.mapObj.invalidate, 50);
    if (S.mode === 'supabase' && ['friends', 'maps', 'inbox'].indexOf(S.tab) !== -1) A.refreshSocial();
  };

  /* ---------- données sociales ---------- */
  A.refreshSocial = async () => {
    if (!S.store || !S.store.social || !S.me || !S.me.username) return;
    try {
      const [f, inbox, maps] = await Promise.all([S.store.listFriends(), S.store.listInbox(), S.store.listMaps()]);
      if (S.openMapId && !maps.find((m) => m.id === S.openMapId)) S.openMapId = null;
      const mapSpots = S.openMapId ? await S.store.listMapSpots(S.openMapId) : null;
      const sig = JSON.stringify([f, inbox.map((x) => [x.id, x.seen]), maps, mapSpots]);
      if (sig === S.socialSig) return; // rien de nouveau : on ne redessine pas
      S.socialSig = sig;
      S.friends = f; S.inbox = inbox; S.maps = maps;
      if (mapSpots) S.mapSpots[S.openMapId] = mapSpots;
      A.scheduleRender();
    } catch (e) { /* hors-ligne : on garde l'état précédent */ }
  };

  /* ---------- démarrage ---------- */
  async function afterLogin() {
    S.me = S.store.me || null;
    S.spots = await S.store.listSpots();
    A.render();
    if (S.mapObj && S.mapObj.ready) S.mapObj.fitAll(S.spots);
    A.refreshForecasts(false);
    if (S.store.social) A.refreshSocial();
    if (A.hasLink && A.hasLink()) A.handleLink();
    else if (A.maybeTour) setTimeout(A.maybeTour, 400);
  }
  A.afterLogin = afterLogin;

  A.useLocalMode = async () => {
    S.mode = 'local';
    S.store = H.localStore;
    S.bootError = null;
    A.dialog.close();
    await afterLogin();
  };

  A.boot = async function () {
    // appli installable et utilisable hors connexion (seulement quand elle est servie en https ou en local)
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && /houle\.html$|\/$/.test(location.pathname)) navigator.serviceWorker.register('sw.js').catch(() => {});
    const cfg = globalThis.HOULE_CONFIG || {};
    S.mapObj = H.createMap($('#map'), {
      onSpotClick: (id) => A.selectSpot(id, false),
      onKnownClick: (i) => A.showKnown(i, false),
      onSharedClick: (key) => A.actions.showShared({ dataset: { id: key } }),
      onMapClick: (lat, lon) => { if (S.adding) A.openSpotDialog(null, { lat, lon }); else if (A.cond && A.cond.active) A.cond.click(lat, lon); },
      onTempMove: (lat, lon) => A.onTempMove && A.onTempMove(lat, lon),
    });
    if (!S.mapObj.ready) $('#mapFallback').hidden = false;
    else if (A.initKnown) A.initKnown();

    S.mode = cfg.supabaseUrl && cfg.supabaseAnonKey ? 'supabase' : 'local';
    renderTop(); renderTabs();
    $('#panelBody').innerHTML = '<div class="empty"><p>Chargement…</p></div>';

    if (S.mode === 'local') {
      S.store = H.localStore;
      await afterLogin();
    } else {
      S.store = H.createSupabaseStore(cfg);
      try {
        const r = await S.store.init();
        if (!r.user) A.openAuth();
        else if (!r.user.username) A.openUsername();
        else await afterLogin();
      } catch (e) {
        S.bootError = e.message;
        A.openAuthError(e.message);
      }
    }

    setInterval(() => { if (!document.hidden && S.spots.length) A.refreshForecasts(false); }, 30 * 60 * 1000);
    setInterval(() => { if (!document.hidden && S.store && S.store.social && S.me) A.refreshSocial(); }, 60 * 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden && S.store && S.store.social && S.me) A.refreshSocial(); });
    window.addEventListener('resize', () => S.mapObj && S.mapObj.invalidate());
  };
})();

/* ===== app-spots ===== */
/* Houle - onglets Spots et Alertes, fiche d'un spot, recherche, sauvegarde */
(function () {
  const H = (globalThis.Houle = globalThis.Houle || {});
  const A = H.app, U = H.util, F = H.forecast, S = A.S, $ = A.$;
  const esc = U.esc;

  const photoCache = {}; // id -> tableau de photos (chargées à la demande)
  const photoLoading = {};

  const windyUrl = (s) => {
    const la = s.lat.toFixed(3), lo = s.lon.toFixed(3);
    return 'https://www.windy.com/' + la + '/' + lo + '?waves,' + la + ',' + lo + ',10';
  };

  /* ---------- bandeau de 8 jours ---------- */
  function dayLabel(d, days) {
    const n = A.daysAhead(days, d);
    return U.fmtDay(d.date) + (n === 0 ? " (aujourd'hui)" : n === 1 ? ' (demain)' : '');
  }
  function dayHead(d, days) {
    const n = A.daysAhead(days, d);
    return esc(U.fmtDay(d.date)) + (n === 0 ? '<small>aujourd\'hui</small>' : n === 1 ? '<small>demain</small>' : '');
  }
  function cell(d, days, i) {
    const h = Math.max(10, Math.min(100, Math.round(((d.waveMax || 0) / 4) * 100)));
    const status = d.status === 'good' ? 'session possible' : d.status === 'maybe' ? 'créneau court' : 'pas de session';
    return '<div class="cell cell--' + d.status + '" role="img" aria-label="' + esc(dayLabel(d, days) + ' : ' + status + ', houle ' + U.num(d.stats.wave) + ' m') + '" title="' + esc(dayLabel(d, days) + ' : ' + status) + '">' +
      '<span class="cd">' + (i === 0 ? 'auj.' : esc(U.weekdayShort(d.date))) + '</span><span class="cb"><i style="height:' + h + '%"></i></span><span class="cv">' + U.num(d.stats.wave) + '</span></div>';
  }
  function strip(s) {
    const f = S.fc[s.id];
    if (!f || f.status === 'loading' && !f.days) return '<div class="strip is-loading" aria-label="Chargement de la prévision">' + '<div class="cell"></div>'.repeat(8) + '</div>';
    if (f.status === 'error') return '<div class="fc-error"><span>' + esc(f.error) + '</span><button class="btn btn-small" data-act="retry" data-id="' + esc(s.id) + '">Réessayer</button></div>';
    return '<div class="strip' + (f.status === 'loading' ? ' is-stale' : '') + '">' + f.days.map((d, i) => cell(d, f.days, i)).join('') + '</div>';
  }

  const DISC = { s: ['Surf', 'surf'], b: ['Bodyboard', 'body'], l: ['Longboard', 'long'] };
  const TIDE = { low: 'marée basse', mid: 'mi-marée', high: 'marée haute', all: 'toutes marées' };
  const tideTxt = (s) => (s.rules && TIDE[s.rules.tide] ? ' · ' + TIDE[s.rules.tide] : '');
  const discChip = (s) => { const k = (s.rules && s.rules.disc) || 's'; return '<i class="dchip dchip--' + DISC[k][1] + '" title="' + DISC[k][0] + '"></i>'; };
  const emojiOf = (s) => { const f = S.fc[s.id]; if (!f || !f.days) return ''; const e = F.swellEmoji(f.days); return ' <span class="swe" title="' + esc(e.label + ' (' + U.num(e.wave) + ' m)') + '">' + e.emoji + '</span>'; };
  A.emojiForSpot = (id) => { const f = S.fc[id]; return f && f.days ? F.swellEmoji(f.days).emoji : ''; };

  function detail(s) {
    const f = S.fc[s.id];
    let out = '<div class="detail">';
    if (f && f.days) {
      out += '<table class="days"><tbody>' + f.days.map((d) => {
        const lab = dayHead(d, f.days);
        if (d.status === 'no') return '<tr class="d--no"><th scope="row">' + lab + '</th><td colspan="3" class="why">' + esc(F.failText(d) || 'Conditions non réunies') + '</td></tr>';
        return '<tr class="d--' + d.status + '"><th scope="row">' + lab + '</th><td class="win">' + esc(F.windowText(d.window)) + '</td><td>' + U.num(d.stats.wave) + ' m · ' + U.num(d.stats.period, 0) + ' s</td><td class="wnd">' + A.windArrow(d.stats.windDir) + U.num(d.stats.wind, 0) + ' km/h ' + esc(U.compass(d.stats.windDir)) + '</td></tr>';
      }).join('') + '</tbody></table>';
      out += '<p class="fine">Houle du modèle Open-Meteo (large, pas sur le pic). Les vagues réelles dépendent aussi de la marée et de l\'exposition du spot.</p>';
    }
    if (s.notes) out += '<p class="notes">' + esc(s.notes).replace(/\n/g, '<br>') + '</p>';
    const ph = photoCache[s.id];
    if (s.photoCount && !ph) out += '<p class="fine">Chargement des photos…</p>';
    if (ph && ph.length) out += '<div class="photos">' + ph.map((p) => (U.safeImg(p) ? '<img src="' + U.safeImg(p) + '" alt="Photo du spot ' + esc(s.name) + '">' : '')).join('') + '</div>';
    const links = [];
    const own = U.safeUrl(s.linkUrl);
    if (own) links.push('<a href="' + esc(own) + '" target="_blank" rel="noopener noreferrer">' + A.icon('link') + 'Ma prévision</a>');
    links.push('<a href="' + esc(windyUrl(s)) + '" target="_blank" rel="noopener noreferrer">' + A.icon('link') + 'Windy sur ce point</a>');
    out += '<div class="links">' + links.join('') + '</div>';
    out += '<div class="actions">' +
      '<button class="btn btn-small" data-act="edit" data-id="' + esc(s.id) + '">' + A.icon('edit') + 'Modifier</button>' +
      (s.quiet ? '<button class="btn btn-small btn-primary" data-act="followSpot" data-id="' + esc(s.id) + '">Suivre (alertes)</button>' : '') +
      '<button class="btn btn-small" data-act="linkSpot" data-id="' + esc(s.id) + '">' + A.icon('link') + 'Lien</button>' +
      (S.store.social ? '<button class="btn btn-small" data-act="shareSpot" data-id="' + esc(s.id) + '">' + A.icon('share') + 'Partager</button>' : '') +
      (S.store.social ? '<button class="btn btn-small" data-act="toMap" data-id="' + esc(s.id) + '">Ajouter à une carte</button>' : '') +
      '<button class="btn btn-small" data-act="retry" data-id="' + esc(s.id) + '">Actualiser</button></div>';
    return out + '</div>';
  }

  A.renderers.spots = () => {
    let out = '<div class="head"><h2>Mes spots<span class="count">' + S.spots.length + '</span></h2>' +
      '<button class="btn btn-primary" id="btnAdd" data-act="add" aria-pressed="' + S.adding + '">' + A.icon('plus') + 'Ajouter un spot</button></div>';
    if (!S.spots.length) {
      out += '<div class="empty"><h2>Place ton premier spot</h2><ol class="howto"><li>Appuie sur <b>« Ajouter un spot »</b> ci-dessus.</li><li><b>Touche la carte</b> à l\'endroit exact (tu pourras déplacer le repère), ou colle des coordonnées GPS dans la barre de recherche.</li><li>Donne-lui un nom et règle tes conditions idéales : Houle te prévient quand elles arrivent.</li></ol><button class="btn btn-small" data-act="tour">Voir le tutoriel</button></div>';
    }
    S.spots.forEach((s) => {
      const sel = s.id === S.selectedId;
      if (sel && s.photoCount && !photoCache[s.id] && !photoLoading[s.id]) {
        photoLoading[s.id] = true;
        S.store.getPhotos(s.id).then((p) => { photoCache[s.id] = p; }).catch(() => { photoCache[s.id] = []; }).then(() => { photoLoading[s.id] = false; A.scheduleRender(); });
      }
      out += '<article class="spot' + (sel ? ' is-selected' : '') + '" data-spot="' + esc(s.id) + '">' +
        '<button class="spot-main" data-act="select" data-id="' + esc(s.id) + '" aria-expanded="' + sel + '"><span class="spot-name">' + discChip(s) + esc(s.name) + emojiOf(s) + '</span><span class="spot-coords">' + esc(U.fmtCoords(s.lat, s.lon) + tideTxt(s)) + '</span></button>' +
        strip(s) + (sel ? detail(s) : '') + '</article>';
    });
    out += '<div class="foot"><p class="fine">' + (S.mode === 'local' ? 'Tes spots sont enregistrés sur cet appareil, dans ce navigateur. Exporte une sauvegarde de temps en temps.' : 'Tes spots sont privés : toi seul peux les voir.') + '</p>' +
      '<div class="actions"><button class="btn btn-small" data-act="export">Exporter une sauvegarde</button><button class="btn btn-small" data-act="import">Restaurer</button></div><div class="actions"><button class="btn btn-small btn-primary" data-act="importPlaces">Importer mes lieux (Google Maps…)</button></div></div>';
    return out;
  };

  /* ---------- onglet Alertes ---------- */
  const notifBlock = () => {
    if (!('Notification' in globalThis)) return '<p class="fine">Ce navigateur ne gère pas les notifications. Les alertes restent visibles ici.</p>';
    const p = Notification.permission;
    if (p === 'granted') return '<p class="fine">Notifications activées. Elles partent quand l\'appli est ouverte (onglet ouvert ou appli installée sur l\'écran d\'accueil).</p>';
    if (p === 'denied') return '<p class="fine">Les notifications sont bloquées dans ce navigateur. Autorise-les dans les réglages du site pour les recevoir.</p>';
    return '<div class="notice"><span>Reçois une notification quand une alerte se déclenche.</span><button class="btn btn-small" data-act="notif">' + A.icon('bell') + 'Activer</button></div>';
  };

  const sessionLine = (spotName, day, lead) =>
    '<span class="al-name">' + esc(spotName) + '</span><span class="al-when">' + esc(U.fmtDay(day.date)) + ' · ' + esc(U.leadLabel(lead)) + '</span>' +
    '<span class="al-data"><b>' + esc(F.windowText(day.window)) + '</b> · ' + U.num(day.stats.wave) + ' m à ' + U.num(day.stats.period, 0) + ' s · vent ' + U.num(day.stats.wind, 0) + ' km/h ' + esc(U.compass(day.stats.windDir)) + '</span>';

  A.renderers.alerts = () => {
    let out = '<div class="head"><h2>Alertes</h2><button class="btn btn-small" data-act="refreshAll">Actualiser</button></div>' + notifBlock();
    if (!S.spots.length) return out + '<div class="empty"><p>Ajoute un spot et ses conditions idéales : les alertes apparaîtront ici.</p></div>';
    const loading = S.spots.some((s) => !S.fc[s.id] || (S.fc[s.id].status === 'loading' && !S.fc[s.id].days));
    out += '<h3>À ne pas rater</h3>';
    if (S.alerts.length) {
      out += '<ul class="alist">' + S.alerts.map((a) => {
        const sp = S.spots.find((s) => s.id === a.spotId);
        const day = S.fc[a.spotId].days.find((d) => d.date === a.date);
        return '<li class="al al--lead' + Math.min(a.lead, 3) + '">' + sessionLine(a.spotName, day, a.lead) +
          (S.store.social && sp ? '<button class="btn btn-small" data-act="shareSession" data-id="' + esc(a.spotId) + '" data-date="' + esc(a.date) + '">' + A.icon('share') + 'Partager la session</button>' : '') + '</li>';
      }).join('') + '</ul>';
    } else {
      out += '<p class="muted">' + (loading ? 'Calcul en cours…' : 'Aucune alerte aujourd\'hui. Elles se déclenchent selon les délais choisis pour chaque spot (7 jours, 3 jours, la veille, le matin même).') + '</p>';
    }
    const shown = new Set(S.alerts.map((a) => a.spotId + '|' + a.date));
    const others = S.upcoming.filter((u) => !shown.has(u.spot.id + '|' + u.day.date));
    out += '<h3>' + (S.alerts.length ? 'Autres sessions à venir' : 'Prochaines bonnes sessions') + '</h3>';
    if (others.length) {
      out += '<ul class="alist">' + others.map((u) =>
        '<li class="al">' + sessionLine(u.spot.name, u.day, u.lead) +
        (S.store.social ? '<button class="btn btn-small" data-act="shareSession" data-id="' + esc(u.spot.id) + '" data-date="' + esc(u.day.date) + '">' + A.icon('share') + 'Partager la session</button>' : '') + '</li>').join('') + '</ul>';
    } else {
      out += '<p class="muted">' + (loading ? 'Calcul en cours…' : S.alerts.length ? 'Pas d\'autre session sur les 8 prochains jours.' : 'Aucune session ne correspond à tes critères sur les 8 prochains jours. Tu peux élargir les seuils dans la fiche de chaque spot.') + '</p>';
    }
    out += '<p class="fine">Les prévisions à 7 jours sont moins fiables que celles du jour même. Les alertes se calculent quand l\'appli est ouverte.</p>';
    return out;
  };

  /* ---------- actions ---------- */
  Object.assign(A.actions, {
    add() { if (S.adding) { A.stopAdd(); } else { A.startAdd(); A.toast('Touche la carte pour placer le spot'); } },
    select(el) { const id = el.dataset.id; if (S.selectedId === id) { S.selectedId = null; A.render(); } else A.selectSpot(id, true); },
    edit(el) { A.openSpotDialog(S.spots.find((s) => s.id === el.dataset.id)); },
